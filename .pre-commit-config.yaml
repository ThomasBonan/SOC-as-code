repos:
  # ── Secrets scanning ──────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── Generic file hygiene ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]          # allows Jinja2 tags in YAML
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # ── YAML linting ──────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint]
        exclude: ^iac/

  # ── Ansible linting ───────────────────────────────────────────────
  - repo: https://github.com/ansible/ansible-lint
    rev: v25.1.3
    hooks:
      - id: ansible-lint
        args: [--profile=production]
        files: ^ansible/
        types: [file]
        additional_dependencies:
          - ansible-core>=2.15

  # ── Terraform / OpenTofu ─────────────────────────────────────────
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.3
    hooks:
      - id: terraform_fmt
        files: ^iac/
      - id: terraform_validate
        files: ^iac/
      - id: terraform_tflint
        files: ^iac/
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # ── GitOps ConfigMap checksums ───────────────────────────────────
  # Garde l'annotation checksum/script du Deployment risk-engine en phase
  # avec le contenu de la ConfigMap soc-risk-engine-app-script. Sans ce
  # bump, ArgoCD sync la ConfigMap mais le pod n'est pas redémarré
  # (bug observé 2026-05-17, policy_version reste figé sur l'ancienne valeur).
  - repo: local
    hooks:
      - id: bump-risk-engine-checksums
        name: bump risk-engine checksum/script annotation
        entry: python3 gitops/environments/lab/risk-engine/_bump-checksums.py
        language: system
        pass_filenames: false
        files: ^gitops/environments/lab/risk-engine/configmap-app-script\.yaml$
