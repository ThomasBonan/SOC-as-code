# --- Grafana admin password ---
- name: Vault fetch | Lire grafana_admin_password depuis Vault
  ansible.builtin.shell: >
    {{ _vfb_exec }} vault kv get -field=password
    {{ _vfb_kv_mount }}/bootstrap/grafana
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _vfb_grafana_pass
  changed_when: false
  no_log: true
  failed_when: _vfb_grafana_pass.rc != 0
  tags: always

- name: Vault fetch | Définir grafana_admin_password comme fact
  ansible.builtin.set_fact:
    grafana_admin_password: "{{ _vfb_grafana_pass.stdout }}"
  no_log: true
  tags: always

# --- Wazuh OpenSearch dashboard password ---
# Seedé depuis K8s (soc-wazuh doit exister) — peut être absent en phase early.
- name: Vault fetch | Lire wazuh_dashboard_password depuis Vault
  ansible.builtin.shell: >
    {{ _vfb_exec }} vault kv get -field=dashboard_password
    {{ _vfb_kv_mount }}/credentials/wazuh-credentials
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _vfb_wazuh_dashboard_pass
  changed_when: false
  no_log: true
  failed_when: false
  tags: always

- name: Vault fetch | Définir wazuh_dashboard_password comme fact
  ansible.builtin.set_fact:
    wazuh_dashboard_password: "{{ _vfb_wazuh_dashboard_pass.stdout | default('') }}"
  no_log: true
  when: _vfb_wazuh_dashboard_pass.rc == 0
  tags: always

# --- ArgoCD admin password ---
- name: Vault fetch | Lire argocd_admin_password depuis Vault
  ansible.builtin.shell: >
    {{ _vfb_exec }} vault kv get -field=password
    {{ _vfb_kv_mount }}/bootstrap/argocd
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: _vfb_argocd_pass
  changed_when: false
  no_log: true
  failed_when: _vfb_argocd_pass.rc != 0
  tags: always

- name: Vault fetch | Définir argocd_admin_password comme fact
  ansible.builtin.set_fact:
    argocd_admin_password: "{{ _vfb_argocd_pass.stdout }}"
  no_log: true
  tags: always

- name: Vault fetch | Bootstrap passwords chargés depuis Vault
  ansible.builtin.debug:
    msg: >-
      Bootstrap passwords résolus depuis Vault KV pour TheHive, Cortex,
      Shuffle, Grafana, Wazuh et ArgoCD.
  tags: always
