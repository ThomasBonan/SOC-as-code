---
# soc_foundations/tasks/rbac_misp.yml
# Crée un compte de service MISP avec le rôle Sync User (role_id=3).
#
# Idempotence : si le K8s Secret misp-sa-foundations existe déjà, skip.
#
# Bootstrap admin : on utilise toujours Cake CLI pour obtenir une authkey
# admin fraîche (cake User resetauthkey <email>). Cela contourne
# advanced_authkeys (hash bcrypt en DB au lieu de plaintext) et garantit
# un token API valide sans dépendance MariaDB.
#
# Après création du SA via API, Cake CLI est aussi utilisé pour l'authkey SA.

- name: MISP RBAC - vérifier si le Secret SA existe déjà
  kubernetes.core.k8s_info:
    kubeconfig: "{{ soc_foundations_kubeconfig_path }}"
    kind: Secret
    namespace: "{{ soc_namespaces.misp }}"
    name: "{{ soc_foundations_misp_sa_secret_name }}"
  register: _sf_misp_sa_secret_existing
  no_log: true
  changed_when: false

# --- Lecture de l'email admin ---

- name: MISP RBAC - lire misp-app-secret (admin_email)
  kubernetes.core.k8s_info:
    kubeconfig: "{{ soc_foundations_kubeconfig_path }}"
    kind: Secret
    namespace: "{{ soc_namespaces.misp }}"
    name: "{{ soc_foundations_misp_admin_secret_name }}"
  register: _sf_misp_admin_secret
  when: _sf_misp_sa_secret_existing.resources | length == 0
  no_log: true
  changed_when: false

- name: MISP RBAC - fail si misp-app-secret est absent
  ansible.builtin.fail:
    msg: >-
      Secret {{ soc_namespaces.misp }}/{{ soc_foundations_misp_admin_secret_name }} introuvable.
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
    - _sf_misp_admin_secret.resources | length == 0

- name: MISP RBAC - fail si admin_email manquant dans misp-app-secret
  ansible.builtin.fail:
    msg: >-
      Secret {{ soc_namespaces.misp }}/{{ soc_foundations_misp_admin_secret_name }}
      ne contient pas la clé {{ soc_foundations_misp_admin_email_secret_key }}.
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
    - _sf_misp_admin_secret.resources | length > 0
    - soc_foundations_misp_admin_email_secret_key not in (_sf_misp_admin_secret.resources[0].data | default({}))

- name: MISP RBAC - résoudre l'email admin MISP
  ansible.builtin.set_fact:
    _sf_misp_admin_email: >-
      {{
        _sf_misp_admin_secret.resources[0].data[soc_foundations_misp_admin_email_secret_key]
        | b64decode
      }}
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
    - _sf_misp_admin_secret.resources | length > 0
    - soc_foundations_misp_admin_email_secret_key in (_sf_misp_admin_secret.resources[0].data | default({}))
  no_log: true

# --- Trouver le pod MISP app ---

- name: MISP RBAC - trouver le pod MISP app (pour Cake CLI)
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_foundations_kubeconfig_path }}
    -n {{ soc_namespaces.misp }} get pods
    -l app=misp
    --field-selector=status.phase=Running
    -o jsonpath={.items[0].metadata.name}
  register: _sf_misp_app_pod
  changed_when: false
  retries: 12
  delay: 10
  until: _sf_misp_app_pod.stdout | length > 0
  when: _sf_misp_sa_secret_existing.resources | length == 0

- name: MISP RBAC - fail si pod MISP introuvable
  ansible.builtin.fail:
    msg: >-
      Aucun pod MISP Running trouvé dans {{ soc_namespaces.misp }} (label app=misp).
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
    - (_sf_misp_app_pod.stdout | default('') | length) == 0

# --- Obtenir une authkey admin fraîche via Cake CLI ---
# Cake CLI génère une nouvelle clé valide quelle que soit la valeur de
# Security.advanced_authkeys (plaintext ou hash bcrypt en DB).

- name: MISP RBAC - reset authkey admin via Cake CLI
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_foundations_kubeconfig_path }}"
      - -n
      - "{{ soc_namespaces.misp }}"
      - exec
      - "{{ _sf_misp_app_pod.stdout }}"
      - --
      - bash
      - /var/www/MISP/app/Console/cake
      - user
      - change_authkey
      - "{{ _sf_misp_admin_email }}"
  register: _sf_misp_cake_admin_reset
  changed_when: true
  failed_when: false
  no_log: true
  when: _sf_misp_sa_secret_existing.resources | length == 0

- name: MISP RBAC - extraire authkey admin (clé hex 40 chars dans la sortie Cake)
  ansible.builtin.set_fact:
    _sf_misp_admin_authkey: >-
      {{
        (
          _sf_misp_cake_admin_reset.stdout
          | regex_findall('[0-9a-zA-Z]{40}')
          + ['']
        ) | first
      }}
  no_log: true
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
    - _sf_misp_cake_admin_reset.stdout | default('') | length > 0

- name: MISP RBAC - fail si Cake CLI n'a pas retourné d'authkey admin
  ansible.builtin.fail:
    msg: >-
      cake user change_authkey {{ _sf_misp_admin_email }} n'a pas retourné de clé.
      RC={{ _sf_misp_cake_admin_reset.rc | default('?') }}
      Sortie={{ _sf_misp_cake_admin_reset.stdout | default('(vide)') }}
      Stderr={{ _sf_misp_cake_admin_reset.stderr | default('(vide)') }}
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
    - (_sf_misp_admin_authkey | default('') | trim | length) == 0

# --- Résoudre l'API base (ingress fallback) ---

- name: MISP RBAC - résoudre l'API base effective (ingress si .svc non atteignable)
  ansible.builtin.set_fact:
    _sf_misp_api_base: >-
      {{
        (
          ('.svc' in soc_foundations_misp_api_base)
          and (soc_foundations_misp_ingress_api_base | length > 0)
        )
        | ternary(soc_foundations_misp_ingress_api_base, soc_foundations_misp_api_base)
      }}
  when: _sf_misp_sa_secret_existing.resources | length == 0

# --- Vérifier si le compte SA MISP existe déjà ---

- name: MISP RBAC - lister les utilisateurs MISP via API
  ansible.builtin.uri:
    url: "{{ _sf_misp_api_base }}admin/users/index"
    method: GET
    headers:
      Authorization: "{{ _sf_misp_admin_authkey }}"
      Accept: "application/json"
    validate_certs: "{{ soc_foundations_validate_certs }}"
    status_code:
      - 200
    return_content: true
    timeout: "{{ soc_foundations_http_timeout | int }}"
  register: _sf_misp_users_list
  when: _sf_misp_sa_secret_existing.resources | length == 0
  retries: "{{ soc_foundations_http_retries | int }}"
  delay: "{{ soc_foundations_http_delay | int }}"
  until: _sf_misp_users_list.status == 200
  no_log: true

- name: MISP RBAC - détecter si le SA email est déjà enregistré
  ansible.builtin.set_fact:
    _sf_misp_sa_user_exists: >-
      {{
        (_sf_misp_users_list.json | default([]))
        | selectattr('User.email', 'defined')
        | selectattr('User.email', 'equalto', soc_foundations_misp_sa_email)
        | list
        | length > 0
      }}
  when: _sf_misp_sa_secret_existing.resources | length == 0
  no_log: true

# --- Créer le compte SA si absent ---

- name: MISP RBAC - créer le compte de service via API MISP
  ansible.builtin.uri:
    url: "{{ _sf_misp_api_base }}admin/users/add"
    method: POST
    headers:
      Authorization: "{{ _sf_misp_admin_authkey }}"
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      email: "{{ soc_foundations_misp_sa_email }}"
      org_id: "{{ soc_foundations_misp_sa_org_id | int }}"
      role_id: "{{ soc_foundations_misp_sa_role_id | int }}"
      password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      change_pw: "0"
    validate_certs: "{{ soc_foundations_validate_certs }}"
    status_code:
      - 200
      - 201
    return_content: true
    timeout: "{{ soc_foundations_http_timeout | int }}"
  register: _sf_misp_sa_create
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
    - not (_sf_misp_sa_user_exists | bool)
  no_log: true

# --- Obtenir l'authkey SA via Cake CLI ---
# change_authkey crée une entrée valide dans auth_keys (advanced_authkeys)
# ou met à jour users.authkey (mode classique). Dans les deux cas la clé
# retournée est immédiatement utilisable pour l'API.

- name: MISP RBAC - reset authkey SA via Cake CLI
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_foundations_kubeconfig_path }}"
      - -n
      - "{{ soc_namespaces.misp }}"
      - exec
      - "{{ _sf_misp_app_pod.stdout }}"
      - --
      - bash
      - /var/www/MISP/app/Console/cake
      - user
      - change_authkey
      - "{{ soc_foundations_misp_sa_email }}"
  register: _sf_misp_sa_cake_reset
  changed_when: true
  failed_when: false
  no_log: true
  when: _sf_misp_sa_secret_existing.resources | length == 0

- name: MISP RBAC - extraire authkey SA (clé hex 40 chars dans la sortie Cake)
  ansible.builtin.set_fact:
    _sf_misp_sa_authkey: >-
      {{
        (
          _sf_misp_sa_cake_reset.stdout
          | regex_findall('[0-9a-zA-Z]{40}')
          + ['']
        ) | first
      }}
  no_log: true
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
    - _sf_misp_sa_cake_reset.stdout | default('') | length > 0

- name: MISP RBAC - fail si Cake CLI n'a pas retourné d'authkey SA
  ansible.builtin.fail:
    msg: >-
      cake user change_authkey {{ soc_foundations_misp_sa_email }} n'a pas retourné de clé.
      RC={{ _sf_misp_sa_cake_reset.rc | default('?') }}
      Sortie={{ _sf_misp_sa_cake_reset.stdout | default('(vide)') }}
      Stderr={{ _sf_misp_sa_cake_reset.stderr | default('(vide)') }}
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
    - (_sf_misp_sa_authkey | default('') | trim | length) == 0

# --- Stocker l'authkey SA dans K8s Secret ---

- name: MISP RBAC - stocker l'authkey dans un K8s Secret (create-once)
  kubernetes.core.k8s:
    kubeconfig: "{{ soc_foundations_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ soc_foundations_misp_sa_secret_name }}"
        namespace: "{{ soc_namespaces.misp }}"
        labels:
          app.kubernetes.io/managed-by: soc-foundations
          soc.lab/service: misp
          soc.lab/secret-type: service-account
        annotations:
          soc.lab/sa-email: "{{ soc_foundations_misp_sa_email }}"
          soc.lab/sa-role-id: "{{ soc_foundations_misp_sa_role_id | string }}"
          soc.lab/environment: "{{ soc_environment | default('dev') }}"
      type: Opaque
      stringData: >-
        {{
          {
            soc_foundations_misp_sa_secret_key_email: soc_foundations_misp_sa_email,
            soc_foundations_misp_sa_secret_key_authkey: _sf_misp_sa_authkey
          }
        }}
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
  no_log: true

# --- Écrire l'authkey SA dans Vault (backend=vault) ---

- name: MISP RBAC - bloc écriture Vault (backend=vault)
  when:
    - _sf_misp_sa_secret_existing.resources | length == 0
    - soc_vault_backend | default('kubernetes-secrets') == 'vault'
  no_log: true
  block:
    - name: MISP RBAC - lire le root token Vault
      kubernetes.core.k8s_info:
        kubeconfig: "{{ soc_foundations_kubeconfig_path }}"
        kind: Secret
        namespace: "{{ soc_vault_namespace | default('soc-vault') }}"
        name: "vault-unseal-keys"
      register: _sf_misp_vault_token_secret
      failed_when: _sf_misp_vault_token_secret.resources | length == 0

    - name: MISP RBAC - définir _sf_misp_vault_exec
      ansible.builtin.set_fact:
        _sf_misp_vault_exec: >-
          kubectl exec -n {{ soc_vault_namespace | default('soc-vault') }} vault-0 --
          env VAULT_TOKEN={{ _sf_misp_vault_token_secret.resources[0].data.root_token | b64decode }}

    - name: MISP RBAC - vérifier si service-accounts/misp-sa existe dans Vault
      ansible.builtin.shell: >
        {{ _sf_misp_vault_exec }} vault kv get -tls-skip-verify -format=json
        {{ soc_vault_kv_mount }}/service-accounts/misp-sa
      register: _sf_misp_vault_check
      changed_when: false
      failed_when: false
      environment:
        KUBECONFIG: "{{ soc_foundations_kubeconfig_path }}"

    - name: MISP RBAC - écrire authkey+email dans Vault (service-accounts/misp-sa)
      ansible.builtin.shell: >
        {{ _sf_misp_vault_exec }} vault kv put -tls-skip-verify
        {{ soc_vault_kv_mount }}/service-accounts/misp-sa
        authkey="{{ _sf_misp_sa_authkey }}"
        email="{{ soc_foundations_misp_sa_email }}"
      changed_when: true
      when: _sf_misp_vault_check.rc != 0
      environment:
        KUBECONFIG: "{{ soc_foundations_kubeconfig_path }}"

- name: MISP RBAC - rapport de statut
  ansible.builtin.debug:
    msg: >-
      MISP SA '{{ soc_foundations_misp_sa_email }}'
      (role_id={{ soc_foundations_misp_sa_role_id }}).
      Secret : {{ soc_namespaces.misp }}/{{ soc_foundations_misp_sa_secret_name }}.
      Action : {{ 'ignoré (déjà existant)' if _sf_misp_sa_secret_existing.resources | length > 0 else 'créé' }}.
