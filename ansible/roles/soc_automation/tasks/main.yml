---
# ════════════════════════════════════════════════════════════════════════════════
# soc_automation — Task orchestrator
# Orchestration déléguée à Shuffle SOAR (165-shuffle.yml).
# Ce rôle crée les prérequis : credentials agrégés + politique MISP + webhook Wazuh.
# Uses import_tasks (static) so tags on this file propagate to sub-tasks.
# ════════════════════════════════════════════════════════════════════════════════

- name: "soc_automation | Preflight — verify SA credentials from 170"
  import_tasks: preflight.yml
  when: soc_automation_enable_preflight | bool
  tags:
    - bootstrap
    - soc_automation

- name: "soc_automation | Credentials — créer le Secret agrégé pour Shuffle"
  import_tasks: credentials.yml
  when: soc_automation_enable_credentials | bool
  tags:
    - integration
    - soc_automation

- name: "soc_automation | MISP push policy — stocker la politique IOC"
  import_tasks: misp_push_policy.yml
  when: soc_automation_enable_cortex_to_misp | bool
  tags:
    - integration
    - soc_automation

- name: "soc_automation | Wazuh manager labels — injecter asset_type / environment"
  import_tasks: wazuh_manager_labels.yml
  when: soc_automation_enable_wazuh_manager_labels | default(true) | bool
  tags:
    - integration
    - labels
    - soc_automation

- name: "soc_automation | Wazuh webhook — injecter l'intégration Shuffle dans ossec.conf"
  import_tasks: wazuh_webhook.yml
  when: soc_automation_enable_wazuh_webhook | bool
  tags:
    - integration
    - soc_automation

- name: "soc_automation | Wazuh selftest scenarios — rules 999901-999903 + décodeurs IOC"
  import_tasks: wazuh_selftest_scenarios.yml
  when: soc_automation_enable_wazuh_selftest_scenarios | default(true) | bool
  tags:
    - integration
    - selftest
    - soc_automation

- name: "soc_automation | Wazuh noise suppression — override règles Sysmon bruyantes (FP)"
  import_tasks: wazuh_noise_suppression.yml
  when: soc_automation_enable_noise_suppression | default(true) | bool
  tags:
    - integration
    - noise
    - soc_automation

- name: "soc_automation | Wazuh AR scripts — déployer isolate-agent + disable-account + whitelists"
  import_tasks: wazuh_ar_scripts.yml
  when: soc_automation_enable_ar_scripts | bool
  tags:
    - integration
    - ar
    - soc_automation

- name: "soc_automation | File-drop collector — règle de classification + déclencheur AR (Phase 9.2)"
  import_tasks: wazuh_filedrop_collector.yml
  when: soc_automation_enable_filedrop_rules | default(true) | bool
  tags:
    - integration
    - filedrop
    - soc_automation

- name: "soc_automation | FIM agent.conf — voie sans script (syscheck -> sha256 hash) (Phase 9.2)"
  import_tasks: wazuh_fim_agent_conf.yml
  when: soc_automation_enable_fim_agent_conf | default(false) | bool
  tags:
    - integration
    - filedrop
    - fim
    - soc_automation

- name: "soc_automation | Règles evidence-grade — détections haute-fidélité (Phase 10 / B)"
  import_tasks: wazuh_evidence_rules.yml
  when: soc_automation_enable_evidence_rules | default(true) | bool
  tags:
    - integration
    - evidence
    - soc_automation
