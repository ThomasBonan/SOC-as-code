---
# ════════════════════════════════════════════════════════════════════════════════
# wazuh_webhook.yml — Injecter le bloc integration Shuffle dans ossec.conf
# tag: integration
# ════════════════════════════════════════════════════════════════════════════════
#
# Lit l'URL du webhook Shuffle depuis le ConfigMap soc-shuffle-webhook-config
# (créé par 185-shuffle.yml → tasks/workflows.yml) et l'injecte dans ossec.conf
# du Wazuh Manager via kubectl exec.
#
# Le bloc injecté :
#   <integration>
#     <name>shuffle</name>
#     <hook_url>http://shuffle-backend.soc-shuffle.svc:5001/api/v1/hooks/webhook_XXX</hook_url>
#     <level>9</level>
#     <alert_format>json</alert_format>
#   </integration>
#
# Séquence d'exécution :
#   1. 170-soc-foundations.yml
#   2. 180-soc-automation.yml  → crée soc-automation-worker-creds ;
#                                 wazuh_webhook IGNORÉ (Shuffle pas encore déployé)
#   3. 185-shuffle.yml         → déploie Shuffle, importe workflows,
#                                 crée soc-shuffle-webhook-config
#   4. 180-soc-automation.yml  → wazuh_webhook EXÉCUTÉ (ConfigMap présent)
#
# Idempotence strategy:
#   - K8s API operations (marker, ConfigMap reads): marker ConfigMap guards first-run.
#   - In-pod files (ossec.conf, rules XML): checked EVERY run because pod filesystem
#     is ephemeral — files are lost on pod restart. These checks are self-idempotent
#     (grep before write, no-op if already present).

# ── Lire le ConfigMap webhook (always — needed for in-pod repairs) ──

- name: "wazuh_webhook | Lire ConfigMap soc-shuffle-webhook-config"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ soc_automation_kubeconfig_path }}"
    kind: ConfigMap
    namespace: "{{ soc_automation_shuffle_webhook_configmap_ns }}"
    name: "{{ soc_automation_shuffle_webhook_configmap_name }}"
  register: _ww_shuffle_config
  changed_when: false

- name: "wazuh_webhook | Avertissement — ConfigMap Shuffle absent, étape ignorée"
  when: _ww_shuffle_config.resources | default([]) | length == 0
  ansible.builtin.debug:
    msg: >-
      ConfigMap {{ soc_automation_shuffle_webhook_configmap_name }} introuvable.
      wazuh_webhook ignoré — exécuter 185-shuffle.yml (--tags workflows)
      puis relancer 180-soc-automation.yml pour injecter le webhook dans Wazuh.

# ── Extract webhook URL (needed by both first-run block and repair tasks) ──

- name: "wazuh_webhook | Extraire l'URL du webhook (legacy alert-triage)"
  when:
    - _ww_shuffle_config.resources | default([]) | length > 0
    - _ww_shuffle_config.resources[0].data.webhook_url is defined
  ansible.builtin.set_fact:
    _ww_hook_url: "{{ _ww_shuffle_config.resources[0].data.webhook_url }}"

# Multi-scenario: parse webhook_urls (dict scenario_key -> URL) et scenarios_meta
# (dict scenario_key -> {workflow_id, rule_ids, ar_command, ...}) écrits par
# roles/shuffle/tasks/workflows.yml. Si les champs sont absents (ancien marker
# pré-multi-scenario), on retombe sur le seul alert-triage legacy.
- name: "wazuh_webhook | Extraire webhook_urls + scenarios_meta (multi-scenario)"
  when:
    - _ww_shuffle_config.resources | default([]) | length > 0
  ansible.builtin.set_fact:
    _ww_webhook_urls: >-
      {{
        (_ww_shuffle_config.resources[0].data.webhook_urls | default('{}'))
        | from_json
      }}
    _ww_scenarios_meta: >-
      {{
        (_ww_shuffle_config.resources[0].data.scenarios_meta | default('{}'))
        | from_json
      }}

# Construire la liste finale d'intégrations Wazuh à injecter:
#   - 1 entrée par scenario (avec rule_ids filtré)
#   - 1 fallback alert-triage en queue (sans rule_id => attrape tout le reste
#     au-dessus du min_level configuré) — OPTIONNEL via toggle
#
# Pourquoi le fallback est désactivé par défaut :
# wazuh-integratord n'a pas de syntaxe d'exclusion ; un fallback sans rule_id
# attrape AUSSI les alertes qui matchent déjà un scenario, ce qui crée DEUX
# integrations <integration> pour la même alerte → deux workers Shuffle
# concurrents → service shuffle-workers load-balance les callbacks http app sur
# le mauvais worker → workflow ABORTED (cas vécu lab K8s Shuffle 1.4 où l'IP
# du worker n'est pas isolée). Activer uniquement si :
#   - les scenarios couvrent suffisamment de cas pour ne pas nécessiter
#     un catchall (alerts hors-scenario non workflow-traitées sont OK)
#   - OU Shuffle 1.5+ avec K8s native worker routing
- name: "wazuh_webhook | Construire la liste des intégrations Wazuh"
  when: _ww_hook_url is defined
  ansible.builtin.set_fact:
    _ww_integrations: >-
      {{
        (
          _ww_scenarios_meta | default({}) | dict2items
          | map('combine', {'kind': 'scenario'})
          | list
        )
        +
        (
          (soc_automation_wazuh_behavior_routing.enabled | default(false) | bool)
          | ternary(
              [{
                'key': 'behavior',
                'kind': 'behavior',
                'value': {
                  'workflow_id': (_ww_shuffle_config.resources[0].data.triage_workflow_id | default('')),
                  'webhook_url': _ww_hook_url,
                  'rule_ids':    [],
                  'group':       (soc_automation_wazuh_behavior_routing.group | default('sysmon_eid1_detections')),
                  'min_level':   (soc_automation_wazuh_behavior_routing.min_level | default(3)),
                  'description': 'Behavioral routing (group-scoped) -> alert-triage MITRE+YARA',
                  'ar_command':  ''
                }
              }],
              []
            )
        )
        +
        (
          (soc_automation_wazuh_webhook_enable_fallback | default(false) | bool)
          | ternary(
              [{
                'key': 'fallback',
                'kind': 'fallback',
                'value': {
                  'workflow_id': (_ww_shuffle_config.resources[0].data.triage_workflow_id | default('')),
                  'webhook_url': _ww_hook_url,
                  'rule_ids':    [],
                  'description': 'Generic alert-triage fallback (no rule_id filter)',
                  'ar_command':  ''
                }
              }],
              []
            )
        )
      }}

# Logging: visibilité sur les intégrations qui vont être écrites
- name: "wazuh_webhook | [info] intégrations Wazuh prévues"
  when: _ww_hook_url is defined
  ansible.builtin.debug:
    msg: >-
      Integration #{{ idx }}:
      kind={{ item.kind }},
      key={{ item.key }},
      rule_ids={{ item.value.rule_ids | default([]) | to_json }},
      url={{ item.value.webhook_url }}
  loop: "{{ _ww_integrations | default([]) }}"
  loop_control:
    index_var: idx
    label: "{{ item.key }}"

# ════════════════════════════════════════════════════════════════════════════════
# SECTION 1 — In-pod file repairs (ALWAYS run, self-idempotent)
# These files live on ephemeral pod storage and can be lost on pod restart.
# The marker ConfigMap does NOT protect these — they must be checked every run.
# ════════════════════════════════════════════════════════════════════════════════

# ── Python requests module (ephemeral — repair on every run) ─────
# The Wazuh Docker/Kubernetes image does NOT include python3-requests.
# The shuffle.py integration script (at /var/ossec/integrations/shuffle)
# uses `import requests` to POST alerts to the Shuffle webhook.
# Without it, integratord silently fails with:
#   ModuleNotFoundError: No module named 'requests'
# See: https://github.com/wazuh/wazuh-kubernetes/issues/330
#      https://github.com/wazuh/wazuh-docker/issues/788

- name: "wazuh_webhook | Vérifier si python3-requests est installé dans le pod Wazuh"
  when: _ww_hook_url is defined
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    python3 -c "import requests; print('requests OK')"
  register: _ww_requests_check
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Installer python3-requests dans le pod Wazuh"
  when:
    - _ww_hook_url is defined
    - _ww_requests_check.rc | default(1) != 0
  ansible.builtin.shell: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    bash -c '
      if python3 -m pip --version >/dev/null 2>&1; then
        python3 -m pip install --quiet requests;
      elif command -v yum >/dev/null 2>&1; then
        yum install -y -q python3-requests;
      elif command -v microdnf >/dev/null 2>&1; then
        microdnf install -y python3-requests;
      elif command -v apk >/dev/null 2>&1; then
        apk add --quiet py3-requests;
      elif command -v apt-get >/dev/null 2>&1; then
        apt-get update -qq && apt-get install -y -qq python3-requests;
      else
        python3 -m ensurepip --default-pip 2>/dev/null && python3 -m pip install --quiet requests;
      fi &&
      python3 -c "import requests; print(\"requests OK\")"
    '
  register: _ww_requests_install
  changed_when: _ww_requests_install.rc == 0

- name: "wazuh_webhook | Confirmer l'installation de python3-requests"
  when: _ww_hook_url is defined
  ansible.builtin.debug:
    msg: "{{ _ww_requests_install.stdout_lines | default(['python3-requests déjà présent']) | last }}"
  changed_when: false

# ── Permissions du script d'intégration Shuffle (ephemeral) ──────
# Le script /var/ossec/integrations/shuffle doit être exécutable (750)
# pour que integratord puisse l'appeler.

- name: "wazuh_webhook | Vérifier les permissions du script shuffle integration"
  when: _ww_hook_url is defined
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    test -x /var/ossec/integrations/shuffle
  register: _ww_shuffle_script_check
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Corriger les permissions du script shuffle integration"
  when:
    - _ww_hook_url is defined
    - _ww_shuffle_script_check.rc | default(1) != 0
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    chmod 750 /var/ossec/integrations/shuffle
  register: _ww_shuffle_perms
  changed_when: _ww_shuffle_perms.rc == 0

# ── Selftest rule 999999 (ephemeral — repair on every run) ───────
# Necessary for 210-soc-selftest.yml (inject_via_wazuh=true).
# The rule matches "soc-selftest-test-event" (inject | [B]) and triggers
# the Shuffle integration → full E2E pipeline.

- name: "wazuh_webhook | Vérifier si la règle selftest 999999 existe au bon level"
  # Match BOTH id and level — un fichier existant avec un level obsolète (ex. 5)
  # doit être réécrit, sinon l'intégrateur Wazuh (filtre level≥{{ soc_automation_wazuh_webhook_min_level }})
  # ignore la rule et le webhook Shuffle ne part jamais.
  when: _ww_hook_url is defined
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    grep -rE 'id="999999"[^/]*level="10"' /var/ossec/etc/rules/
  register: _ww_rule_check
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Déployer la règle Wazuh selftest (rule 999999, level 10)"
  when:
    - _ww_hook_url is defined
    - _ww_rule_check.rc | default(1) != 0
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - python3
      - -c
      - |
        rule_xml = (
            '<group name="soc-selftest">\n'
            '  <rule id="999999" level="10">\n'
            '    <match>soc-selftest-test-event</match>\n'
            '    <description>SOC Self-Test synthetic alert injection (210-soc-selftest)</description>\n'
            '    <group>soc-selftest</group>\n'
            '  </rule>\n'
            '</group>\n'
        )
        rule_file = '/var/ossec/etc/rules/soc_selftest_rules.xml'
        with open(rule_file, 'w') as f:
            f.write(rule_xml)
        print('Regle 999999 ecrite (level=10) dans ' + rule_file)
  register: _ww_rule_deploy
  changed_when: _ww_rule_deploy.rc | default(1) == 0

- name: "wazuh_webhook | Confirmer le déploiement de la règle 999999"
  when: _ww_hook_url is defined
  ansible.builtin.debug:
    msg: "{{ _ww_rule_deploy.stdout | default('Règle 999999 déjà présente — aucune modification') }}"
  changed_when: false

# ── Décodeur syslog srcip (ephemeral — repair on every run) ─────
# Wazuh n'extrait pas srcip des logs syslog sans décodeur.
# Sans ce décodeur, $exec.data.srcip est vide dans Shuffle →
# observable TheHive invalide → échec de la chaîne.
# Le décodeur extrait srcip=X.X.X.X des logs syslog SOC (selftest + alertes réseau).

- name: "wazuh_webhook | Vérifier si le décodeur soc-syslog.xml existe"
  when: _ww_hook_url is defined
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    test -f /var/ossec/etc/decoders/soc-syslog.xml
  register: _ww_decoder_check
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Déployer le décodeur soc-syslog.xml (extraction srcip)"
  when: _ww_hook_url is defined
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - python3
      - -c
      - |
        import os
        os.makedirs('/var/ossec/etc/decoders', exist_ok=True)
        decoder_xml = (
            '<decoder name="soc-syslog-net">\n'
            '  <program_name>soc-selftest</program_name>\n'
            '</decoder>\n'
            '<decoder name="soc-syslog-net-fields">\n'
            '  <parent>soc-syslog-net</parent>\n'
            '  <regex type="pcre2">srcip=(\\d+\\.\\d+\\.\\d+\\.\\d+)</regex>\n'
            '  <order>srcip</order>\n'
            '</decoder>\n'
        )
        decoder_file = '/var/ossec/etc/decoders/soc-syslog.xml'
        with open(decoder_file, 'w') as f:
            f.write(decoder_xml)
        print('Décodeur soc-syslog.xml écrit dans ' + decoder_file)
  register: _ww_decoder_deploy
  changed_when: _ww_decoder_deploy.rc | default(1) == 0

- name: "wazuh_webhook | Confirmer le déploiement du décodeur"
  when: _ww_hook_url is defined
  ansible.builtin.debug:
    msg: "{{ _ww_decoder_deploy.stdout | default('Décodeur soc-syslog.xml déjà présent — aucune modification') }}"
  changed_when: false

# ── Décodeur Sysmon Hashes (ephemeral — repair on every run) ────────────────────
# Sysmon ProcessCreate (event 1) emits a single field "Hashes" containing all
# digests in one string: "SHA1=...,SHA256=...,MD5=...,IMPHASH=...".
# Cortex hash analyzers (MalwareBazaar, CIRCLHashlookup) require a single hash.
# This decoder splits the field into data.hash_sha256/sha1/md5 so the Shuffle
# alert-triage workflow can pass the SHA256 alone to the hash analyzers.

# Le décodeur Sysmon hashes s'attache au décodeur natif `json` (qui parse les
# events Windows EventChannel envoyés en JSON par l'agent). NE PAS utiliser
# `<parent>windows_eventchannel</parent>` — c'est un alias virtuel utilisable
# uniquement dans `<decoded_as>` côté rules, pas un nom de décodeur réel
# (analysisd refuse de charger, code 2101 — cas vécu 2026-05-14).
# Le prematch SHA256= filtre pour ne s'exécuter que sur les events qui portent
# réellement le bloc Hashes Sysmon. Gated par toggle, default false.
- name: "wazuh_webhook | Déployer le décodeur Sysmon hashes (split Hashes field)"
  when:
    - _ww_hook_url is defined
    - soc_automation_deploy_sysmon_decoder | default(false) | bool
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - python3
      - -c
      - |
        import os
        os.makedirs('/var/ossec/etc/decoders', exist_ok=True)
        decoder_xml = (
            '<!-- soc-sysmon-hashes.xml — managed by 180-soc-automation -->\n'
            '<decoder name="soc-sysmon-hash-sha256">\n'
            '  <parent>json</parent>\n'
            '  <prematch type="pcre2">SHA256=[A-Fa-f0-9]{64}</prematch>\n'
            '  <regex type="pcre2">SHA256=([A-Fa-f0-9]{64})</regex>\n'
            '  <order>hash_sha256</order>\n'
            '</decoder>\n'
            '<decoder name="soc-sysmon-hash-sha1">\n'
            '  <parent>json</parent>\n'
            '  <prematch type="pcre2">SHA1=[A-Fa-f0-9]{40}</prematch>\n'
            '  <regex type="pcre2">SHA1=([A-Fa-f0-9]{40})</regex>\n'
            '  <order>hash_sha1</order>\n'
            '</decoder>\n'
            '<decoder name="soc-sysmon-hash-md5">\n'
            '  <parent>json</parent>\n'
            '  <prematch type="pcre2">MD5=[A-Fa-f0-9]{32}</prematch>\n'
            '  <regex type="pcre2">MD5=([A-Fa-f0-9]{32})</regex>\n'
            '  <order>hash_md5</order>\n'
            '</decoder>\n'
        )
        decoder_file = '/var/ossec/etc/decoders/soc-sysmon-hashes.xml'
        with open(decoder_file, 'w') as f:
            f.write(decoder_xml)
        print('Decodeur soc-sysmon-hashes.xml ecrit dans ' + decoder_file)
  register: _ww_sysmon_decoder_deploy
  changed_when: _ww_sysmon_decoder_deploy.rc | default(1) == 0

# Si le toggle est désactivé mais qu'un précédent run avec toggle=true a laissé
# le fichier en place, le retirer pour ne pas re-casser wazuh-analysisd au
# prochain restart.
- name: "wazuh_webhook | Nettoyer le décodeur Sysmon si toggle désactivé"
  when:
    - _ww_hook_url is defined
    - not (soc_automation_deploy_sysmon_decoder | default(false) | bool)
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - rm
      - -f
      - /var/ossec/etc/decoders/soc-sysmon-hashes.xml
  changed_when: false

# ── Rule Sysmon hacktools (level 12 — passe le filtre webhook_min_level) ──────
# Le ruleset Wazuh natif ne fait pas matcher Mimikatz à level >= 9 sur un simple
# ProcessCreate (sigma 92052 a des conditions trop spécifiques). Sans cette rule
# custom, l'event Sysmon ProcessCreate avec Image=mimikatz.exe matche seulement
# la rule générique 60106 (level 1) qui ne déclenche pas le webhook Shuffle.
# Gated par le même toggle que le décodeur — les deux n'ont de sens qu'avec
# Sysmon dans le scope.
- name: "wazuh_webhook | Déployer la rule Sysmon hacktools (level 12)"
  when:
    - _ww_hook_url is defined
    - soc_automation_deploy_sysmon_decoder | default(false) | bool
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - python3
      - -c
      - |
        import os
        os.makedirs('/var/ossec/etc/rules', exist_ok=True)
        rule_xml = (
            '<!-- soc_sysmon_hacktools.xml - managed by 180-soc-automation -->\n'
            '<group name="sysmon,hacktool,credential_dump,">\n'
            '  <rule id="100200" level="12">\n'
            '    <decoded_as>windows_eventchannel</decoded_as>\n'
            '    <field name="win.system.providerName">^Microsoft-Windows-Sysmon$</field>\n'
            '    <field name="win.system.eventID">^1$</field>\n'
            '    <field name="win.eventdata.image" type="pcre2">(?i)(mimikatz|lazagne|gsecdump|wce\\.exe|fgdump|pwdump|procdump.*lsass)</field>\n'
            '    <description>Sysmon - Hacktool credential-dump detected: $(win.eventdata.image)</description>\n'
            '    <mitre><id>T1003.001</id></mitre>\n'
            '  </rule>\n'
            '  <rule id="100201" level="12">\n'
            '    <decoded_as>windows_eventchannel</decoded_as>\n'
            '    <field name="win.system.providerName">^Microsoft-Windows-Sysmon$</field>\n'
            '    <field name="win.system.eventID">^1$</field>\n'
            '    <field name="win.eventdata.originalFileName" type="pcre2">(?i)(mimikatz|lazagne)</field>\n'
            '    <description>Sysmon - Hacktool via OriginalFileName: $(win.eventdata.originalFileName)</description>\n'
            '    <mitre><id>T1003.001</id></mitre>\n'
            '  </rule>\n'
            '  <rule id="100202" level="12">\n'
            '    <decoded_as>windows_eventchannel</decoded_as>\n'
            '    <field name="win.system.providerName">^Microsoft-Windows-Sysmon$</field>\n'
            '    <field name="win.system.eventID">^1$</field>\n'
            '    <field name="win.eventdata.description" type="pcre2">(?i)mimikatz</field>\n'
            '    <description>Sysmon - Hacktool via PE Description: $(win.eventdata.description)</description>\n'
            '    <mitre><id>T1003.001</id></mitre>\n'
            '  </rule>\n'
            '</group>\n'
        )
        rule_file = '/var/ossec/etc/rules/soc_sysmon_hacktools.xml'
        with open(rule_file, 'w') as f:
            f.write(rule_xml)
        print('Rule soc_sysmon_hacktools.xml ecrite dans ' + rule_file)
  register: _ww_sysmon_hacktools_deploy
  changed_when: _ww_sysmon_hacktools_deploy.rc | default(1) == 0

- name: "wazuh_webhook | Nettoyer la rule hacktools si toggle désactivé"
  when:
    - _ww_hook_url is defined
    - not (soc_automation_deploy_sysmon_decoder | default(false) | bool)
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - rm
      - -f
      - /var/ossec/etc/rules/soc_sysmon_hacktools.xml
  changed_when: false

# ── Ruleset: s'assurer que etc/rules ET etc/decoders sont inclus (ephemeral) ──
# Le fichier soc_selftest_rules.xml est dans /var/ossec/etc/rules/.
# Le <ruleset> de ossec.conf doit contenir <rule_dir>etc/rules</rule_dir>
# et <decoder_dir>etc/decoders</decoder_dir> sinon analysisd ne charge pas
# les règles/décodeurs personnalisés.

- name: "wazuh_webhook | Vérifier si etc/rules et etc/decoders sont dans le ruleset ossec.conf"
  when: _ww_hook_url is defined
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    bash -c 'grep -q "rule_dir>etc/rules" /var/ossec/etc/ossec.conf && grep -q "decoder_dir>etc/decoders" /var/ossec/etc/ossec.conf'
  register: _ww_ruledir_check
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Ajouter etc/rules et etc/decoders au ruleset ossec.conf"
  when:
    - _ww_hook_url is defined
    - _ww_ruledir_check.rc | default(1) != 0
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - python3
      - -c
      - |
        with open('/var/ossec/etc/ossec.conf', 'r') as f:
            content = f.read()
        closing_ruleset = '</ruleset>'
        if closing_ruleset not in content:
            raise ValueError('Tag </ruleset> non trouve dans ossec.conf')
        insert = ''
        if 'rule_dir>etc/rules' not in content:
            insert += '    <rule_dir>etc/rules</rule_dir>\n  '
        if 'decoder_dir>etc/decoders' not in content:
            insert += '    <decoder_dir>etc/decoders</decoder_dir>\n  '
        if insert:
            new_content = content.replace(closing_ruleset, insert + closing_ruleset)
            with open('/var/ossec/etc/ossec.conf', 'w') as f:
                f.write(new_content)
            print('ruleset mis a jour: ' + insert.strip())
        else:
            print('ruleset deja correct')
  register: _ww_ruledir_inject
  changed_when: _ww_ruledir_inject.rc | default(1) == 0

# ── Shuffle multi-integration block in ossec.conf (ephemeral — repair every run) ──
# Génère N blocs <integration> dans ossec.conf:
#   - 1 par scenario (filtré par <rule_id>list,...)
#   - 1 fallback alert-triage (pas de filtre rule_id)
# Le marker court-circuite l'écriture si la signature SHA-1 des integrations
# correspond déjà à celle présente dans ossec.conf.

# Calcule une signature stable des intégrations (utilisée pour skip rapide)
- name: "wazuh_webhook | Calculer la signature des intégrations"
  when: _ww_hook_url is defined
  ansible.builtin.set_fact:
    _ww_integrations_sig: >-
      {{
        (_ww_integrations | default([]) | to_json) | hash('sha1')
      }}

# Vérifie si la signature présente in-pod (comment) matche le calcul actuel
- name: "wazuh_webhook | Vérifier si la signature des intégrations est à jour"
  when: _ww_hook_url is defined
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    grep -q "soc-shuffle-integrations-sig:{{ _ww_integrations_sig }}" /var/ossec/etc/ossec.conf
  register: _ww_sig_check
  changed_when: false
  failed_when: false

# Backup horodaté pour rollback en cas de configcheck KO
- name: "wazuh_webhook | Backup ossec.conf avant écriture"
  when:
    - _ww_hook_url is defined
    - _ww_sig_check.rc | default(1) != 0
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - bash
      - -c
      - 'cp -a /var/ossec/etc/ossec.conf /var/ossec/etc/ossec.conf.bak-$(date +%Y%m%d%H%M%S) && ls -t /var/ossec/etc/ossec.conf.bak-* | tail -n +6 | xargs -r rm -f'
  register: _ww_backup
  changed_when: _ww_backup.rc == 0
  failed_when: _ww_backup.rc != 0

# Sérialise les intégrations en JSON et les passe à un Python in-pod via stdin.
# Le script remplace TOUS les blocs <integration><name>shuffle...</name></integration>
# existants (même multiples) par les nouveaux, puis ajoute la signature en commentaire.
- name: "wazuh_webhook | Injecter N blocs <integration> Shuffle dans ossec.conf"
  when:
    - _ww_hook_url is defined
    - _ww_sig_check.rc | default(1) != 0
  ansible.builtin.shell:
    cmd: >
      kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
      exec -i -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
      python3 -
    stdin: |
      import json, re, sys
      integrations = json.loads({{ _ww_integrations | to_json | to_json }})
      sig = '{{ _ww_integrations_sig }}'
      min_level = {{ soc_automation_wazuh_webhook_min_level | default(3) | int }}

      blocks = ['<!-- soc-shuffle-integrations-sig:' + sig + ' (managed by 180-soc-automation) -->']
      for entry in integrations:
          kind = entry.get('kind', 'scenario')
          v = entry.get('value', {})
          rule_ids = v.get('rule_ids') or []
          url = v.get('webhook_url', '')
          if not url:
              continue
          # Per-entry level override (behavioral routing uses a lower threshold
          # than scenarios so low-severity Sysmon EID1 events still reach triage),
          # falling back to the global min_level.
          lvl = v.get('min_level')
          try:
              lvl = int(lvl)
          except (TypeError, ValueError):
              lvl = min_level
          lines = [
              '  <integration>',
              '    <name>shuffle</name>',
              '    <hook_url>' + url + '</hook_url>',
              '    <level>' + str(lvl) + '</level>',
          ]
          if rule_ids:
              lines.append('    <rule_id>' + ','.join(str(r) for r in rule_ids) + '</rule_id>')
          # Group-scoped routing (Wazuh integratord native <group> filter). Used by
          # the behavioral integration to catch a whole rule group (e.g. Sysmon
          # process-creation detections) without lowering the global threshold.
          grp = v.get('group')
          if grp and isinstance(grp, str) and grp.strip() and not grp.strip().startswith('$'):
              lines.append('    <group>' + grp.strip() + '</group>')
          lines.append('    <alert_format>json</alert_format>')
          lines.append('  </integration>')
          blocks.append('\n'.join(lines))

      new_section = '\n  ' + '\n  '.join(blocks) + '\n'

      with open('/var/ossec/etc/ossec.conf', 'r') as f:
          content = f.read()

      # Strip ALL existing shuffle integration blocks + previous signature comment
      content = re.sub(
          r'\s*<!--\s*soc-shuffle-integrations-sig:[^-]*-->\s*', '\n  ', content
      )
      content = re.sub(
          r'\s*<integration>\s*<name>shuffle</name>.*?</integration>',
          '', content, flags=re.DOTALL
      )
      closing = '</ossec_config>'
      if closing not in content:
          raise SystemExit('Tag </ossec_config> non trouve dans ossec.conf')
      new_content = content.replace(closing, new_section + closing)
      with open('/var/ossec/etc/ossec.conf', 'w') as f:
          f.write(new_content)
      print('Wrote {} integration block(s) (sig={})'.format(len(integrations), sig))
  register: _ww_multi_inject
  changed_when: _ww_multi_inject.rc | default(1) == 0
  failed_when: _ww_multi_inject.rc | default(1) != 0

- name: "wazuh_webhook | Configcheck Wazuh post-écriture (valider syntaxe XML)"
  # NOTE: `wazuh-control` ne supporte PAS de sous-commande configcheck (vérifié 2026-05-16
  # sur Wazuh 4.7+). Le test syntaxique de ossec.conf+rules+decoders se fait via
  # `wazuh-analysisd -t` qui parse tout et exit 0 si OK, !=0 si erreur.
  when:
    - _ww_hook_url is defined
    - _ww_multi_inject is changed
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    /var/ossec/bin/wazuh-analysisd -t
  register: _ww_configcheck
  changed_when: false
  failed_when: false

# Si configcheck KO: dumper sortie configcheck + extraits du ossec.conf foiré
# AVANT le rollback (qui détruit la version cassée). Aide critique au debug.
- name: "wazuh_webhook | [diag] Configcheck output (toujours visible)"
  when:
    - _ww_hook_url is defined
    - _ww_multi_inject is changed
  ansible.builtin.debug:
    msg:
      - "configcheck rc: {{ _ww_configcheck.rc | default('?') }}"
      - "configcheck stdout:"
      - "{{ _ww_configcheck.stdout_lines | default(['(empty)']) }}"
      - "configcheck stderr:"
      - "{{ _ww_configcheck.stderr_lines | default(['(empty)']) }}"
  changed_when: false

- name: "wazuh_webhook | [diag] Dump <integration> blocs du ossec.conf actuel (avant rollback)"
  when:
    - _ww_hook_url is defined
    - _ww_multi_inject is changed
    - _ww_configcheck.rc | default(1) != 0
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - bash
      - -c
      - 'awk "/<integration>/,/<\/integration>/" /var/ossec/etc/ossec.conf'
  register: _ww_dump_integrations
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | [diag] Show dumped integrations"
  when:
    - _ww_hook_url is defined
    - _ww_multi_inject is changed
    - _ww_configcheck.rc | default(1) != 0
  ansible.builtin.debug:
    msg: "{{ _ww_dump_integrations.stdout_lines | default(['(no integration block in ossec.conf)']) }}"
  changed_when: false

# Rollback si configcheck KO
- name: "wazuh_webhook | Rollback ossec.conf si configcheck KO"
  when:
    - _ww_hook_url is defined
    - _ww_multi_inject is changed
    - _ww_configcheck.rc | default(1) != 0
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - bash
      - -c
      - 'LAST=$(ls -t /var/ossec/etc/ossec.conf.bak-* 2>/dev/null | head -1); if [ -n "$LAST" ]; then cp -a "$LAST" /var/ossec/etc/ossec.conf && echo "Rolled back to $LAST" && exit 1; else echo "no backup available" >&2; exit 1; fi'
  register: _ww_rollback
  failed_when: true   # toujours fail pour signaler clairement le rollback à l'opérateur

- name: "wazuh_webhook | Confirmer l'injection multi-integration"
  when:
    - _ww_hook_url is defined
    - _ww_multi_inject is changed
    - _ww_configcheck.rc | default(0) == 0
  ansible.builtin.debug:
    msg:
      - "{{ _ww_multi_inject.stdout | default('') }}"
      - "Integrations: {{ _ww_integrations | length }} (incluant fallback)"
      - "Signature   : {{ _ww_integrations_sig }}"
  changed_when: false

# Maintien des variables legacy pour rétro-compat des tâches qui suivent
# (reload, diagnostics) — _ww_inject_result remplace l'ancienne variable.
- name: "wazuh_webhook | Alias _ww_inject_result pour rétro-compat reload"
  when: _ww_hook_url is defined
  ansible.builtin.set_fact:
    _ww_inject_result: "{{ _ww_multi_inject | default({}) }}"

# ── /var/log/syslog localfile monitoring (ephemeral — repair on every run) ──
# The selftest (210) injects via: echo "...soc-selftest-test-event..." >> /var/log/syslog
# Wazuh logcollector must monitor this file for analysisd to process the event
# and trigger rule 999999 → integratord → Shuffle webhook.
# The Wazuh K8s image does NOT monitor /var/log/syslog by default.

- name: "wazuh_webhook | S'assurer que /var/log/syslog existe dans le pod"
  when: _ww_hook_url is defined
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    bash -c 'touch /var/log/syslog && chmod 644 /var/log/syslog'
  register: _ww_syslog_touch
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Vérifier si /var/log/syslog est surveillé par Wazuh"
  when: _ww_hook_url is defined
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    grep -q "var/log/syslog" /var/ossec/etc/ossec.conf
  register: _ww_syslog_check
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Ajouter le monitoring /var/log/syslog dans ossec.conf"
  when:
    - _ww_hook_url is defined
    - _ww_syslog_check.rc | default(1) != 0
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_automation_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_automation_wazuh_ns }}"
      - "{{ soc_automation_wazuh_manager_pod }}"
      - --
      - python3
      - -c
      - |
        localfile_block = (
            '\n  <localfile>\n'
            '    <log_format>syslog</log_format>\n'
            '    <location>/var/log/syslog</location>\n'
            '  </localfile>'
        )
        closing = '</ossec_config>'
        with open('/var/ossec/etc/ossec.conf', 'r') as f:
            content = f.read()
        if closing not in content:
            raise ValueError('Tag </ossec_config> non trouve dans ossec.conf')
        new_content = content.replace(closing, localfile_block + '\n' + closing)
        with open('/var/ossec/etc/ossec.conf', 'w') as f:
            f.write(new_content)
        print('Monitoring /var/log/syslog ajoute dans ossec.conf')
  register: _ww_syslog_inject
  changed_when: _ww_syslog_inject.rc | default(1) == 0

- name: "wazuh_webhook | Confirmer l'ajout du monitoring syslog"
  when: _ww_hook_url is defined
  ansible.builtin.debug:
    msg: "{{ _ww_syslog_inject.stdout | default('/var/log/syslog déjà surveillé — aucune modification') }}"
  changed_when: false

# ── Reload Wazuh in-pod (NOT rollout restart — preserves filesystem) ──
# rollout restart destroys the pod and recreates it with a fresh overlay,
# wiping the rule file and ossec.conf changes we just wrote.
# Instead, restart the Wazuh service inside the running container.

- name: "wazuh_webhook | Recharger la config Wazuh Manager in-pod (préserve le filesystem)"
  when:
    - _ww_hook_url is defined
    - (_ww_requests_install is changed) or (_ww_rule_deploy is changed) or (_ww_decoder_deploy is changed) or (_ww_ruledir_inject is changed) or (_ww_inject_result is changed) or (_ww_syslog_inject is changed)
  ansible.builtin.shell: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    bash -c 'nohup /var/ossec/bin/wazuh-control restart > /dev/null 2>&1 &'
  register: _ww_restart
  changed_when: true

- name: "wazuh_webhook | Attendre la stabilisation du service Wazuh (30s)"
  when:
    - _ww_hook_url is defined
    - _ww_restart is changed
  ansible.builtin.pause:
    seconds: 30

- name: "wazuh_webhook | Vérifier que Wazuh est opérationnel après reload"
  when:
    - _ww_hook_url is defined
    - _ww_restart is changed
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    /var/ossec/bin/wazuh-control status
  register: _ww_status
  changed_when: false
  failed_when: false
  retries: 3
  delay: 10
  until: "'wazuh-integratord is running' in _ww_status.stdout"

# ── Diagnostic: verify the full integration chain ──────────────────────
# These tasks always run (when hook_url is defined) and output diagnostics
# to help pinpoint where the Wazuh→Shuffle pipeline breaks.

- name: "wazuh_webhook | Diagnostic — script shuffle exists and is executable"
  when: _ww_hook_url is defined
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    ls -la /var/ossec/integrations/shuffle
  register: _ww_diag_script
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Diagnostic — ossec.conf integration + localfile + ruleset sections"
  when: _ww_hook_url is defined
  ansible.builtin.shell:
    cmd: >
      kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
      exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
      bash -c 'grep -n -A4 "integration\|localfile\|var/log/syslog\|ruleset\|rule_dir\|etc/rules" /var/ossec/etc/ossec.conf'
  register: _ww_diag_ossec
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Diagnostic — test webhook URL reachability from Wazuh pod"
  when: _ww_hook_url is defined
  ansible.builtin.shell:
    cmd: >
      kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
      exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
      bash -c 'HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 {{ _ww_hook_url }} 2>/dev/null);
      if [ "$HTTP_CODE" = "000" ]; then echo "UNREACHABLE (timeout/DNS)";
      elif [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ] 2>/dev/null; then echo "OK (HTTP $HTTP_CODE — réseau opérationnel)";
      else echo "ERROR (HTTP $HTTP_CODE)"; fi'
  register: _ww_diag_webhook
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Diagnostic — integrations.log (last 20 lines)"
  when: _ww_hook_url is defined
  ansible.builtin.command: >
    kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
    exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
    tail -20 /var/ossec/logs/integrations.log
  register: _ww_diag_intlog
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Diagnostic — alerts.json rule 999999 (last 5 matches)"
  when: _ww_hook_url is defined
  ansible.builtin.shell:
    cmd: >
      kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
      exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
      bash -c 'grep -h "999999" /var/ossec/logs/alerts/alerts.json 2>/dev/null | tail -5 || echo "(aucune alerte rule 999999)"'
  register: _ww_diag_alerts
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Diagnostic — ossec.log integratord errors (last 30 lines)"
  when: _ww_hook_url is defined
  ansible.builtin.shell:
    cmd: >
      kubectl --kubeconfig {{ soc_automation_kubeconfig_path }}
      exec -n {{ soc_automation_wazuh_ns }} {{ soc_automation_wazuh_manager_pod }} --
      bash -c 'grep -i "integratord\|integration\|shuffle" /var/ossec/logs/ossec.log | tail -30'
  register: _ww_diag_osseclog
  changed_when: false
  failed_when: false

- name: "wazuh_webhook | Diagnostic — RÉSUMÉ PIPELINE"
  when: _ww_hook_url is defined
  ansible.builtin.debug:
    msg:
      - "══════════ DIAGNOSTIC PIPELINE WAZUH → SHUFFLE ══════════"
      - "1. Script shuffle : {{ _ww_diag_script.stdout | default('ABSENT') }}"
      - "2. ossec.conf (integration+localfile) :"
      - "{{ _ww_diag_ossec.stdout_lines | default(['(vide)']) }}"
      - "3. Webhook URL reachability : {{ _ww_diag_webhook.stdout | default('ERREUR') }}"
      - "4. integrations.log :"
      - "{{ _ww_diag_intlog.stdout_lines | default(['(vide ou absent)']) }}"
      - "5. alerts.json rule 999999 :"
      - "{{ _ww_diag_alerts.stdout_lines | default(['(aucune alerte)']) }}"
      - "6. ossec.log (integratord/shuffle) :"
      - "{{ _ww_diag_osseclog.stdout_lines | default(['(aucune entrée)']) }}"
  changed_when: false

# ════════════════════════════════════════════════════════════════════════════════
# SECTION 2 — First-run marker (K8s API — durable, only needs to run once)
# ════════════════════════════════════════════════════════════════════════════════

- name: "wazuh_webhook | Check idempotence marker"
  when: _ww_hook_url is defined
  kubernetes.core.k8s_info:
    kubeconfig: "{{ soc_automation_kubeconfig_path }}"
    kind: ConfigMap
    namespace: "{{ soc_automation_worker_namespace }}"
    name: "{{ soc_automation_marker_wazuh_webhook }}"
  register: _ww_marker
  changed_when: false

- name: "wazuh_webhook | Marker d'idempotence"
  when:
    - _ww_hook_url is defined
    - _ww_marker.resources | length == 0
  kubernetes.core.k8s:
    kubeconfig: "{{ soc_automation_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ soc_automation_marker_wazuh_webhook }}"
        namespace: "{{ soc_automation_worker_namespace }}"
        labels: "{{ soc_automation_labels }}"
        annotations:
          soc.lab/feature:     "wazuh-webhook"
          soc.lab/deployed-at: "{{ ansible_date_time.iso8601 | default('unknown') }}"
      data:
        feature:      "wazuh-webhook"
        status:       "active"
        hook_url:     "{{ _ww_hook_url }}"
        environment:  "{{ soc_environment | default('dev') }}"
