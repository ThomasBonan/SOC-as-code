---
# ════════════════════════════════════════════════════════════════════════════════
# soc_automation role — defaults
# Playbook 180 | SOC Automation Core
# ════════════════════════════════════════════════════════════════════════════════
#
# These defaults are designed to work out-of-the-box for a dev environment.
# Override per-environment in:
#   ansible/playbooks/envs/prod.yml  (SOC_ENV=prod)
#   ansible/playbooks/envs/staging.yml
#
# Conventions:
#   - All variables prefixed soc_automation_
#   - Feature toggles: soc_automation_enable_<feature>
#   - SA secret refs mirror soc_foundations defaults (read-only, never overwrite)

# ── Feature toggles ───────────────────────────────────────────────
soc_automation_enable_preflight:      true   # Vérification des SA credentials depuis 170
soc_automation_enable_credentials:    true   # Créer le Secret agrégé soc-automation-worker-creds
soc_automation_enable_cortex_to_misp: true   # Stocker la politique MISP push (lue par Shuffle)
soc_automation_enable_wazuh_webhook:  true   # Injecter le bloc integration Shuffle dans ossec.conf
# Fallback alert-triage catchall : si true, ajoute une integration sans rule_id
# qui attrape tous les events level >= min_level. Désactivé par défaut car
# wazuh-integratord ne supporte pas l'exclusion (!rule_id) → le catchall fire
# en plus du scenario → 2 workers Shuffle concurrents → ABORTED par routing
# load-balance Service shuffle-workers (Shuffle 1.4 K8s limitation).
soc_automation_wazuh_webhook_enable_fallback: false
# Routing comportemental chirurgical (Phase 9.1, étendu 9.2) : ajoute N integrations
# scopées par <group> Wazuh, à un niveau plus bas que les scenarios, pointées sur le
# webhook alert-triage (seul workflow qui appelle /normalize → analyse MITRE+YARA).
# Pas de double-dispatch : AUCUNE route ne doit recouvrir un groupe de scenario
# (malware=sysmon,hacktool,credential_dump ; bruteforce/privesc=auth/sudo) sinon
# 2 <integration> pour la même alerte → 2 workers Shuffle concurrents → ABORTED.
# Les scenarios gardent leur <level> 9 ; seules ces routes descendent à min_level.
#
# routes[] (Phase 9.2) : une route = un bloc <integration><group>…</group> distinct.
#   - sysmon_eid1_detections  : process-creation (LOLBins, TTP, atomic red team,
#                               sdbinst / Application Compatibility Database T1546.011).
#   - sysmon_eid11_detections : FileCreate (dropper — exécutable/script déposé, ex.
#                               "PowerShell created an executable in Windows root").
#                               Le fichier est ensuite catégorisé par hash puis contenu.
#   - windows_defender        : canal Defender NATIF (EventID 5001/5012… → rules built-in
#                               621xx). Indispensable quand Defender est désactivé via
#                               l'UI (pas de command_line Sysmon → la rule evidence-grade
#                               100212 ne matche pas). Les rule_ids de SABOTAGE (62152 RTP
#                               off, 62157/62159 scan off, 62153/62154 config changée) sont
#                               enregistrés evidence-grade (evidence-rules.json) → plancher
#                               contained. Les events bénins (scan terminé, MAJ signatures,
#                               RTP réactivée) → score natif ~0 → auto_close, pas de bruit
#                               TheHive. Disjoint des groupes scenarios + sysmon → pas de
#                               double-dispatch. VOLUME : route TOUT le canal (≥ min_level)
#                               vers Shuffle ; monter min_level si la flotte Defender est
#                               bavarde (workers Shuffle 1.4 concurrents → ABORTED).
soc_automation_wazuh_behavior_routing:
  enabled: true
  routes:
    - group:     "sysmon_eid1_detections"
      min_level: 3
    - group:     "sysmon_eid11_detections"
      min_level: 3
    - group:     "windows_defender"
      min_level: 3
  # Rétro-compat : si `routes` est absent (override d'env ancien), ces scalaires
  # synthétisent une route unique EID1.
  group:     "sysmon_eid1_detections"
  min_level: 3
soc_automation_enable_wazuh_manager_labels: true   # Injecter <labels> agent.type dans ossec.conf manager
soc_automation_enable_wazuh_selftest_scenarios: true   # Rules 999901-999903 + décodeurs IOC pour selftest E2E
soc_automation_enable_ar_scripts:     true   # Déployer scripts AR custom (isolate-agent, disable-account)
soc_automation_enable_noise_suppression: true   # Override règles Sysmon bruyantes (FP connus, ex. __PSScriptPolicyTest)

# ── Collecteur de contenu de fichier déposé (Phase 9.2) ─────────────────────────
# Deux toggles distincts :
#   - enable_filedrop_rules (true)     : déploie soc_filedrop_rules.xml côté manager
#     (classe l'event ré-injecté data.soc_filedrop=1 en group soc_filedrop_content).
#     Sans risque : prépare la pipeline à recevoir les events de contenu.
#   - enable_filedrop_collector (false): injecte le DÉCLENCHEUR AR <command>/<active-response>
#     qui lance collect-file.ps1 SUR L'AGENT. OPT-IN : n'activer QU'APRÈS avoir
#     installé collect-file.ps1 + le <localfile> agent.conf sur la flotte Windows
#     (hors périmètre repo — cf. files/ar_scripts/README-collect-file.md). Sinon le
#     déclencheur logge juste "no such file" côté agent.
soc_automation_enable_filedrop_rules:     true
soc_automation_enable_filedrop_collector: false
soc_automation_filedrop_collector_rules_group: "sysmon_eid11_detections"

# ── Règles haute-fidélité "evidence-grade" (Phase 10 / B) ───────────────────────
# Déploie soc_evidence_rules.xml (rules 100210-100217, détections Sysmon field-aware
# faible-FP). Leurs rule_ids sont 'evidence-grade' dans le risk-engine (evidence-rules.json)
# → la détection EST une preuve (plancher pleine plage, peut contenir/escalader sans IOC),
# contrairement à un simple tag MITRE (plafonné auto_promote). Faible-FP → activé par défaut.
soc_automation_enable_evidence_rules: true

# ── FIM agent.conf (voie SANS script — recommandée) ─────────────────────────────
# Pousse une config <syscheck> dans /var/ossec/etc/shared/<groupe>/agent.conf
# (PVC Longhorn = PERSISTANT, contrairement à ossec.conf). Le manager recalcule
# merged.mg et les agents du groupe la récupèrent (~10 min, pas de restart manager).
# OPT-IN (false) : pousser du FIM realtime à une flotte est impactant (perf endpoint).
# N'active QU'APRÈS avoir choisi un groupe dédié + assigné tes agents Windows au groupe
# (UI Management>Agents ou `agent_groups -a -i <id> -g <groupe>`).
# fim_dirs : dossiers à risque (PAS C:\Windows entier en realtime = trop lourd).
soc_automation_enable_fim_agent_conf: false
soc_automation_fim_group:            "windows"
soc_automation_fim_realtime:         true
soc_automation_fim_report_changes:   true
soc_automation_fim_dirs:
  - 'C:\Windows\Temp'
  - 'C:\ProgramData'
  - 'C:\Users\Public'
  - 'C:\Users\*\AppData\Local\Temp'

# ── Labels du Wazuh manager (agent 000) ────────────────────────────
# Propagés à TOUTES les alertes émises par le manager local (selftest, logger
# direct, etc.) sous agent.labels.{key} dans le JSON alert. Lu par le risk-engine
# pour calculer asset_dim (server-prod=weight 5 → asset_dim=100).
#
# En lab : conserver server-prod pour que les selftests scenarios scorent
# naturellement entre 75-100 (auto_contain / escalated) sur de vraies attaques
# simulées via Wazuh logger. Pour un déploiement réel, ces labels doivent
# refléter la criticité du host hébergeant le manager — un manager SOC est
# typiquement un asset critique (perte de monitoring = blind spot).
soc_automation_wazuh_manager_labels:
  type: "server-prod"
  environment: "{{ soc_environment | default('dev') }}"
  role: "wazuh-manager"
# Sysmon hash decoder : nécessite un parent `windows_eventchannel` qui n'existe
# que si un agent Windows envoie des events EventChannel. Sans Sysmon dans le
# scope, wazuh-analysisd refuse de charger et l'integrator reste mort (cas
# vécu 2026-05-14). Toggle à true UNIQUEMENT si un agent Sysmon est en place.
soc_automation_deploy_sysmon_decoder: false

# ── Active Response custom scripts (Phase 4 multi-scenario) ───────────
# Mode "log only" par défaut: SOC_AR_DRY_RUN=1 dans /var/ossec/active-response/soc-ar.env
# Passer à false pour activer les actions destructives (iptables drop, passwd -l).
# Recommandation: rester en dry-run au moins jusqu'à validation E2E selftest +
# 1 sprint d'observation sur volume d'alertes réel (identifier faux-positifs).
soc_automation_ar_dry_run: true

# Commandes Active Response à déclarer dans ossec.conf.
# Chaque entrée -> 1 bloc <command> + 1 <active-response>.
# rule_ids   : limite l'AR aux alertes matchant ces rules (rules_id Wazuh).
# Garde-fou principal côté Shuffle: l'AR n'est appelée que si risk_decision
# in [contained, escalated] (score >= soc_risk_thresholds.auto_contain = 75).
# Les rule_ids ici servent au déclenchement direct si on bypass Shuffle
# (mode debug / rules très haute confiance) et au filtrage Wazuh-side.
soc_automation_ar_commands:
  - name: isolate-agent
    executable: isolate-agent.sh
    rule_ids: [100200, 100201, 100202]      # rules malware Sysmon
    timeout_allowed: "yes"                   # Wazuh appelle action="delete" après timeout
    timeout: 3600                            # 1h d'isolation max, puis auto-restore
  - name: disable-account
    executable: disable-account.sh
    rule_ids: [5402, 5403, 4672]            # rules privesc
    timeout_allowed: "yes"
    timeout: 1800                            # 30 min de lock, puis auto-unlock
  # firewall-drop est natif Wazuh (déjà installé), pas besoin de re-déclarer ici.
  # Il est appelé via le workflow Shuffle wf-bruteforce qui POST à
  # /active-response avec command=firewall-drop directement (déjà fourni
  # par /var/ossec/active-response/bin/firewall-drop).

# ── Runtime settings ──────────────────────────────────────────────
soc_automation_kubeconfig_path: "{{ kubeconfig_path }}"
soc_automation_http_timeout:    "{{ soc_http.timeout | default(10) }}"
soc_automation_http_retries:    "{{ soc_http.retries | default(20) }}"
soc_automation_http_delay:      "{{ soc_http.delay   | default(3)  }}"
soc_automation_validate_certs:  "{{ soc_validate_tls | default(false) }}"
# Preflight probes use a short retry count — services must already be running
soc_automation_preflight_retries: 3
soc_automation_preflight_delay:   5

# ── SA Secrets (created by 170-soc-foundations — DO NOT MODIFY) ──
# These are read-only references. Never write to these secrets here.
soc_automation_thehive_sa_secret_name: "thehive-sa-foundations"
soc_automation_thehive_sa_secret_ns:   "{{ soc_namespaces.thehive }}"
soc_automation_thehive_sa_key:         "api_key"

# Write SA for automation worker and Shuffle SOAR (ENV_THEHIVE_APIKEY).
# svc-foundations (analyst profile, all workflow permissions added by rbac_thehive.yml)
# handles both write and read operations. Belongs to the same org as the read SA.
# Note : TheHive 5 Community quota users.normal 0/0 empêche tout compte dédié
# supplémentaire (ex. svc-selftest) — un seul SA non-admin couvre tous les
# usages d'intégration.
soc_automation_thehive_write_sa_secret_name: "thehive-sa-foundations"
soc_automation_thehive_write_sa_secret_ns:   "{{ soc_namespaces.thehive }}"
soc_automation_thehive_write_sa_key:         "api_key"

soc_automation_cortex_sa_secret_name:  "cortex-sa-foundations"
soc_automation_cortex_sa_secret_ns:    "{{ soc_namespaces.cortex }}"
soc_automation_cortex_sa_key:          "api_key"

soc_automation_misp_sa_secret_name:    "misp-sa-foundations"
soc_automation_misp_sa_secret_ns:      "{{ soc_namespaces.misp }}"
soc_automation_misp_sa_key:            "authkey"

soc_automation_wazuh_sa_secret_name:   "wazuh-sa-foundations"
soc_automation_wazuh_sa_secret_ns:     "{{ soc_namespaces.wazuh }}"
soc_automation_wazuh_sa_key_user:      "username"
soc_automation_wazuh_sa_key_pass:      "password"

# ── TheHive bootstrap credentials (for org-admin operations) ─────
# Required to create custom fields — the analyst SA profile returns 403 (not org-admin).
# Reuses the same variables as soc_foundations (170): thehive_bootstrap_user / thehive_bootstrap_password.
# IMPORTANT: thehive_bootstrap_password MUST be populated via Vault (path: soc/bootstrap/thehive).
# It is fetched by fetch_bootstrap_vars.yml before this role runs.
# An empty value will cause preflight assertions to fail — this is intentional.
# NOTE: default('') is intentional — empty value triggers preflight assert (line 22-27).
# Value MUST be injected by fetch_bootstrap_vars.yml via Vault before this role runs.
# A missing value will cause an early-fail assertion, not a silent empty-credential run.
soc_automation_thehive_bootstrap_user:     "{{ thehive_bootstrap_user     | default('admin@thehive.local') }}"
soc_automation_thehive_bootstrap_password: "{{ thehive_bootstrap_password | default('') }}"

# ── API base URLs ─────────────────────────────────────────────────
soc_automation_thehive_api_base: "{{ soc_endpoints.thehive.api_base }}"
soc_automation_cortex_api_base:  "{{ soc_endpoints.cortex.api_base  }}"
soc_automation_misp_api_base:    >-
  {{
    soc_endpoints.misp.api_base
    | default('https://misp.' ~ soc_namespaces.misp ~ '.svc:443')
  }}

# ── Wazuh pod reference ───────────────────────────────────────────
soc_automation_wazuh_manager_pod: "wazuh-manager-master-0"
soc_automation_wazuh_ns:          "{{ soc_namespaces.wazuh }}"
# Script version expected in wazuh-thehive-integration ConfigMap
soc_automation_wazuh_expected_script_version: "2.0"
# ConfigMap name (matches soc_config_wazuh_configmap_name)
soc_automation_wazuh_configmap_name: "wazuh-thehive-integration"

# ── Analyzer auto-run mapping (observable type → Cortex analyzer names) ───────
# Analyzer names must match exactly what is registered in Cortex
soc_automation_analyzer_map:
  ip:
    - "AbuseIPDB_1_0"
    - "VirusTotal_GetReport_3_1"
  hash:
    - "VirusTotal_GetReport_3_1"
    - "HybridAnalysis_GetReport_2_0"
  domain:
    - "VirusTotal_GetReport_3_1"
    - "Shodan_Host_2_0"
  url:
    - "VirusTotal_GetReport_3_1"
  fqdn:
    - "Shodan_Host_2_0"
# Timeout for Cortex analyzer jobs (seconds)
soc_automation_analyzer_timeout: 300

# ── MISP IOC push policy ──────────────────────────────────────────
# Minimum Cortex analyzer score (0-10) to trigger MISP push
soc_automation_misp_push_min_score: 5
# Tag required on TheHive observable to allow MISP push
soc_automation_misp_push_tag: "confirmed"
# TLP level per environment (1=GREEN, 2=AMBER, 3=RED)
soc_automation_misp_tlp:
  dev:     1
  staging: 2
  prod:    2
# Tags automatically added to every MISP attribute created by this automation
soc_automation_misp_auto_tags:
  - "source:thehive"
  - "soc:automated"
# Mapping of TheHive observable type → MISP attribute type
soc_automation_misp_ioc_type_map:
  ip:     "ip-dst"
  hash:   "md5"
  domain: "domain"
  url:    "url"
  fqdn:   "hostname"

# ── Credentials agrégés pour Shuffle ─────────────────────────────
# Namespace cible du Secret (même namespace que TheHive pour proximité réseau)
soc_automation_worker_namespace:    "{{ soc_namespaces.thehive }}"
# Nom du Secret agrégé lu par Shuffle et le service Risk Engine (190)
soc_automation_worker_creds_secret: "soc-automation-worker-creds"

# ── Wazuh webhook (integration Shuffle) ──────────────────────────
# Niveau d'alerte minimum envoyé à Shuffle (3 = tous les medium et plus)
soc_automation_wazuh_webhook_min_level: 9
# ConfigMap créé par 165-shuffle.yml contenant l'URL du webhook
soc_automation_shuffle_webhook_configmap_name: "soc-shuffle-webhook-config"
soc_automation_shuffle_webhook_configmap_ns:   "{{ soc_namespaces.thehive }}"

# ── K8s resource labels (applied to all resources created by this role) ────────
soc_automation_labels:
  app.kubernetes.io/managed-by: soc-automation
  app.kubernetes.io/component:  soc-automation
  soc.lab/playbook:             "180-soc-automation"
  soc.lab/environment:          "{{ soc_environment | default('dev') }}"

# ── Automation marker ConfigMap names (idempotence) ──────────────
soc_automation_marker_credentials:   "soc-automation-marker-credentials"
soc_automation_marker_cortex_misp:   "soc-automation-marker-cortex-misp"
soc_automation_marker_wazuh_webhook: "soc-automation-marker-wazuh-webhook"
