---
# Namespace
soc_core_namespace: soc-core

# Helm
helm_binary_path: "helm"

# Ingress
misp_fqdn: "{{ (soc_services.misp | default('misp')) ~ '.' ~ (apps_domain | default('apps.soc.lab')) }}"

# Images (OFFICIELLES MISP - GHCR)
misp_core_image: "ghcr.io/misp/misp-docker/misp-core:76d1263"
misp_modules_image: "ghcr.io/misp/misp-docker/misp-modules:76d1263"

# Ports
misp_container_port: 80          # MISP core écoute généralement sur 80 dans ces images
misp_service_port: 80

misp_modules_container_port: 6666
misp_modules_service_port: 6666

# DB / Redis endpoints internes k8s
misp_db_host: "misp-mariadb.soc-core.svc.cluster.local"
misp_db_user: "misp"
misp_db_name: "misp"

misp_redis_host: "misp-redis-master.soc-core.svc.cluster.local"
misp_redis_port: 6379

# Modules URL (service k8s)
misp_modules_fqdn: "http://misp-modules"

# Workers tuning (MISP docker official)
misp_workers: "1"               # legacy
misp_num_workers_default: "5"
misp_num_workers_prio: "5"
misp_num_workers_email: "5"
misp_num_workers_update: "1"
misp_num_workers_cache: "5"

# SMTP
misp_smtp_port: "25"

# imagePullSecrets (laisser vide pour GHCR public)
misp_image_pull_secrets: []

# Redis via Helm (inchangé chez toi)
bitnami_repo_name: "bitnami"
bitnami_repo_url: "https://charts.bitnami.com/bitnami"
misp_redis_release: "misp-redis"
redis_chart_ref: "bitnami/redis"
redis_chart_version: "20.6.2"

misp_redis_image_registry: "docker.io"
misp_redis_image_repository: "bitnami/redis"
misp_redis_image_tag: "8.6.2"

# ============================================================
# GitOps gating — Phase 5
# Passer à "ansible" pour redéploiement complet sans ArgoCD opérationnel.
# Remettre à "gitops" après synchronisation ArgoCD.
# ============================================================
misp_config_managed_by: "gitops"    # ConfigMap misp-config
misp_ingress_managed_by: "gitops"   # Ingress misp.apps.soc.lab

# ============================================================
# OSINT Feeds (P2 — alimente la base d'IOCs pour corrélation)
# ============================================================
# Activé par défaut. Première synchronisation (cache) ≈ 5-15 min selon le feed.
# Idempotent via marker ConfigMap soc-misp-feeds-marker (hash de la liste).
misp_feeds_enabled: true

# Namespace cible (réutilise le ns MISP)
misp_feeds_marker_ns:   "{{ soc_core_namespace }}"
misp_feeds_marker_name: "soc-misp-feeds-marker"

# Admin authkey storage. La gestion des feeds nécessite perm_site_admin que la
# SA svc-foundations (Sync User, role_id=3) n'a pas → 403 sur /feeds/add.
# On génère un authkey admin via cake CLI au 1er run, on le persiste dans
# un Secret K8s pour ne pas re-générer (et invalider l'ancien) à chaque run.
misp_feeds_admin_authkey_secret_ns:    "{{ soc_core_namespace }}"
misp_feeds_admin_authkey_secret_name:  "misp-admin-authkey"
misp_feeds_admin_authkey_secret_key:   "authkey"
misp_feeds_admin_email_secret_name:    "misp-app-secret"
misp_feeds_admin_email_secret_key:     "admin_email"
misp_feeds_misp_pod_label:             "app=misp"

# URL d'API (ingress fallback, comme les autres rôles)
misp_feeds_api_url: "https://{{ misp_fqdn }}"
misp_feeds_validate_certs: false
misp_feeds_http_timeout: 30
misp_feeds_cache_timeout: 900   # 15 min pour le cacheFeed initial

# Liste des feeds OSINT à activer.
# Provider/url/source_format DOIVENT être stables (utilisés comme clé d'unicité).
# Tous gratuits, sans API key. Couvrent Mimikatz et 95% des malware courants.
misp_feeds:
  - name:            "CIRCL OSINT Feed"
    provider:        "CIRCL"
    url:             "https://www.circl.lu/doc/misp/feed-osint"
    source_format:   "misp"
    distribution:    3
    enabled:         true
    caching_enabled: true
  - name:            "Botvrij.eu OSINT"
    provider:        "Botvrij.eu"
    url:             "https://www.botvrij.eu/data/feed-osint/"
    source_format:   "misp"
    distribution:    3
    enabled:         true
    caching_enabled: true
  - name:            "abuse.ch MalwareBazaar SHA256 (recent)"
    provider:        "abuse.ch"
    url:             "https://bazaar.abuse.ch/export/txt/sha256/recent/"
    source_format:   "freetext"
    distribution:    3
    enabled:         true
    caching_enabled: true
