---
# misp/tasks/feeds.yml
# Active les feeds OSINT MISP (CIRCL, Botvrij, abuse.ch). Idempotent par
# marker ConfigMap soc-misp-feeds-marker (hash SHA-256 de la liste de feeds).
#
# Pré-requis :
#   - MISP core ready (handled par main.yml)
#   - Secret misp-sa-foundations (contient l'API key svc-foundations,
#     créé par soc_foundations/tasks/rbac_misp.yml)
#
# Sécurité : la clé API n'est jamais loggée (no_log: true sur les tâches HTTP).

- name: "misp feeds | calculer le hash de la liste"
  ansible.builtin.set_fact:
    _mf_list_hash: "{{ misp_feeds | to_json | hash('sha256') }}"

- name: "misp feeds | lire le marker existant"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: ConfigMap
    namespace: "{{ misp_feeds_marker_ns }}"
    name: "{{ misp_feeds_marker_name }}"
  register: _mf_marker
  changed_when: false

- name: "misp feeds | invalider le marker si la liste a changé"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: absent
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ misp_feeds_marker_name }}"
        namespace: "{{ misp_feeds_marker_ns }}"
  when:
    - (_mf_marker.resources | default([])) | length > 0
    - ((_mf_marker.resources | default([{}]))[0].data.feeds_list_hash | default('')) != _mf_list_hash
  register: _mf_marker_invalidated
  changed_when: true

# Always re-fetch (avoids overwriting _mf_marker with a "skipped" placeholder
# that has no .resources attribute when the previous task didn't run).
- name: "misp feeds | re-vérifier le marker après invalidation"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: ConfigMap
    namespace: "{{ misp_feeds_marker_ns }}"
    name: "{{ misp_feeds_marker_name }}"
  register: _mf_marker
  changed_when: false

- name: "misp feeds | bloc principal d'activation"
  when: (_mf_marker.resources | default([])) | length == 0
  block:

    - name: "misp feeds | lire la clé API svc-foundations"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Secret
        namespace: "{{ misp_feeds_api_secret_ns }}"
        name: "{{ misp_feeds_api_secret_name }}"
      register: _mf_api_secret
      no_log: true
      retries: 12
      delay: 10
      until: _mf_api_secret.resources | length > 0

    - name: "misp feeds | extraire la clé API"
      ansible.builtin.set_fact:
        _mf_api_key: "{{ _mf_api_secret.resources[0].data[misp_feeds_api_secret_key] | b64decode }}"
      no_log: true

    # Lister les feeds existants pour ne POSTer que ceux qui manquent.
    # MISP retourne un 403 sur duplicate URL, donc on filtre côté client.

    - name: "misp feeds | lister les feeds existants"
      ansible.builtin.uri:
        url: "{{ misp_feeds_api_url }}/feeds/index"
        method: GET
        headers:
          Authorization: "{{ _mf_api_key }}"
          Accept:        "application/json"
        validate_certs: "{{ misp_feeds_validate_certs }}"
        status_code: [200]
        timeout: "{{ misp_feeds_http_timeout | int }}"
      register: _mf_existing_raw
      no_log: true
      retries: 6
      delay: 10
      until: _mf_existing_raw.status == 200

    - name: "misp feeds | calculer l'ensemble des URL déjà présentes"
      ansible.builtin.set_fact:
        _mf_existing_urls: >-
          {{
            (_mf_existing_raw.json | default([]))
            | map(attribute='Feed.url')
            | list
          }}

    - name: "misp feeds | identifier les feeds à créer"
      ansible.builtin.set_fact:
        _mf_to_create: >-
          {{
            misp_feeds
            | rejectattr('url', 'in', _mf_existing_urls)
            | list
          }}

    - name: "misp feeds | [info] feeds détectés"
      ansible.builtin.debug:
        msg:
          - "Existants : {{ _mf_existing_urls | length }} feed(s)"
          - "À créer  : {{ _mf_to_create | map(attribute='name') | list }}"

    # Créer les nouveaux feeds. POST /feeds/add accepte un body { Feed: {...} }.
    # Status: 200/201 = créé, 403 = doublon (déjà présent), accepté en idempotent.

    - name: "misp feeds | créer chaque feed manquant"
      ansible.builtin.uri:
        url: "{{ misp_feeds_api_url }}/feeds/add"
        method: POST
        headers:
          Authorization: "{{ _mf_api_key }}"
          Accept:        "application/json"
          Content-Type:  "application/json"
        body_format: json
        body:
          Feed:
            name:            "{{ item.name }}"
            provider:        "{{ item.provider }}"
            url:             "{{ item.url }}"
            source_format:   "{{ item.source_format }}"
            distribution:    "{{ item.distribution | default(3) | int }}"
            enabled:         "{{ item.enabled | default(true) | bool }}"
            caching_enabled: "{{ item.caching_enabled | default(true) | bool }}"
            input_source:    "network"
            delta_merge:     true
            override_ids:    false
            settings:        "{{ item.settings | default({}) | to_json }}"
        validate_certs: "{{ misp_feeds_validate_certs }}"
        status_code: [200, 201, 403]
        timeout: "{{ misp_feeds_http_timeout | int }}"
      loop: "{{ _mf_to_create }}"
      loop_control:
        label: "{{ item.name }}"
      register: _mf_create_results
      no_log: true
      failed_when: false

    # Affichage des status sans body (no_log:true ci-dessus protège l'API key,
    # mais .results[*].status reste accessible — on l'expose pour diagnostic).
    - name: "misp feeds | [info] résultat /feeds/add par feed"
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }} → HTTP {{ item.status | default('NO_STATUS') }}
          {{ '(skipped)' if item.skipped | default(false) else '' }}
      loop: "{{ _mf_create_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"

    # Re-lister pour récupérer les IDs (les nouveaux + les anciens).

    - name: "misp feeds | re-lister tous les feeds (avec IDs)"
      ansible.builtin.uri:
        url: "{{ misp_feeds_api_url }}/feeds/index"
        method: GET
        headers:
          Authorization: "{{ _mf_api_key }}"
          Accept:        "application/json"
        validate_certs: "{{ misp_feeds_validate_certs }}"
        status_code: [200]
        timeout: "{{ misp_feeds_http_timeout | int }}"
      register: _mf_full_raw
      no_log: true

    # Matching par NAME plutôt que URL : MISP peut normaliser les URLs (trailing
    # slash, etc.) ce qui casserait le mapping `url → id`. Le name est sous notre
    # contrôle dans defaults/main.yml donc stable.
    - name: "misp feeds | construire le mapping NAME → ID"
      ansible.builtin.set_fact:
        _mf_name_to_id: >-
          {{
            dict(
              (_mf_full_raw.json | default([]))
              | map(attribute='Feed.name')
              | zip(
                  (_mf_full_raw.json | default([]))
                  | map(attribute='Feed.id')
                )
            )
          }}

    - name: "misp feeds | [info] mapping résolu"
      ansible.builtin.debug:
        msg:
          - "Feeds gérés trouvés dans MISP : {{ _mf_name_to_id | length }}"
          - "Noms : {{ _mf_name_to_id.keys() | list }}"
          - "Manquants après /feeds/add : {{ misp_feeds | map(attribute='name') | reject('in', _mf_name_to_id.keys()) | list }}"

    # Activation explicite (idempotente). /feeds/add accepte enabled=true à la
    # création mais cette tâche garantit la synchro pour les feeds qui auraient
    # été créés disabled (run précédent ou intervention manuelle).

    - name: "misp feeds | activer chaque feed géré"
      ansible.builtin.uri:
        url: "{{ misp_feeds_api_url }}/feeds/enable/{{ _mf_name_to_id[item.name] }}"
        method: POST
        headers:
          Authorization: "{{ _mf_api_key }}"
          Accept:        "application/json"
        validate_certs: "{{ misp_feeds_validate_certs }}"
        status_code: [200, 302]
        timeout: "{{ misp_feeds_http_timeout | int }}"
      loop: "{{ misp_feeds }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.name in _mf_name_to_id
        - item.enabled | default(true) | bool
      register: _mf_enable_results
      no_log: true
      failed_when: false

    - name: "misp feeds | déclencher le cache initial (asynchrone)"
      ansible.builtin.uri:
        url: "{{ misp_feeds_api_url }}/feeds/cacheFeeds/{{ _mf_name_to_id[item.name] }}"
        method: POST
        headers:
          Authorization: "{{ _mf_api_key }}"
          Accept:        "application/json"
        validate_certs: "{{ misp_feeds_validate_certs }}"
        status_code: [200, 302]
        timeout: "{{ misp_feeds_cache_timeout | int }}"
      loop: "{{ misp_feeds }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.name in _mf_name_to_id
        - item.caching_enabled | default(true) | bool
      register: _mf_cache_results
      no_log: true
      failed_when: false

    # Rapport défensif : un item skippé n'a pas de .status, on filtre d'abord
    # ceux qui ont un status (= la tâche a effectivement tourné), puis on compte
    # les codes d'erreur. Pareil pour les pertes silencieuses.
    - name: "misp feeds | rapport d'activation"
      ansible.builtin.debug:
        msg:
          - "Feeds gérés          : {{ misp_feeds | length }}"
          - "Créés ce run         : {{ _mf_to_create | length }}"
          - "Activations OK       : {{ _mf_enable_results.results | default([]) | selectattr('status', 'defined') | selectattr('status', 'in', [200, 302]) | list | length }}"
          - "Activations skip     : {{ _mf_enable_results.results | default([]) | selectattr('skipped', 'defined') | list | length }}"
          - "Activations erreurs  : {{ _mf_enable_results.results | default([]) | selectattr('status', 'defined') | rejectattr('status', 'in', [200, 302]) | list | length }}"
          - "Cache OK             : {{ _mf_cache_results.results | default([]) | selectattr('status', 'defined') | selectattr('status', 'in', [200, 302]) | list | length }}"
          - "Cache erreurs        : {{ _mf_cache_results.results | default([]) | selectattr('status', 'defined') | rejectattr('status', 'in', [200, 302]) | list | length }}"
          - "Note : la première synchronisation s'exécute en arrière-plan via misp-workers."
          - "       Vérifier l'avancement : kubectl -n {{ soc_core_namespace }} exec deploy/misp -- tail -f /var/www/MISP/app/tmp/logs/misp-workers.log"

    - name: "misp feeds | créer le marker d'idempotence"
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ misp_feeds_marker_name }}"
            namespace: "{{ misp_feeds_marker_ns }}"
            labels:
              app.kubernetes.io/managed-by: misp-role
            annotations:
              soc.lab/feature:     "misp-feeds"
              soc.lab/deployed-at: "{{ ansible_date_time.iso8601 | default('unknown') }}"
          data:
            feature:           "misp-feeds"
            status:            "active"
            environment:       "{{ soc_environment | default('dev') }}"
            feeds_count:       "{{ misp_feeds | length | string }}"
            feeds_list_hash:   "{{ _mf_list_hash }}"
            feeds_names:       "{{ misp_feeds | map(attribute='name') | list | to_json }}"

- name: "misp feeds | déjà actif — skip"
  ansible.builtin.debug:
    msg: "MISP feeds déjà configurés (marker {{ misp_feeds_marker_name }} présent, hash inchangé) — skip."
  when: (_mf_marker.resources | default([])) | length > 0
  changed_when: false
