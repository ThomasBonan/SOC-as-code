---
# ════════════════════════════════════════════════════════════════════════════════
# _verify_one_scenario.yml — Sous-fichier appelé par verify_scenario_routing.yml
# ════════════════════════════════════════════════════════════════════════════════
#
# Input fact attendu (set par include_tasks ... loop_var: _vsr_scn):
#   _vsr_scn: dict {key, rule_id, expected_score_min, expected_score_max,
#                   payload_overrides}
#
# Output (append dans _vsr_results[_vsr_scn.key]):
#   {webhook_post_status, case_id, risk_score, risk_decision, scenario_tag_present,
#    score_in_range, status}
# ════════════════════════════════════════════════════════════════════════════════

# Le sourceRef est dérivé du sender (manager_pod + run_id + scenario) pour
# tracking ; il n'est PAS injecté dans le log syslog (Wazuh décodeur
# soc-syslog-net n'extrait pas ce champ). Sert uniquement à la verif TheHive.
- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Compute sourceRef"
  ansible.builtin.set_fact:
    _vsr_one_sourceref: "soc-selftest-scn-{{ _vsr_scn.key }}-{{ _vsr_run_id }}"

# ── Injection via Wazuh logger (chemin RÉEL d'une vraie alerte) ──
# On écrit une ligne syslog dans /var/log/syslog du pod wazuh-manager-master-0.
# Wazuh monitore ce fichier (localfile syslog) → décodeur soc-syslog-net
# (program_name=soc-selftest) extrait l'IOC → rule 99990X fire (level 10) →
# bloc <integration> ossec.conf route vers le webhook Shuffle correspondant →
# workflow Shuffle exécute Cortex + MISP + risk-engine → TheHive case + score.
#
# Format syslog : `<date> <host>: <message>` (BSD syslog). On utilise
# `<date> soc-selftest: <message>` pour que program_name=soc-selftest.
- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Compose synthetic syslog line"
  ansible.builtin.set_fact:
    _vsr_one_syslog_line: >-
      {{ _vsr_scn.inject_field }}={{ _vsr_scn.inject_value }}
      run_id={{ _vsr_run_id }}
      {{ _vsr_scn.inject_match }}

- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Inject ligne syslog dans wazuh-manager"
  # On utilise printf au lieu de echo pour échapper proprement. Le format
  # `Mmm DD HH:MM:SS hostname program_name: message` est le format BSD syslog
  # auquel le pré-décodeur Wazuh s'attend.
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ soc_selftest_kubeconfig_path }}"
      - exec
      - -n
      - "{{ soc_selftest_wazuh_ns }}"
      - "{{ soc_selftest_wazuh_manager_pod }}"
      - --
      - bash
      - -c
      - "printf '%s\\n' \"$(date '+%b %e %H:%M:%S') soc-selftest: {{ _vsr_one_syslog_line }}\" >> /var/log/syslog"
  register: _vsr_one_inject
  changed_when: _vsr_one_inject.rc == 0
  failed_when: _vsr_one_inject.rc != 0

- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Show injected line"
  ansible.builtin.debug:
    msg:
      - "Injected via Wazuh logger (rule {{ _vsr_scn.rule_id }}, scenario {{ _vsr_scn.key }})"
      - "syslog line: soc-selftest: {{ _vsr_one_syslog_line }}"

# Webhook POST status devient logique : OK si l'injection logger a réussi.
# Le routage vers Shuffle est asynchrone (Wazuh integrator) — on le valide
# via le poll TheHive qui suit (présence d'alerte + case promu).
- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Marquer webhook_post_status"
  ansible.builtin.set_fact:
    _vsr_one_post:
      stdout: "200"
      rc: 0

# Convertir _vsr_run_id (YYYYMMDDHHMMSS UTC) en epoch_ms pour filtrer
# les alertes créées APRÈS le start du test. Évite de tomber sur d'anciens cases.
- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Compute test start epoch_ms"
  ansible.builtin.set_fact:
    _vsr_one_test_start_ms: >-
      {{
        ((_vsr_run_id | to_datetime('%Y%m%d%H%M%S')).timestamp() * 1000) | int
      }}

# ── Poll TheHive pour l'alerte + sa promotion en case (1 seul poll) ─
# Pourquoi un seul poll au lieu de deux ?
# Avant : poll #1 (180s) jusqu'à voir l'alerte créée, puis poll #2 (60s) pour
# attendre la promotion en case. Sur exécution lente (Cortex 30s × 2 analyzers
# en parallèle + MISP search + promote + observable), la promotion arrive parfois
# à T+50-90s après création d'alerte → le poll #2 exhauste son budget de 60s.
# Le rapport Ansible affichait alors "Action failed: OK (unknown bytes)" sur la
# dernière retry — message trompeur, en réalité retries exhausted sur until clause.
#
# Maintenant : un poll unique avec budget large 300s (60×5s) sur la condition
# "alerte trouvée ET caseId présent". Si après 5 min on n'a toujours pas de case,
# on tagge légitimement partial-no-case (le workflow Shuffle a fail un step).
- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Poll TheHive pour alerte + case promu"
  ansible.builtin.uri:
    url: "{{ soc_selftest_thehive_api_base }}/v1/query?name=getAlertWithCase-{{ _vsr_scn.key }}"
    method: POST
    headers:
      Authorization: "Bearer {{ _vsr_thive_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      query:
        - _name: "listAlert"
        - _name: "filter"
          _and:
            - _field: "tags"
              _value: "scenario:{{ _vsr_scn.key }}"
            - _field: "tags"
              _value: "rule:{{ _vsr_scn.rule_id }}"
            - _gte:
                _field: "_createdAt"
                _value: "{{ _vsr_one_test_start_ms | int }}"
        - _name: "sort"
          _fields:
            - _createdAt: "desc"
        - _name: "page"
          from: 0
          to: 5
    timeout: "{{ soc_selftest_http_timeout | int }}"
    validate_certs: "{{ soc_selftest_validate_certs }}"
    status_code: [200]
  register: _vsr_one_alerts
  retries: 60
  delay: 5
  # Until robuste contre les réponses TheHive 5 atypiques :
  # - .json doit être une LISTE (pas une string "OK", pas un dict d'erreur)
  # - liste non vide → alerte trouvée
  # - première alerte a un caseId non vide → promotion terminée
  until:
    - _vsr_one_alerts.status == 200
    - (_vsr_one_alerts.json | default([]) | type_debug) == 'list'
    - (_vsr_one_alerts.json | default([])) | length > 0
    - ((_vsr_one_alerts.json | first | default({})).caseId | default('')) | length > 0
  no_log: false
  failed_when: false

- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Extract case_id depuis alerts (defensive)"
  # Accès défensif: si le poll a exhausted ses retries, .json peut être une string
  # ("OK", erreur TheHive 5) ou autre chose qu'une liste. On guard type_debug='list'
  # pour ne jamais drill un champ sur une string (sinon Jinja raise AttributeError
  # qui pollue les retries des tasks suivantes).
  ansible.builtin.set_fact:
    _vsr_one_first_alert: >-
      {{
        ((_vsr_one_alerts.json | default([])) | type_debug == 'list')
        | ternary(
            (_vsr_one_alerts.json | default([]) | first | default({})),
            {}
          )
      }}

- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Drill case_id + tags"
  ansible.builtin.set_fact:
    # TheHive v1 expose caseId au top-level de l'alerte (pas dans extraData.case._id).
    # Si l'alerte n'est pas promue, caseId est absent ou vide.
    _vsr_one_case_id: "{{ _vsr_one_first_alert.caseId | default('') }}"
    _vsr_one_alert_tags: "{{ _vsr_one_first_alert.tags | default([]) }}"

# Si pas de case (decision auto_closed = alerte fermée sans promotion), c'est OK :
# l'alerte existe mais pas de case. On valide alors juste les tags de l'alerte.
- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Check scenario tag presence"
  ansible.builtin.set_fact:
    _vsr_one_scenario_tag_present: >-
      {{
        ('scenario:' ~ _vsr_scn.key) in _vsr_one_alert_tags
      }}

# Si case existe, poller son risk_score custom field
# Le workflow Shuffle écrit risk_score_v2 via action_update_case_risk APRÈS la
# promotion en case (séquence: promote → add_observable → update_case_risk).
# Sans poll sur customFields.risk_score_v2, ce GET peut tomber entre la
# promotion et la PATCH → customFields vide → score lu = 0 (faux négatif).
# retries 18 × 5s = 90s pour couvrir add_observable + update_case_risk latence.
- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Get case details (si promu)"
  when: _vsr_one_case_id | length > 0
  ansible.builtin.uri:
    url: "{{ soc_selftest_thehive_api_base }}/v1/case/{{ _vsr_one_case_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _vsr_thive_key }}"
    timeout: "{{ soc_selftest_http_timeout | int }}"
    validate_certs: "{{ soc_selftest_validate_certs }}"
    status_code: [200]
  register: _vsr_one_case_detail
  retries: 18
  delay: 5
  until:
    - _vsr_one_case_detail.status == 200
    - >-
      (_vsr_one_case_detail.json.customFields | default([])
       | selectattr('name', 'equalto', 'risk_score_v2')
       | list | length) > 0
  no_log: true
  failed_when: false

- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Extract risk_score + decision"
  # TheHive v1 retourne customFields comme liste [{name, type, value}, ...],
  # PAS comme dict customFields.<name>.<type>. Parser via selectattr by name.
  ansible.builtin.set_fact:
    _vsr_one_risk_score: >-
      {{
        ((_vsr_one_case_detail.json.customFields | default([]))
         | selectattr('name', 'equalto', 'risk_score_v2')
         | map(attribute='value') | list | first | default(0))
        if _vsr_one_case_id | length > 0
        else 0
      }}
    _vsr_one_risk_decision: >-
      {{
        ((_vsr_one_case_detail.json.customFields | default([]))
         | selectattr('name', 'equalto', 'risk_decision')
         | map(attribute='value') | list | first | default(''))
        if _vsr_one_case_id | length > 0
        else 'no_case'
      }}

- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Assert score dans plage"
  ansible.builtin.set_fact:
    _vsr_one_in_range: >-
      {{
        (_vsr_one_risk_score | float) >= _vsr_scn.expected_score_min
        and (_vsr_one_risk_score | float) <= _vsr_scn.expected_score_max
      }}

- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Compute final status"
  ansible.builtin.set_fact:
    _vsr_one_status: >-
      {%- if not _vsr_one_scenario_tag_present -%}
      fail-no-tag
      {%- elif _vsr_one_case_id | length == 0 -%}
      partial-no-case
      {%- elif (_vsr_one_risk_score | float) == 0 and _vsr_one_risk_decision in ['', 'no_case'] -%}
      partial-no-score
      {%- elif not _vsr_one_in_range -%}
      fail-out-of-range
      {%- else -%}
      pass
      {%- endif -%}

- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Append result"
  ansible.builtin.set_fact:
    _vsr_results: >-
      {{
        _vsr_results | combine({
          _vsr_scn.key: {
            'status':              _vsr_one_status,
            'webhook_post_status': _vsr_one_post.stdout | default('?'),
            'case_id':             _vsr_one_case_id,
            'risk_score':          _vsr_one_risk_score,
            'risk_decision':       _vsr_one_risk_decision,
            'scenario_tag_present': _vsr_one_scenario_tag_present,
            'score_in_range':      _vsr_one_in_range,
            'expected_score_min':  _vsr_scn.expected_score_min,
            'expected_score_max':  _vsr_scn.expected_score_max
          }
        })
      }}

- name: "verify_scenario_routing | [{{ _vsr_scn.key }}] Result summary"
  ansible.builtin.debug:
    msg:
      - "Scenario {{ _vsr_scn.key }}:"
      - "  POST           -> HTTP {{ _vsr_one_post.stdout | default('?') }}"
      - "  Case ID        -> {{ _vsr_one_case_id | default('(pas de case — workflow incomplet)') }}"
      - "  Risk score     -> {{ _vsr_one_risk_score }} (attendu {{ _vsr_scn.expected_score_min }}-{{ _vsr_scn.expected_score_max }})"
      - "  Decision       -> {{ _vsr_one_risk_decision }}"
      - "  Tag scenario   -> {{ 'OK' if _vsr_one_scenario_tag_present else 'MISSING' }}"
      - "  Status         -> {{ _vsr_one_status | upper }}"
