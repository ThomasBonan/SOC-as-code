---
# shuffle/tasks/deploy.yml
# Deploy Shuffle via Helm in the soc-shuffle namespace.
# Idempotent via marker ConfigMap soc-shuffle-marker-deploy.

- name: "shuffle | Deploy - verify idempotence marker"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    kind: ConfigMap
    namespace: "{{ shuffle_marker_ns }}"
    name: "{{ shuffle_marker_deploy }}"
  register: _sh_deploy_marker
  changed_when: false

- name: "shuffle | Deploy - Helm and NetworkPolicy block"
  when: _sh_deploy_marker.resources | length == 0
  block:
    - name: "shuffle | Deploy - create namespace {{ shuffle_namespace }}"
      vars:
        _sh_ns_labels: >-
          {{ shuffle_labels | combine({
            'pod-security.kubernetes.io/enforce': 'privileged',
            # NOTE SÉCURITÉ (C-02) : enforce:privileged est maintenu car Shuffle tourne en root (runAsUser: 0).
            # Les app pods (http, tools, subflow, ai) bindent le port 80 ce qui requiert root ou CAP_NET_BIND_SERVICE.
            # Compromis documenté et accepté pour ce lab. En production, revoir l'architecture Shuffle ou utiliser
            # un port non-privilégié (> 1024) avec CAP_NET_BIND_SERVICE pour descendre à baseline.
            # warn:restricted donne la visibilité sur les violations sans casser le déploiement.
            'pod-security.kubernetes.io/warn': 'restricted'
          }) }}
      kubernetes.core.k8s:
        kubeconfig: "{{ shuffle_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ shuffle_namespace }}"
            labels: "{{ _sh_ns_labels }}"

    - name: "shuffle | Deploy - remove stale clone directory if present"
      ansible.builtin.file:
        path: "{{ shuffle_helm_repo_local_path }}"
        state: absent

    - name: "shuffle | Deploy - clone Shuffle chart repository"
      ansible.builtin.git:
        repo: "{{ shuffle_helm_repo_url }}"
        dest: "{{ shuffle_helm_repo_local_path }}"
        version: "{{ shuffle_helm_repo_version }}"
        depth: 1
        force: false

    - name: "shuffle | Deploy - helm dependency build"
      ansible.builtin.command:
        cmd: "helm dependency build {{ shuffle_helm_chart_ref }}"
      changed_when: true

    - name: "shuffle | Deploy - Helm install Shuffle"
      kubernetes.core.helm:
        kubeconfig: "{{ shuffle_kubeconfig_path }}"
        name: "{{ shuffle_release_name }}"
        chart_ref: "{{ shuffle_helm_chart_ref }}"
        chart_version: "{{ shuffle_helm_chart_version if shuffle_helm_chart_version else omit }}"
        release_namespace: "{{ shuffle_namespace }}"
        create_namespace: false
        values: "{{ lookup('template', 'shuffle-values.yml.j2') | from_yaml }}"
        wait: false

    - name: "shuffle | Deploy - wait for Shuffle backend to be ready"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ shuffle_kubeconfig_path }}"
        kind: Pod
        namespace: "{{ shuffle_namespace }}"
        label_selectors:
          - "app.kubernetes.io/component=backend"
          - "app.kubernetes.io/name=shuffle"
      register: _sh_backend_pods
      retries: 60
      delay: 10
      until: >-
        _sh_backend_pods.resources | length > 0
        and (_sh_backend_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0)
        and (_sh_backend_pods.resources[0].status.containerStatuses | default([]) | length > 0)
        and (_sh_backend_pods.resources[0].status.containerStatuses[0].ready | default(false) | bool)

    - name: "shuffle | Deploy - apply Shuffle NetworkPolicy"
      kubernetes.core.k8s:
        kubeconfig: "{{ shuffle_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'netpol-shuffle.yml.j2') | from_yaml_all | list }}"

    - name: "shuffle | Deploy - create idempotence marker"
      kubernetes.core.k8s:
        kubeconfig: "{{ shuffle_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ shuffle_marker_deploy }}"
            namespace: "{{ shuffle_marker_ns }}"
            labels: "{{ shuffle_labels }}"
            annotations:
              soc.lab/feature: "shuffle-deploy"
              soc.lab/deployed-at: "{{ ansible_date_time.iso8601 | default('unknown') }}"
          data:
            feature: "shuffle-deploy"
            status: "active"
            environment: "{{ soc_environment | default('dev') }}"
            helm_chart: "{{ shuffle_helm_chart_ref }}"

- name: "shuffle | Deploy - apply Shuffle Ingress"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition: "{{ lookup('template', 'ingress-shuffle.yml.j2') | from_yaml }}"
  when: shuffle_ingress_managed_by | default('ansible') != 'gitops'

- name: "shuffle | Deploy - apply Shuffle NetworkPolicies"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition: "{{ lookup('template', 'netpol-shuffle.yml.j2') | from_yaml_all | list }}"

- name: "shuffle | Deploy - apply privileged PSS on namespace"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ shuffle_namespace }}"
        labels:
          # NOTE SÉCURITÉ (C-02) : enforce:privileged est maintenu car Shuffle tourne en root (runAsUser: 0).
          # Les app pods (http, tools, subflow, ai) bindent le port 80 ce qui requiert root.
          # Compromis documenté et accepté pour ce lab. En production, revoir l'architecture Shuffle.
          pod-security.kubernetes.io/enforce: privileged
          # warn:restricted donne la visibilité sur les violations PSS sans casser le déploiement.
          pod-security.kubernetes.io/warn: restricted

- name: "shuffle | Deploy - create pod-reader Role for shuffle-backend"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: shuffle-pod-reader
        namespace: "{{ shuffle_namespace }}"
        labels: "{{ shuffle_labels }}"
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]

- name: "shuffle | Deploy - bind pod-reader Role to shuffle-backend"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: shuffle-pod-reader-binding
        namespace: "{{ shuffle_namespace }}"
        labels: "{{ shuffle_labels }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: shuffle-pod-reader
      subjects:
        - kind: ServiceAccount
          name: shuffle-backend
          namespace: "{{ shuffle_namespace }}"

- name: "shuffle | Deploy - read backend and Orborus deployments"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ shuffle_namespace }}"
    name: "{{ item }}"
  loop:
    - shuffle-orborus
    - shuffle-backend
  register: _sh_runtime_deployments
  changed_when: false

- name: "shuffle | Deploy - evaluate runtime environment alignment"
  ansible.builtin.set_fact:
    _sh_orborus_kubernetes_namespace: >-
      {{
        (
          _sh_runtime_deployments.results[0].resources[0].spec.template.spec.containers[0].env
          | default([])
          | selectattr('name', 'equalto', 'KUBERNETES_NAMESPACE')
          | map(attribute='value')
          | list
          | first
        ) | default('')
      }}
    _sh_backend_kubernetes_namespace: >-
      {{
        (
          _sh_runtime_deployments.results[1].resources[0].spec.template.spec.containers[0].env
          | default([])
          | selectattr('name', 'equalto', 'SHUFFLE_KUBERNETES_NAMESPACE')
          | map(attribute='value')
          | list
          | first
        ) | default('')
      }}

- name: "shuffle | Deploy - determine if runtime env vars must be patched"
  ansible.builtin.set_fact:
    _sh_orborus_env_needs_patch: >-
      {{
        _sh_orborus_kubernetes_namespace != shuffle_namespace
      }}
    _sh_backend_env_needs_patch: >-
      {{
        _sh_backend_kubernetes_namespace != shuffle_namespace
      }}

- name: "shuffle | Deploy - set KUBERNETES_NAMESPACE on Orborus"
  when: _sh_orborus_env_needs_patch | bool
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    set env deployment/shuffle-orborus
    KUBERNETES_NAMESPACE={{ shuffle_namespace }}
    -n {{ shuffle_namespace }}
  register: _sh_orborus_env_set
  changed_when: "'updated' in (((_sh_orborus_env_set.stdout | default('')) ~ ' ' ~ (_sh_orborus_env_set.stderr | default(''))))"
  failed_when: false

- name: "shuffle | Deploy - set SHUFFLE_KUBERNETES_NAMESPACE on Backend"
  when: _sh_backend_env_needs_patch | bool
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    set env deployment/shuffle-backend
    SHUFFLE_KUBERNETES_NAMESPACE={{ shuffle_namespace }}
    -n {{ shuffle_namespace }}
  register: _sh_backend_env_set
  changed_when: "'updated' in (((_sh_backend_env_set.stdout | default('')) ~ ' ' ~ (_sh_backend_env_set.stderr | default(''))))"
  failed_when: false

- name: "shuffle | Deploy - restart Orborus after env patch"
  when:
    - _sh_orborus_env_needs_patch | bool
    - (_sh_orborus_env_set.rc | default(1)) == 0
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    rollout restart deployment/shuffle-orborus -n {{ shuffle_namespace }}
  changed_when: true

- name: "shuffle | Deploy - wait for Orborus rollout"
  when:
    - _sh_orborus_env_needs_patch | bool
    - (_sh_orborus_env_set.rc | default(1)) == 0
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    rollout status deployment/shuffle-orborus -n {{ shuffle_namespace }}
    --timeout=120s
  changed_when: false

- name: "shuffle | Deploy - restart Backend after env patch"
  when:
    - _sh_backend_env_needs_patch | bool
    - (_sh_backend_env_set.rc | default(1)) == 0
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    rollout restart deployment/shuffle-backend -n {{ shuffle_namespace }}
  changed_when: true

- name: "shuffle | Deploy - wait for Backend rollout"
  when:
    - _sh_backend_env_needs_patch | bool
    - (_sh_backend_env_set.rc | default(1)) == 0
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    rollout status deployment/shuffle-backend -n {{ shuffle_namespace }}
    --timeout=120s
  changed_when: false

- name: "shuffle | Deploy - create OpenSearch anti-date_detection template"
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    exec -n {{ shuffle_namespace }} shuffle-opensearch-master-0 --
    curl -sf -X PUT "http://localhost:9200/_index_template/shuffle-safe-mappings"
    -H "Content-Type: application/json"
    -d '{"index_patterns":["workflow*","hooks*","workflowapp*","org_cache*","datastore*"],"template":{"mappings":{"date_detection":false}},"priority":200}'
  register: _sh_os_template
  changed_when: false
  failed_when: false

- name: "shuffle | Deploy - verify workflowexecution index write"
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    exec -n {{ shuffle_namespace }} shuffle-opensearch-master-0 --
    curl -s -o /dev/null -w "%{http_code}"
    -X POST "http://localhost:9200/workflowexecution/_doc"
    -H "Content-Type: application/json"
    -d '{"_test_probe":true,"workflow":{"actions":[{"parameters":[{"value":"soc-selftest-probe"}]}]}}'
  register: _sh_os_we_write
  changed_when: false
  failed_when: false

- name: "shuffle | Deploy - verify hooks index existence"
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    exec -n {{ shuffle_namespace }} shuffle-opensearch-master-0 --
    curl -sf "http://localhost:9200/hooks/_count"
  register: _sh_os_hooks_check
  changed_when: false
  failed_when: false

- name: "shuffle | Deploy - verify workflow index write"
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    exec -n {{ shuffle_namespace }} shuffle-opensearch-master-0 --
    curl -s -o /dev/null -w "%{http_code}"
    -X POST "http://localhost:9200/workflow-000001/_doc"
    -H "Content-Type: application/json"
    -d '{"_test_probe":true,"actions":[{"parameters":[{"example":"not-a-date-value","value":"test"}]}]}'
  register: _sh_os_wf_write
  changed_when: false
  failed_when: false

- name: "shuffle | Deploy - count registered hooks"
  ansible.builtin.set_fact:
    _sh_os_hooks_count: "{{ (_sh_os_hooks_check.stdout | default('{}', true) | from_json).count | default(0) | int }}"

- name: "shuffle | Deploy - evaluate global OpenSearch health"
  ansible.builtin.set_fact:
    _sh_os_needs_repair: >-
      {{
        (_sh_os_we_write.stdout | default('') not in ["200", "201"])
        or (_sh_os_hooks_check.rc | default(1) != 0)
        or (_sh_os_hooks_count | int == 0)
        or (_sh_os_wf_write.stdout | default('') not in ["200", "201"])
      }}

- name: "shuffle | Deploy - delete corrupted Shuffle indexes"
  when: _sh_os_needs_repair | bool
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    exec -n {{ shuffle_namespace }} shuffle-opensearch-master-0 --
    curl -sf -X DELETE
    "http://localhost:9200/workflow,workflow-*,workflowexecution,workflowexecution*,hooks,hooks*,workflowapp,workflowapp*"
  register: _sh_os_index_delete
  changed_when: _sh_os_index_delete.rc == 0
  failed_when: false

- name: "shuffle | Deploy - precreate hooks index"
  when: _sh_os_needs_repair | bool
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    exec -n {{ shuffle_namespace }} shuffle-opensearch-master-0 --
    curl -sf -X PUT "http://localhost:9200/hooks"
    -H "Content-Type: application/json"
    -d '{"mappings":{"date_detection":false,"dynamic_templates":[{"strings_as_keywords":{"match_mapping_type":"string","mapping":{"type":"keyword","ignore_above":8191}}}]}}'
  changed_when: true
  failed_when: false

- name: "shuffle | Deploy - remove workflows marker to force reimport"
  when: _sh_os_needs_repair | bool
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: absent
    kind: ConfigMap
    namespace: "{{ shuffle_marker_ns }}"
    name: "{{ shuffle_marker_workflows }}"

- name: "shuffle | Deploy - restart backend after OpenSearch repair"
  when: _sh_os_needs_repair | bool
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    rollout restart deployment/shuffle-backend -n {{ shuffle_namespace }}
  changed_when: true

- name: "shuffle | Deploy - wait for backend after OpenSearch repair"
  when: _sh_os_needs_repair | bool
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    rollout status deployment/shuffle-backend -n {{ shuffle_namespace }}
    --timeout=120s
  changed_when: false

- name: "shuffle | Deploy - restart Orborus after OpenSearch repair"
  when: _sh_os_needs_repair | bool
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    rollout restart deployment/shuffle-orborus -n {{ shuffle_namespace }}
  changed_when: true

- name: "shuffle | Deploy - wait for Orborus after OpenSearch repair"
  when: _sh_os_needs_repair | bool
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    rollout status deployment/shuffle-orborus -n {{ shuffle_namespace }}
    --timeout=120s
  changed_when: false

- name: "shuffle | Deploy - confirm OpenSearch repair"
  when: _sh_os_needs_repair | bool
  ansible.builtin.debug:
    msg: >-
      OpenSearch repair completed:
      anti-date_detection template installed,
      hooks re-created,
      corrupted indexes removed (workflow, workflow-*, workflowapp*),
      backend then Orborus restarted.
      Re-run 185-shuffle.yml to reimport workflows.
  changed_when: false

# ── RBAC cluster orborus (always-run) ────────────────────────────────────────────
# Orborus crée des namespaces K8s éphémères pour isoler les workers Shuffle.
# Le ClusterRole ci-dessous est idempotent (state: present) et doit être réconcilié
# à chaque run — il n'est pas derrière le marqueur car il peut être perdu suite
# à un re-deploy partiel du cluster ou une rotation des CRB.

- name: "shuffle | Deploy - create ClusterRole for Orborus namespace/worker management"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: shuffle-orborus-cluster
        labels: "{{ shuffle_labels }}"
      rules:
        - apiGroups: [""]
          resources: ["namespaces"]
          verbs: ["get", "list", "create", "delete"]
        - apiGroups: [""]
          resources: ["pods", "pods/log", "pods/exec"]
          verbs: ["get", "list", "watch", "create", "delete"]
        - apiGroups: [""]
          resources: ["secrets", "configmaps", "serviceaccounts"]
          verbs: ["get", "list", "create", "delete"]
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources: ["roles", "rolebindings"]
          verbs: ["get", "list", "create", "delete"]

- name: "shuffle | Deploy - bind ClusterRole to Orborus ServiceAccount"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: shuffle-orborus-cluster-binding
        labels: "{{ shuffle_labels }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: shuffle-orborus-cluster
      subjects:
        - kind: ServiceAccount
          name: "{{ shuffle_release_name }}-orborus"
          namespace: "{{ shuffle_namespace }}"

# ── Réconciliation security context des app pods (always-run) ────
# Les app deployments (http, tools, subflow, ai) sont créés par le backend Shuffle,
# pas par Helm. Ils servent sur le port 80 → interdit à un user non-root (uid != 0).
# Ce patch est idempotent : kubectl répond "deployment patched (no change)" si déjà OK.
# Il s'exécute à chaque run pour corriger les deployments créés/recréés par Shuffle.
- name: "shuffle | Deploy - list all deployments in shuffle namespace"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ shuffle_namespace }}"
  register: _sh_all_deployments
  changed_when: false

- name: "shuffle | Deploy - patch app deployments for port 80 binding (runAsUser 0)"
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    patch deployment {{ item }} -n {{ shuffle_namespace }}
    --type=merge
    -p '{"spec":{"template":{"spec":{"securityContext":{"runAsUser":0,"runAsNonRoot":false}}}}}'
  vars:
    _sh_helm_managed:
      - "{{ shuffle_release_name }}-backend"
      - "{{ shuffle_release_name }}-frontend"
      - "{{ shuffle_release_name }}-orborus"
      - "{{ shuffle_release_name }}-workers"
  loop: >-
    {{
      _sh_all_deployments.resources
      | map(attribute='metadata.name')
      | list
      | difference(_sh_helm_managed)
    }}
  register: _sh_app_sec_patch
  changed_when: >-
    'no change' not in (_sh_app_sec_patch.stdout | default(''))
    and 'no change' not in (_sh_app_sec_patch.stderr | default(''))
  failed_when: false

# ── Resilience patches (always-run) ──────────────────────────────────────────
# Three fixes required for end-to-end workflow execution:
# 1. opensearch TLS proxy  — worker pods connect via https://opensearch:9200
# 2. execution-trigger     — fixes race condition: backend triggers worker before it starts
# 3. http-app splitheaders — shuffle SDK passes headers as dict; app 1.4.0 expects string

- name: "shuffle | Deploy - opensearch TLS proxy: issue cert-manager certificate"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: opensearch-tls-proxy-cert
        namespace: "{{ shuffle_namespace }}"
        labels: "{{ shuffle_labels }}"
      spec:
        secretName: opensearch-tls-proxy-secret
        issuerRef:
          name: soc-lab-ca-issuer
          kind: ClusterIssuer
        dnsNames:
          - opensearch
          - "opensearch.{{ shuffle_namespace }}.svc"
          - "opensearch.{{ shuffle_namespace }}.svc.cluster.local"

- name: "shuffle | Deploy - opensearch TLS proxy: nginx ConfigMap"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: opensearch-tls-proxy-config
        namespace: "{{ shuffle_namespace }}"
        labels: "{{ shuffle_labels }}"
      data:
        nginx.conf: |
          worker_processes 1;
          error_log /dev/stderr warn;
          pid /tmp/nginx.pid;
          events { worker_connections 64; }
          stream {
            upstream opensearch_backend {
              server shuffle-opensearch-master-hl:9200;
            }
            server {
              listen 9200 ssl;
              ssl_certificate /etc/ssl/proxy/tls.crt;
              ssl_certificate_key /etc/ssl/proxy/tls.key;
              ssl_session_cache none;
              ssl_session_timeout 5m;
              proxy_pass opensearch_backend;
              proxy_connect_timeout 5s;
              proxy_timeout 300s;
            }
          }

- name: "shuffle | Deploy - opensearch TLS proxy: Deployment"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: opensearch-tls-proxy
        namespace: "{{ shuffle_namespace }}"
        labels:
          app: opensearch-tls-proxy
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: opensearch-tls-proxy
        template:
          metadata:
            labels:
              app: opensearch-tls-proxy
          spec:
            containers:
              - name: proxy
                image: nginx:alpine
                command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
                ports:
                  - containerPort: 9200
                volumeMounts:
                  - name: config
                    mountPath: /etc/nginx/nginx.conf
                    subPath: nginx.conf
                  - name: tls
                    mountPath: /etc/ssl/proxy
                resources:
                  requests:
                    cpu: "50m"
                    memory: "32Mi"
                  limits:
                    cpu: "100m"
                    memory: "64Mi"
            volumes:
              - name: config
                configMap:
                  name: opensearch-tls-proxy-config
              - name: tls
                secret:
                  secretName: opensearch-tls-proxy-secret

- name: "shuffle | Deploy - opensearch TLS proxy: Service"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: opensearch
        namespace: "{{ shuffle_namespace }}"
        labels:
          app: opensearch-tls-proxy
      spec:
        selector:
          app: opensearch-tls-proxy
        ports:
          - name: https
            port: 9200
            targetPort: 9200
            protocol: TCP

- name: "shuffle | Deploy - execution-trigger: Python script ConfigMap"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: shuffle-execution-trigger-script
        namespace: "{{ shuffle_namespace }}"
        labels: "{{ shuffle_labels }}"
      data:
        trigger.py: |
          #!/usr/bin/env python3
          import time, logging, json, urllib.request, urllib.error, ssl, os
          logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")
          log = logging.getLogger(__name__)
          OPENSEARCH_URL  = "http://shuffle-opensearch-master-hl:9200"
          WORKER_URL      = "http://shuffle-workers:33333"
          POLL_INTERVAL   = 5
          STALE_TIMEOUT   = 300   # abort partial executions stuck >5 min
          FRESH_GRACE     = 15    # don't re-trigger executions started <15s ago

          # Kubernetes in-cluster API for pod deletion
          K8S_API         = "https://kubernetes.default.svc"
          K8S_TOKEN_FILE  = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          K8S_CA_FILE     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          K8S_NAMESPACE   = os.environ.get("NAMESPACE", "soc-shuffle")

          def _k8s_headers():
              try:
                  token = open(K8S_TOKEN_FILE).read().strip()
                  return {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              except Exception:
                  return {}

          def _k8s_ssl():
              ctx = ssl.create_default_context(cafile=K8S_CA_FILE)
              return ctx

          def delete_worker_pod(exec_id):
              pod_name = f"worker-{exec_id}"
              url = f"{K8S_API}/api/v1/namespaces/{K8S_NAMESPACE}/pods/{pod_name}"
              req = urllib.request.Request(url, method="DELETE", headers=_k8s_headers())
              try:
                  with urllib.request.urlopen(req, context=_k8s_ssl(), timeout=10):
                      log.info("Deleted worker pod %s", pod_name)
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      log.debug("Delete pod %s: %s", pod_name, e)
              except Exception as e:
                  log.debug("Delete pod %s error: %s", pod_name, e)

          def abort_execution(doc_id):
              url = f"{OPENSEARCH_URL}/workflowexecution/_update/{doc_id}"
              data = json.dumps({"script": {"source": "ctx._source.status = 'ABORTED'", "lang": "painless"}}).encode()
              req = urllib.request.Request(url, data=data,
                  headers={"Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=10):
                      pass
              except Exception as e:
                  log.debug("Abort execution %s: %s", doc_id[:8], e)

          def opensearch_query(path, payload=None, method="GET"):
              url = f"{OPENSEARCH_URL}{path}"
              data = json.dumps(payload).encode() if payload else None
              headers = {"Content-Type": "application/json"}
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return json.loads(r.read())
              except Exception as e:
                  log.debug("OpenSearch query failed: %s", e)
                  return {}

          def trigger_worker(execution_id, authorization):
              payload = json.dumps({"execution_id": execution_id, "authorization": authorization}).encode()
              req = urllib.request.Request(f"{WORKER_URL}/api/v1/streams", data=payload,
                  headers={"Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=8) as r:
                      body = r.read().decode()
                      log.info("Triggered %s -> %s", execution_id[:8], body[:80])
                      return True
              except urllib.error.URLError as e:
                  log.debug("Worker not reachable for %s: %s", execution_id[:8], e)
                  return False

          def process_executions():
              now = int(time.time())
              # EXECUTING : pour re-trigger ou abort les bloqués
              result = opensearch_query("/workflowexecution/_search", method="POST",
                  payload={"query":{"term":{"status.keyword":"EXECUTING"}},"size":30,
                           "_source":["execution_id","authorization","results","started_at"]})
              fresh, stale = [], []
              for hit in result.get("hits",{}).get("hits",[]):
                  src = hit.get("_source",{})
                  eid  = src.get("execution_id","")
                  auth = src.get("authorization","")
                  nres = len(src.get("results",[]))
                  age  = now - int(src.get("started_at",now))
                  if not eid:
                      continue
                  if nres == 0 and age >= FRESH_GRACE:
                      fresh.append((eid, auth))
                  elif nres > 0 and age >= STALE_TIMEOUT:
                      stale.append((hit["_id"], eid))
              # FINISHED/ABORTED : worker pods doivent être supprimés immédiatement
              # (Orborus CLEANUP=true ne fonctionne pas en K8s, seulement Docker swarm)
              # Critical : tant qu'un worker terminé reste actif, le Service shuffle-workers:33333
              # load-balance les nouvelles requêtes vers lui → workflow stuck à mi-exécution.
              done_query = opensearch_query("/workflowexecution/_search", method="POST",
                  payload={"query":{"bool":{"should":[
                      {"term":{"status.keyword":"FINISHED"}},
                      {"term":{"status.keyword":"ABORTED"}}
                  ],"minimum_should_match":1}},"size":50,
                  "sort":[{"started_at":{"order":"desc"}}],
                  "_source":["execution_id","started_at"]})
              done = []
              for hit in done_query.get("hits",{}).get("hits",[]):
                  src = hit.get("_source",{})
                  eid = src.get("execution_id","")
                  age = now - int(src.get("started_at",now))
                  # Cleanup workers between 30s and 1h after start (safety window)
                  if eid and 30 <= age <= 3600:
                      done.append(eid)
              return fresh, stale, done

          def main():
              log.info("shuffle-execution-trigger v2 started (stale_timeout=%ds)", STALE_TIMEOUT)
              triggered = set()
              cleaned = set()
              while True:
                  try:
                      fresh, stale, done = process_executions()
                      for exec_id, auth in fresh:
                          if exec_id in triggered:
                              continue
                          log.info("Zero-result execution %s (age>%ds), triggering...", exec_id[:8], FRESH_GRACE)
                          if trigger_worker(exec_id, auth):
                              triggered.add(exec_id)
                              if len(triggered) > 500:
                                  triggered.clear()
                      for doc_id, exec_id in stale:
                          log.warning("Partial execution %s stuck >%ds — aborting + deleting pod",
                                      exec_id[:8], STALE_TIMEOUT)
                          abort_execution(doc_id)
                          delete_worker_pod(exec_id)
                          triggered.discard(exec_id)
                      # Cleanup workers for FINISHED/ABORTED executions
                      for exec_id in done:
                          if exec_id in cleaned:
                              continue
                          delete_worker_pod(exec_id)
                          cleaned.add(exec_id)
                          if len(cleaned) > 500:
                              cleaned.clear()
                  except Exception as e:
                      log.warning("Poll error: %s", e)
                  time.sleep(POLL_INTERVAL)

          if __name__ == "__main__":
              main()

- name: "shuffle | Deploy - execution-trigger: Deployment"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: shuffle-execution-trigger
        namespace: "{{ shuffle_namespace }}"
        labels:
          app: shuffle-execution-trigger
          soc.lab/component: shuffle
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: shuffle-execution-trigger
        template:
          metadata:
            labels:
              app: shuffle-execution-trigger
          spec:
            containers:
              - name: trigger
                image: python:3.12-alpine
                command: ["python3", "/scripts/trigger.py"]
                volumeMounts:
                  - name: script
                    mountPath: /scripts
                resources:
                  requests:
                    cpu: "10m"
                    memory: "32Mi"
                  limits:
                    cpu: "50m"
                    memory: "64Mi"
            volumes:
              - name: script
                configMap:
                  name: shuffle-execution-trigger-script

- name: "shuffle | Deploy - http-app splitheaders fix: patched app.py ConfigMap"
  kubernetes.core.k8s:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: http-app-patch
        namespace: "{{ shuffle_namespace }}"
        labels: "{{ shuffle_labels }}"
      data:
        app.py: "{{ lookup('file', role_path + '/files/http-app-patched.py') }}"

- name: "shuffle | Deploy - http-app splitheaders fix: patch http-1-4-0 Deployment volume"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ shuffle_kubeconfig_path }}"
    kind: Deployment
    namespace: "{{ shuffle_namespace }}"
    name: http-1-4-0
  register: _sh_http_deploy
  changed_when: false
  failed_when: false

- name: "shuffle | Deploy - http-app splitheaders fix: apply volume patch"
  when:
    - _sh_http_deploy.resources | length > 0
    - >-
      (_sh_http_deploy.resources[0].spec.template.spec.volumes | default([])
       | selectattr('name', 'equalto', 'app-patch') | list | length) == 0
  ansible.builtin.command: >
    kubectl --kubeconfig {{ shuffle_kubeconfig_path }}
    patch deployment http-1-4-0 -n {{ shuffle_namespace }}
    --type=strategic
    -p '{"spec":{"template":{"spec":{"volumes":[{"name":"app-patch","configMap":{"name":"http-app-patch"}}],"containers":[{"name":"http-1-4-0","volumeMounts":[{"name":"app-patch","mountPath":"/app/app.py","subPath":"app.py"}]}]}}}}'
  changed_when: true
