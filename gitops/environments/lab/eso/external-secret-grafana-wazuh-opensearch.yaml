# external-secret-grafana-wazuh-opensearch.yaml
# Datasource Grafana "Wazuh-OpenSearch" provisionnée via un Secret (et non un
# ConfigMap) pour ne jamais exposer le mot de passe en clair dans git.
# Le sidecar grafana-sc-datasources (RESOURCE=both, LABEL=grafana_datasource)
# lit aussi les Secrets labellisés grafana_datasource=1 dans soc-monitoring.
# Le password est injecté par ESO depuis Vault via target.template.
#
# IMPORTANT : l'utilisateur 'admin' de l'indexer s'authentifie avec
# indexer_password (vérifié : admin+indexer_password=200, +dashboard_password=401).
# Le default Ansible (dashboard_password) était erroné.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-wazuh-opensearch-ds
  namespace: soc-monitoring
  labels:
    app.kubernetes.io/managed-by: soc-gitops
    soc.lab/component: eso-external-secret
  annotations:
    soc.lab/vault-path: "credentials/wazuh-credentials"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-datasource-opensearch
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          grafana_datasource: "1"
          app.kubernetes.io/managed-by: soc-gitops
      data:
        opensearch-datasource.yaml: |
          apiVersion: 1
          datasources:
            - name: Wazuh-OpenSearch
              type: grafana-opensearch-datasource
              uid: wazuh-opensearch
              access: proxy
              url: https://wazuh-indexer.soc-wazuh.svc:9200
              basicAuth: true
              basicAuthUser: admin
              isDefault: false
              jsonData:
                database: "wazuh-alerts-*"
                timeField: "@timestamp"
                esVersion: "7.10.0"
                tlsSkipVerify: true
                flavor: "OpenSearch"
                version: "2.10.0"
              secureJsonData:
                basicAuthPassword: "{{ .indexer_password }}"
  data:
    - secretKey: indexer_password
      remoteRef:
        key: credentials/wazuh-credentials
        property: indexer_password
