# configmap-yara-rules.yaml — Ruleset YARA comportemental du Risk Engine
# Phase 9 GitOps — analyse PowerShell/commandes (decode + YARA in-engine)
# Source : ansible/roles/soc_risk_engine/files/yara/soc-powershell-behavior.yar
# Monté en lecture seule sur /config/yara, compilé par compute_behavior().
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-risk-engine-yara-rules
  namespace: soc-thehive
  labels:
    app.kubernetes.io/managed-by: soc-risk-engine
    app.kubernetes.io/component: soc-risk-engine
    soc.lab/playbook: "190-soc-risk-engine"
    soc.lab/environment: dev
data:
  soc-powershell-behavior.yar: |
    /*
      soc-powershell-behavior.yar — curated, self-contained YARA ruleset for
      command-line / decoded-script behavioral analysis (risk-engine in-process).
      Text-only (no pe/math modules, no external variables) so it compiles and
      matches against a plain string buffer (command_line + decoded payload).
      Inspired by public offensive-PowerShell indicators (Empire/PowerSploit).
    */

    rule PS_Suspicious_Flags
    {
        meta:
            score = 40
            severity = "medium"
            technique = "T1059.001"
        strings:
            $a = "-w hidden" nocase
            $b = "-windowstyle hidden" nocase
            $c = "-nop " nocase
            $d = "-noprofile" nocase
            $e = "-executionpolicy bypass" nocase
            $f = "-ep bypass" nocase
        condition:
            2 of them
    }

    rule PS_IEX_Exec
    {
        meta:
            score = 70
            severity = "high"
            technique = "T1059.001"
        strings:
            $a = "IEX" nocase
            $b = "Invoke-Expression" nocase
            $c = "scriptblock]::create(" nocase
        condition:
            any of them
    }

    rule PS_Download_Cradle
    {
        meta:
            score = 75
            severity = "high"
            technique = "T1105"
        strings:
            $a = "DownloadString" nocase
            $b = "DownloadFile" nocase
            $c = "DownloadData" nocase
            $d = "Net.WebClient" nocase
            $e = "Invoke-WebRequest" nocase
            $f = "Start-BitsTransfer" nocase
            $g = "System.Net.Http" nocase
        condition:
            any of them
    }

    rule PS_AMSI_Bypass
    {
        meta:
            score = 90
            severity = "critical"
            technique = "T1562.001"
        strings:
            $a = "amsiInitFailed" nocase
            $b = "AmsiUtils" nocase
            $c = "amsiContext" nocase
            $d = "System.Management.Automation.AmsiUtils" nocase
        condition:
            any of them
    }

    rule PS_Reflection_Inject
    {
        meta:
            score = 85
            severity = "high"
            technique = "T1055"
        strings:
            $a = "Reflection.Assembly" nocase
            $b = "VirtualAlloc" nocase
            $c = "[DllImport" nocase
            $d = "kernel32" nocase
            $e = "CreateThread" nocase
        condition:
            2 of them
    }

    rule Cred_Dumping_Tooling
    {
        meta:
            score = 95
            severity = "critical"
            technique = "T1003"
        strings:
            $a = "Invoke-Mimikatz" nocase
            $b = "sekurlsa" nocase
            $c = "lsadump" nocase
            $d = "mimikatz" nocase
            $e = "Out-Minidump" nocase
            $f = "comsvcs.dll" nocase
        condition:
            any of them
    }
  soc-lolbin-behavior.yar: |
    /*
      soc-lolbin-behavior.yar — command-line TTP ruleset (LOLBins, persistence,
      defense evasion, discovery) for the risk-engine in-process behavioral layer.
      Complements soc-powershell-behavior.yar (PowerShell obfuscation) and the
      MITRE-driven score (rule.mitre.id). Text-only (no pe/math modules, no external
      variables) so it compiles and matches against a plain string buffer
      (command_line + decoded payload). Scores are PRUDENT because most of these
      binaries are also used legitimately — single common LOLBins land in the
      reviewed band (<50), destructive/credential indicators escalate.

      Score bands (see group_vars soc_risk_behavior.floors):
        >=90 escalate | >=70 contained | >=50 auto_promote | >=40 reviewed | <40 none
    */

    rule LOLBin_Scheduled_Task_Persistence
    {
        meta:
            score = 50
            severity = "medium"
            technique = "T1053.005"
        strings:
            $a = "schtasks" nocase
            $b = "/create" nocase
            $c = "/sc " nocase
        condition:
            $a and ($b or $c)
    }

    rule LOLBin_RunKey_Persistence
    {
        meta:
            score = 50
            severity = "medium"
            technique = "T1547.001"
        strings:
            $a = "reg " nocase
            $b = "add" nocase
            $c = "CurrentVersion\\Run" nocase
            $d = "CurrentVersion\\RunOnce" nocase
        condition:
            $a and $b and ($c or $d)
    }

    rule Discovery_Recon_Cluster
    {
        meta:
            score = 40
            severity = "low"
            technique = "T1087"
        strings:
            $a = "whoami /all" nocase
            $b = "net group" nocase
            $c = "nltest" nocase
            $d = "net localgroup" nocase
            $e = "systeminfo" nocase
            $f = "net view" nocase
            $g = "dsquery" nocase
            $h = "quser" nocase
        condition:
            2 of them
    }

    rule Execution_WMIC_Process_Create
    {
        meta:
            score = 55
            severity = "medium"
            technique = "T1047"
        strings:
            $a = "wmic" nocase
            $b = "process" nocase
            $c = "call" nocase
            $d = "create" nocase
        condition:
            all of them
    }

    rule LOLBin_Download_Cradle
    {
        meta:
            score = 70
            severity = "high"
            technique = "T1105"
        strings:
            $cu = "certutil" nocase
            $url = "-urlcache" nocase
            $dec = "-decode" nocase
            $split = "-split" nocase
            $bits = "bitsadmin" nocase
            $tx = "/transfer" nocase
            $curl = "curl " nocase
            $http = "http" nocase
        condition:
            ($cu and ($url or $dec or $split)) or
            ($bits and $tx) or
            ($curl and $http and ($dec or $url))
    }

    rule LOLBin_Proxy_Execution
    {
        meta:
            score = 75
            severity = "high"
            technique = "T1218"
        strings:
            $mshta = "mshta" nocase
            $js = "javascript:" nocase
            $vbs = "vbscript:" nocase
            $rundll = "rundll32" nocase
            $regsvr = "regsvr32" nocase
            $scrobj = "scrobj" nocase
            $ihttp = "/i:http" nocase
            $http = "http" nocase
        condition:
            ($mshta and ($js or $vbs or $http)) or
            ($rundll and $js) or
            ($regsvr and ($scrobj or $ihttp))
    }

    rule Account_Manipulation_Local
    {
        meta:
            score = 70
            severity = "high"
            technique = "T1136.001"
        strings:
            $net = "net" nocase
            $user = "user" nocase
            $add = "/add" nocase
            $lg = "localgroup" nocase
            $admins = "administrators" nocase
        condition:
            $net and $add and ($user or ($lg and $admins))
    }

    rule PrivEsc_UAC_Bypass_Common
    {
        meta:
            score = 75
            severity = "high"
            technique = "T1548.002"
        strings:
            $fod = "fodhelper" nocase
            $cd = "computerdefaults" nocase
            $mss = "ms-settings" nocase
            $del = "DelegateExecute" nocase
            $ev = "eventvwr" nocase
            $sdc = "sdclt" nocase
        condition:
            $fod or $cd or $sdc or ($mss and $del) or $ev
    }

    rule Defense_Evasion_EventLog_Clear
    {
        meta:
            score = 80
            severity = "high"
            technique = "T1070.001"
        strings:
            $we = "wevtutil" nocase
            $cl = "cl " nocase
            $clr = "clear-log" nocase
            $cle = "Clear-EventLog" nocase
        condition:
            ($we and ($cl or $clr)) or $cle
    }

    rule Defense_Evasion_Disable_Defender
    {
        meta:
            score = 90
            severity = "critical"
            technique = "T1562.001"
        strings:
            $mp = "Set-MpPreference" nocase
            $rt = "DisableRealtimeMonitoring" nocase
            $add = "Add-MpPreference" nocase
            $excl = "ExclusionPath" nocase
            $wd = "WinDefend" nocase
            $scs = "sc stop" nocase
            $scd = "sc config" nocase
            $nf = "netsh advfirewall set" nocase
            $off = "state off" nocase
        condition:
            ($mp and $rt) or ($add and $excl) or
            (($scs or $scd) and $wd) or ($nf and $off)
    }

    rule Defense_Evasion_ShadowCopy_Delete
    {
        meta:
            score = 90
            severity = "critical"
            technique = "T1490"
        strings:
            $vss = "vssadmin" nocase
            $del = "delete" nocase
            $sh = "shadows" nocase
            $wmic = "wmic" nocase
            $scc = "shadowcopy" nocase
            $bcd = "bcdedit" nocase
            $rec = "recoveryenabled" nocase
            $bsp = "bootstatuspolicy" nocase
            $wb = "wbadmin" nocase
            $cat = "catalog" nocase
        condition:
            ($vss and $del and $sh) or
            ($wmic and $scc and $del) or
            ($bcd and ($rec or $bsp)) or
            ($wb and $del and $cat)
    }

    rule Credential_Access_Registry_Hive_Dump
    {
        meta:
            score = 90
            severity = "critical"
            technique = "T1003.002"
        strings:
            $reg = "reg " nocase
            $save = "save" nocase
            $sam = "hklm\\sam" nocase
            $sys = "hklm\\system" nocase
            $sec = "hklm\\security" nocase
        condition:
            $reg and $save and ($sam or $sys or $sec)
    }

    rule Credential_Access_LSASS_Dump
    {
        meta:
            score = 95
            severity = "critical"
            technique = "T1003.001"
        strings:
            $lsass = "lsass" nocase
            $comsvcs = "comsvcs.dll" nocase
            $minidump = "MiniDump" nocase
            $procdump = "procdump" nocase
            $rundll = "rundll32" nocase
        condition:
            ($comsvcs and $minidump) or
            ($rundll and $comsvcs and $lsass) or
            ($procdump and $lsass)
    }

    /*
      Phase 9.2 — file-drop / shimming categorization. These complement the MITRE
      floor (T1546.011 shimming = 45 -> reviewed, T1105 ingress = 70) by RAISING the
      score only when a command line shows the ABUSIVE variant. A bare `sdbinst foo.sdb`
      in a system path stays at the MITRE 45 (reviewed); these fire on the suspicious
      shape (user-writable .sdb, PE written into a Windows system dir) -> auto_promote.
    */

    rule Application_Shimming_Suspicious
    {
        meta:
            score = 60
            severity = "high"
            technique = "T1546.011"
        strings:
            $sdb = "sdbinst" nocase
            $ext = ".sdb" nocase
            // Locations a legitimate system-initiated shim install never uses.
            $p1 = "\\temp\\" nocase
            $p2 = "\\appdata\\" nocase
            $p3 = "\\users\\public" nocase
            $p4 = "\\programdata\\" nocase
            $p5 = "\\downloads\\" nocase
            $p6 = "\\desktop\\" nocase
        condition:
            $sdb and $ext and any of ($p*)
    }

    rule Dropper_Executable_In_System_Dir
    {
        meta:
            score = 65
            severity = "high"
            technique = "T1105"
        strings:
            // write / move verbs (scripts + LOLBins)
            $w1 = "WriteAllBytes" nocase
            $w2 = "DownloadFile" nocase
            $w3 = "-OutFile" nocase
            $w4 = "Move-Item" nocase
            $w5 = "Copy-Item" nocase
            $w6 = "copy " nocase
            $w7 = "Set-Content" nocase
            // Windows system directories — abnormal drop targets for legit installers.
            $d1 = "\\windows\\system32" nocase
            $d2 = "\\windows\\temp" nocase
            $d3 = "c:\\windows\\" nocase
            $d4 = "\\syswow64" nocase
            // executable payload extensions
            $pe1 = ".exe" nocase
            $pe2 = ".dll" nocase
            $pe3 = ".scr" nocase
        condition:
            any of ($w*) and any of ($d*) and any of ($pe*)
    }
  soc-filedrop-content.yar: |
    /*
      soc-filedrop-content.yar — FILE-CONTENT ruleset for the risk-engine /analyze-file
      endpoint (Phase 9.2). A collector base64-encodes a dropped file and POSTs it; the
      engine YARA-scans the raw BYTES (compute_behavior_bytes) — so these rules match a
      binary PE as well as a text script. No `pe`/`math` modules (the engine compiles a
      shared, module-free ruleset): PE detection uses the raw MZ magic + ASCII import
      names, which is enough to categorize a dropper without parsing the PE structure.

      These also live in the SHARED ruleset, so they are tried on command-line buffers
      too — but `$mz at 0` only matches real file bytes, so they never fire on a command
      line. Scores are PRUDENT because /analyze-file verdicts can drive auto actions:
        >=90 escalate | >=70 contained | >=50 auto_promote | >=40 reviewed | <40 none
      A clean signed PE with no suspicious imports scores 0 -> verdict auto_closed.
    */

    rule FileContent_PE_With_Injection_Imports
    {
        meta:
            score = 70
            severity = "high"
            technique = "T1055"
        strings:
            $mz = { 4D 5A }
            $i1 = "VirtualAllocEx" nocase
            $i2 = "WriteProcessMemory" nocase
            $i3 = "CreateRemoteThread" nocase
            $i4 = "NtUnmapViewOfSection" nocase
            $i5 = "SetThreadContext" nocase
            $i6 = "QueueUserAPC" nocase
            $i7 = "RtlMoveMemory" nocase
        condition:
            $mz at 0 and 2 of ($i*)
    }

    rule FileContent_PE_Suspicious_Capabilities
    {
        meta:
            score = 55
            severity = "medium"
            technique = "T1105"
        strings:
            $mz = { 4D 5A }
            $u1 = "URLDownloadToFile" nocase
            $u2 = "WinHttpOpenRequest" nocase
            $u3 = "InternetOpenUrl" nocase
            $s1 = "ShellExecute" nocase
            $s2 = "WinExec" nocase
            $s3 = "CreateProcess" nocase
            $r1 = "RegSetValueEx" nocase
            $r2 = "CurrentVersion\\Run" nocase
        condition:
            $mz at 0 and 2 of them
    }

    rule FileContent_Embedded_Script_Dropper
    {
        meta:
            score = 60
            severity = "high"
            technique = "T1059.001"
        strings:
            $a = "FromBase64String" nocase
            $b = "IEX" nocase
            $c = "Invoke-Expression" nocase
            $d = "DownloadString" nocase
            $e = "DownloadFile" nocase
            $f = "-encodedcommand" nocase
            $g = "[Reflection.Assembly]::Load" nocase
            $h = "VirtualAlloc" nocase
        condition:
            3 of them
    }

    rule FileContent_Script_Obfuscation_Heavy
    {
        meta:
            score = 50
            severity = "medium"
            technique = "T1027"
        strings:
            $c1 = "-join" nocase
            $c2 = "[char]" nocase
            $c3 = "[convert]::" nocase
            $c4 = "-bxor" nocase
            $c5 = "${"
            $c6 = "'+'"
            $c7 = "Invoke-Obfuscation" nocase
        condition:
            4 of them
    }
