# configmap-app-script.yaml — Script Flask du Risk Engine
# Phase 4 GitOps — Risk Engine
# Source : ansible/roles/soc_risk_engine/templates/risk-engine-app.py.j2 (rendu)
# Namespace : soc-thehive
#
# IMPORTANT : les constantes WEIGHTS et THRESHOLDS sont les valeurs rendues
# depuis group_vars/all.yml. Si les poids/seuils changent, mettre à jour ICI
# et relancer un sync ArgoCD pour que le Deployment redémarre.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-risk-engine-app-script
  namespace: soc-thehive
  labels:
    app.kubernetes.io/managed-by: soc-risk-engine
    app.kubernetes.io/component: soc-risk-engine
    soc.lab/playbook: "190-soc-risk-engine"
    soc.lab/environment: dev
  annotations:
    soc.lab/managed-by: "190-soc-risk-engine"
    soc.lab/description: "Flask app script for risk-engine HTTP service (rendered from Ansible template)"
data:
  risk-engine-app.py: |
    # ════════════════════════════════════════════════════════════════════════════════
    # risk-engine-app.py — SOC Risk Engine Flask HTTP service
    # Deployed by: 190-soc-risk-engine → tasks/risk_engine_service.yml
    # Endpoints  : POST /score   — compute 5-dim risk score from Shuffle case context
    #              GET  /health  — return policy version + weights + thresholds
    # ════════════════════════════════════════════════════════════════════════════════
    #
    # Ansible-injected constants (rendered at deploy time — no runtime env vars needed)
    # ── Scoring weights ─────────────────────────────────────────────────────────────
    WEIGHTS = {
        "wazuh":     2,
        "cortex":    3,
        "misp":      4,
        "asset":     2,
        "frequency": 1,
    }
    # ── Decision thresholds (0-100 scale, top-down first-match) ─────────────────────
    THRESHOLDS = {
        "auto_close":   15,
        "auto_promote": 50,
        "auto_contain": 75,
        "escalate":     90,
    }
    # ── Scenario multipliers (Phase 5 multi-scenario) ───────────────────────────────
    # Boost ou soften le score selon le type d'attaque détecté. Appliqué APRÈS le
    # calcul 5-dim, AVANT la décision. Multiplicateur 1.0 si scenario inconnu/absent.
    # Clamp final à [0, 100] pour préserver la grille de décision.
    SCENARIO_MULTIPLIERS = {

        "malware": 1.4,

        "bruteforce": 0.9,

        "privesc": 1.5,

    }
    # ── Behavioral analysis (Phase 9 — PowerShell decode + YARA) ────────────────────
    # The behavior score (0-100) is derived from decoding obfuscated command lines and
    # matching a curated YARA ruleset. It is applied as a SCORE FLOOR (max with the
    # weighted 5-dim score), never as a weighted dimension — so existing tuned scores
    # stay intact and behavior can only RAISE the final risk.
    BEHAVIOR_ENABLED      = True
    ENCODED_PRESENT_SCORE = 50
    # [behavior_score_threshold, min_final_score] — top-down, first match wins.
    BEHAVIOR_FLOORS       = [[90, 90], [70, 75], [50, 50], [40, 20]]
    YARA_RULES_PATH       = "/config/yara"
    # MITRE ATT&CK technique → behavioral severity map (Phase 9.1). Driven by the
    # rule.mitre.id Wazuh already attaches: authoritative classification, O(1) lookup,
    # no command_line dependency. Folded into the same behavioral floor as YARA
    # (max — can only RAISE the score). Runtime override via mounted ConfigMap, with
    # a baked tactic-level fallback so the engine never breaks if the CM is absent.
    MITRE_SEVERITY_PATH  = "/config/mitre-severity.json"
    # Evidence-grade rule registry (Phase 10 / B). rule_id → severity (0-100) for rules
    # whose detection logic is itself high-fidelity evidence (curated allowlist). Folded
    # into _evidence_floor on the CONTENT side (full range) — a confirmed high-fidelity
    # rule can contain/escalate even with NO enrichable IOC. Mounted ConfigMap; absent → {}.
    EVIDENCE_RULES_PATH  = "/config/evidence-rules.json"
    POLICY_VERSION       = "3.0"
    ASSET_WEIGHTS_PATH   = "/config/asset-criticality.json"
    LISTEN_PORT          = 8080
    # Hard cap on /analyze-file content (Phase 9.2 — file-content YARA). A collector
    # (Active Response on the endpoint) base64-encodes a dropped script and POSTs it
    # here; we YARA-scan the actual CONTENT, not just the rule/MITRE classification.
    MAX_ANALYZE_FILE_BYTES = 1048576


    import base64
    import json
    import logging
    import os
    import re
    import sys
    from flask import Flask, request, jsonify

    logging.basicConfig(
        stream=sys.stderr,
        level=logging.INFO,
        format='{"ts":"%(asctime)s","level":"%(levelname)s","msg":"%(message)s"}',
        datefmt="%Y-%m-%dT%H:%M:%SZ",
    )
    logger = logging.getLogger("risk-engine")

    app = Flask(__name__)

    # ── Load asset weights from mounted ConfigMap ─────────────────────────────────
    try:
        with open(ASSET_WEIGHTS_PATH) as f:
            _aw = json.load(f)
        ASSET_WEIGHTS = _aw.get("weights", {})
        logger.info("Asset weights loaded from %s: %s", ASSET_WEIGHTS_PATH, ASSET_WEIGHTS)
    except Exception as exc:
        logger.warning("Cannot load %s: %s — using built-in defaults", ASSET_WEIGHTS_PATH, exc)
        ASSET_WEIGHTS = {"server-prod": 5, "server-internal": 3, "workstation": 2, "lab": 1, "default": 1}


    # ── Load MITRE ATT&CK severity map (Phase 9.1) ────────────────────────────────
    # Baked default is tactic-level only (degraded but safe): if the ConfigMap is
    # absent every MITRE-tagged event still scores by its tactic. The mounted
    # ConfigMap adds the granular per-technique policy (the tunable part).
    _MITRE_DEFAULT = {
        "version": "baked",
        "default": 40,
        "tactics": {
            "impact": 90, "credential access": 90, "exfiltration": 70,
            "privilege escalation": 70, "defense evasion": 70, "lateral movement": 55,
            "command and control": 55, "initial access": 60, "persistence": 50,
            "execution": 45, "collection": 45, "discovery": 35,
            "reconnaissance": 30, "resource development": 30,
        },
        "techniques": {},
    }


    def _normalize_mitre_map(raw):
        return {
            "version":    str(raw.get("version", "configmap")),
            "default":    int(raw.get("default", 40)),
            "tactics":    {str(k).strip().lower(): int(v)
                           for k, v in (raw.get("tactics") or {}).items()},
            "techniques": {str(k).strip().upper(): int(v)
                           for k, v in (raw.get("techniques") or {}).items()},
        }


    try:
        with open(MITRE_SEVERITY_PATH) as f:
            MITRE_SEVERITY = _normalize_mitre_map(json.load(f))
        logger.info("MITRE severity map loaded from %s: v=%s (%d techniques, %d tactics)",
                    MITRE_SEVERITY_PATH, MITRE_SEVERITY["version"],
                    len(MITRE_SEVERITY["techniques"]), len(MITRE_SEVERITY["tactics"]))
    except Exception as exc:
        logger.warning("Cannot load %s: %s — using baked tactic-level MITRE defaults",
                       MITRE_SEVERITY_PATH, exc)
        MITRE_SEVERITY = _normalize_mitre_map(_MITRE_DEFAULT)


    # ── Load evidence-grade rule registry (Phase 10 / B) ──────────────────────────
    # rule_id (str) → severity (int 0-100). Absent/unreadable → empty (no rule is
    # evidence-grade; everything falls back to content/IOC analysis + the tag cap).
    try:
        with open(EVIDENCE_RULES_PATH) as f:
            _er = json.load(f)
        EVIDENCE_RULES = {str(k): int(v) for k, v in (_er.get("rules") or {}).items()}
        logger.info("Evidence-grade rule registry loaded from %s: %d rules",
                    EVIDENCE_RULES_PATH, len(EVIDENCE_RULES))
    except Exception as exc:
        logger.warning("Cannot load %s: %s — no evidence-grade rules", EVIDENCE_RULES_PATH, exc)
        EVIDENCE_RULES = {}


    def _evidence_grade_score(rule_id):
        """Severity for a curated high-fidelity rule_id, else 0. The rule's detection
        logic IS the evidence → treated as CONTENT-grade (full floor range) in /score."""
        if rule_id is None:
            return 0
        if isinstance(rule_id, (int, float)) and not isinstance(rule_id, bool):
            rid = str(int(rule_id))
        elif isinstance(rule_id, str):
            rid = rule_id.strip()
            if not rid or rid.startswith("$"):
                return 0
        else:
            return 0
        return EVIDENCE_RULES.get(rid, 0)


    # ── Defensive coercion helpers ────────────────────────────────────────────────
    # Shuffle injects variables into JSON bodies as plain string substitutions.
    # When a variable resolves to a JSON array/object, it arrives here as a string;
    # when it fails to substitute, it arrives as the literal "$action.path" or "".
    # Every helper below accepts None/str/list/dict and never raises.

    def _safe_int(val, default=0):
        if val is None:
            return default
        if isinstance(val, bool):
            return int(val)
        if isinstance(val, (int, float)):
            return int(val)
        if isinstance(val, str):
            s = val.strip()
            if not s or s.startswith("$"):
                return default
            try:
                return int(float(s))
            except (ValueError, TypeError):
                return default
        return default


    def _coerce_list(val):
        """Accept None, list, dict, or JSON-encoded string. Always return a list.

        Defensive flatten: when the Shuffle workflow body wraps a bare-value
        expression in `[$expr]` to absorb empty-result cases (e.g. Cortex
        InProgress / Failure → '' substitution), a Success case produces a
        single-level nested array [[{...}, {...}]]. Detect and flatten one level
        so the rest of the resolver code (which expects a flat list of dicts)
        keeps working unchanged. v2.5+ (POLICY_VERSION).
        """
        if val is None or val == "":
            return []
        if isinstance(val, list):
            if len(val) == 1 and isinstance(val[0], list):
                return val[0]
            return val
        if isinstance(val, dict):
            # MISP restSearch may return {"Attribute": [...]} when caller passes body.response
            for key in ("Attribute", "attributes", "items", "results"):
                inner = val.get(key)
                if isinstance(inner, list):
                    return inner
            return []
        if isinstance(val, str):
            s = val.strip()
            if not s or s.startswith("$"):
                return []
            try:
                parsed = json.loads(s)
            except (ValueError, TypeError):
                return []
            return _coerce_list(parsed)
        return []


    # Cortex taxonomy "level" enum → numeric 0-3 used by the scoring formula.
    # Cortex returns one of: "info", "safe", "suspicious", "malicious".
    _TAXONOMY_LEVEL_MAP = {
        "info":       0,
        "safe":       0,
        "suspicious": 2,
        "malicious":  3,
    }


    def _taxonomy_level(name):
        if not isinstance(name, str):
            return 0
        return _TAXONOMY_LEVEL_MAP.get(name.strip().lower(), 0)


    def _resolve_cortex_max_level(body):
        """
        Compute the max Cortex taxonomy level across ALL analyzers in the body.
        Cortex result fields are discovered dynamically — every key that starts
        with "cortex_" and ends with "_taxonomy_level" or "_taxonomies" contributes
        (so e.g. cortex_hash_mb_taxonomy_level + cortex_hash_circl_taxonomy_level
        + cortex_taxonomy_level (the IP one) all participate).

        Accepted shapes (any combination, max wins):
          cortex_max_level                            (int 0-3)        ← legacy explicit
          cortex[_*]_taxonomy_level                   (string)         ← single-analyzer shortcut
          cortex[_*]_taxonomies                       (list/JSON-str)  ← per-analyzer taxonomies
        Returns int 0-3 (clamped).
        """
        candidates = []

        if "cortex_max_level" in body:
            candidates.append(max(0, min(3, _safe_int(body.get("cortex_max_level"), 0))))

        for key, val in body.items():
            if not isinstance(key, str) or not key.startswith("cortex"):
                continue
            if key.endswith("_taxonomy_level"):
                if val is None or val == "":
                    continue
                candidates.append(_taxonomy_level(val))
            elif key.endswith("_taxonomies"):
                taxos = _coerce_list(val)
                for t in taxos:
                    if isinstance(t, dict):
                        candidates.append(_taxonomy_level(t.get("level")))

        return max(candidates, default=0)


    def _resolve_misp_hit(body):
        """
        A hit if ANY misp* search returned at least one attribute. Scans all
        body keys matching: misp[_*]_attributes (lists) + misp_response (dict)
        + the legacy misp_hit boolean shortcut.

        Examples consumed by the alert-triage workflow:
          misp_attributes        — search by IP   (action_search_misp)
          misp_hash_attributes   — search by hash (action_search_misp_hash)

        Adding a new misp_*_attributes field in the workflow does NOT require
        an engine change — the resolver discovers it dynamically.
        """
        if "misp_hit" in body:
            v = body.get("misp_hit")
            if isinstance(v, bool):
                return v
            if isinstance(v, str):
                return v.strip().lower() in ("true", "1", "yes")
            return bool(v)

        for key, val in body.items():
            if not isinstance(key, str) or not key.startswith("misp"):
                continue
            if key.endswith("_attributes") or key == "misp_response":
                if len(_coerce_list(val)) > 0:
                    return True

        return False


    # Heuristic asset_type fallback — used when Shuffle could not substitute
    # agent.labels.type (default behaviour: most agents have no labels).
    # Naming conventions are best-effort; ground truth is still agent.labels.type.
    _AGENT_NAME_RULES = (
        (re.compile(r"\b(dc|domain[-_]?controller|ad[-_]?server)\b", re.I),  "server-prod"),
        (re.compile(r"\b(prod|production)[-_]", re.I),                       "server-prod"),
        (re.compile(r"\b(srv|server|wazuh[-_]manager|wazuh[-_]worker)", re.I), "server-internal"),
        (re.compile(r"\b(ws|win|pc|laptop|lap|desktop|wks)[-_]?", re.I),     "workstation"),
    )


    def _resolve_asset_type(body):
        raw = body.get("asset_type")
        if isinstance(raw, str):
            candidate = raw.strip()
            if candidate and not candidate.startswith("$") and candidate in ASSET_WEIGHTS:
                return candidate

        agent_name = body.get("agent_name")
        if isinstance(agent_name, str) and agent_name and not agent_name.startswith("$"):
            for pattern, asset in _AGENT_NAME_RULES:
                if pattern.search(agent_name):
                    if asset in ASSET_WEIGHTS:
                        return asset

        # Wazuh agents are overwhelmingly endpoints; "workstation" is a safer floor
        # than "default" (weight 1) which historically zeroed-out the asset dimension.
        return "workstation" if "workstation" in ASSET_WEIGHTS else "default"


    # ── Behavioral analysis: PowerShell decode + YARA (Phase 9) ─────────────────────
    # Validated by ansible/roles/soc_risk_engine/tests/test_behavior.py (15/15).
    _ENC_RE    = re.compile(r"-e(?:nc|ncodedcommand|ncoded)?\s+([A-Za-z0-9+/=]{16,})", re.I)
    _SHA256_RE = re.compile(r"SHA256=([A-Fa-f0-9]{64})")
    _URL_RE    = re.compile(r"https?://[^\s'\"<>|]+", re.I)
    # Universal artifact extraction (Phase 10 / normalize v2).
    _IPV4_RE   = re.compile(r"^(?:\d{1,3}\.){3}\d{1,3}$")
    _DOMAIN_RE = re.compile(r"^(?=.{1,253}$)(?!-)[A-Za-z0-9-]{1,63}(?:\.[A-Za-z0-9-]{1,63})+$")
    # Hôtes/IP non-routables ou loopback → pas un IOC enrichissable (bruit).
    _IP_SKIP   = ("127.", "0.0.0.0", "::1", "255.255.255.255")

    _YARA = None
    _YARA_TRIED = False


    def _load_yara():
        """Lazily compile the mounted YARA ruleset. Returns None if yara is
        unavailable or no rules are mounted — behavior then degrades to 0 (the
        engine never breaks because YARA is missing)."""
        global _YARA, _YARA_TRIED
        if _YARA_TRIED:
            return _YARA
        _YARA_TRIED = True
        try:
            import yara
            files = {}
            if os.path.isdir(YARA_RULES_PATH):
                for fn in sorted(os.listdir(YARA_RULES_PATH)):
                    if fn.endswith((".yar", ".yara")):
                        files[fn] = os.path.join(YARA_RULES_PATH, fn)
            if files:
                _YARA = yara.compile(filepaths=files)
                logger.info("YARA ruleset compiled from %s (%d file(s))", YARA_RULES_PATH, len(files))
            else:
                logger.warning("No YARA rules found under %s — behavior scoring disabled", YARA_RULES_PATH)
        except Exception as exc:
            logger.warning("YARA unavailable (%s) — behavior scoring disabled", exc)
            _YARA = None
        return _YARA


    def _deep_get(obj, *paths):
        """First non-empty scalar found at any dotted path in a nested dict.
        Ignores unsubstituted Shuffle variables (leading '$')."""
        for path in paths:
            cur = obj
            ok = True
            for part in path.split("."):
                if isinstance(cur, dict) and part in cur:
                    cur = cur[part]
                else:
                    ok = False
                    break
            if ok and isinstance(cur, str) and cur.strip() and not cur.strip().startswith("$"):
                return cur.strip()
            if ok and isinstance(cur, (int, float)) and not isinstance(cur, bool):
                return cur
        return ""


    def _extract_sha256(fields):
        """SHA256 from a direct field — data.hash_sha256 (syslog decoder), data.sha256
        (file-drop collector), syscheck.sha256_after (Wazuh FIM 'file added', NO agent
        script needed) — OR the raw Sysmon eventchannel combined 'Hashes' string
        (MD5=..,SHA256=..,IMPHASH=..)."""
        v = _deep_get(fields, "data.hash_sha256", "data.sha256", "syscheck.sha256_after")
        if isinstance(v, str) and re.fullmatch(r"[A-Fa-f0-9]{64}", v or ""):
            return v.lower()
        raw = _deep_get(fields, "data.win.eventdata.hashes", "data.win.eventdata.Hashes")
        if isinstance(raw, str):
            m = _SHA256_RE.search(raw)
            if m:
                return m.group(1).lower()
        return ""


    def _extract_urls(text):
        if not isinstance(text, str) or not text:
            return []
        return sorted(set(_URL_RE.findall(text)))[:10]


    def _clean_ip(v):
        """Routable-ish IPv4 only — drop loopback/zero/broadcast (not enrichable IOCs)."""
        if not isinstance(v, str):
            return ""
        s = v.strip()
        if not s or s.startswith("$") or not _IPV4_RE.match(s):
            return ""
        if any(s == p or s.startswith(p) for p in _IP_SKIP):
            return ""
        return s


    def _clean_domain(v):
        if not isinstance(v, str):
            return ""
        s = v.strip().rstrip(".").lower()
        if not s or s.startswith("$") or _IPV4_RE.match(s):
            return ""
        return s if _DOMAIN_RE.match(s) else ""


    def _decode_powershell(command_line):
        """UTF-16LE-decoded payload of a PowerShell -EncodedCommand, or ''."""
        if not isinstance(command_line, str) or not command_line:
            return ""
        m = _ENC_RE.search(command_line)
        if not m:
            return ""
        blob = m.group(1)
        for pad in ("", "=", "==", "==="):
            try:
                raw = base64.b64decode(blob + pad)
            except Exception:
                continue
            for enc in ("utf-16-le", "utf-8"):
                try:
                    txt = raw.decode(enc)
                except UnicodeDecodeError:
                    continue
                if txt.isprintable() or "\n" in txt:
                    return txt
        return ""


    def _run_yara(text):
        rules = _load_yara()
        if not rules or not text:
            return []
        try:
            out = []
            for m in rules.match(data=text):
                meta = m.meta or {}
                out.append({
                    "rule":      m.rule,
                    "score":     int(meta.get("score", 0) or 0),
                    "severity":  str(meta.get("severity", "")),
                    "technique": str(meta.get("technique", "")),
                })
            return out
        except Exception as exc:
            logger.warning("YARA match error: %s", exc)
            return []


    _MITRE_TECH_RE = re.compile(r"T\d{4}(?:\.\d{3,})?")


    def _mitre_score(mitre_ids, tactics=None):
        """Max ATT&CK behavioral severity for the technique ids / tactics Wazuh
        attached. ROBUST to however Shuffle renders the arrays — native list, JSON
        string, or python repr ['T1087', ...]: technique ids are regex-extracted and
        tactic names matched as substrings against the policy map. Lookup per id:
        exact technique → base technique (sub stripped). Then tactic fallback, then
        map default. Returns (score 0-100, techniques[list], tactics[list]). 0 when
        no MITRE info is present (so non-tagged events are never floored)."""
        def _txt(v):
            if isinstance(v, str):
                return "" if v.strip().startswith("$") else v
            try:
                return json.dumps(v or [])
            except (TypeError, ValueError):
                return ""

        techs = sorted({m.upper() for m in _MITRE_TECH_RE.findall(_txt(mitre_ids))})
        tac_text = _txt(tactics).lower()
        tac_map  = MITRE_SEVERITY["tactics"]
        tacs = [name for name in tac_map if name and name in tac_text]
        if not techs and not tacs:
            return 0, [], []
        tech_map = MITRE_SEVERITY["techniques"]
        scores = []
        for t in techs:
            if t in tech_map:
                scores.append(tech_map[t])
            else:
                base = t.split(".")[0]
                if base in tech_map:
                    scores.append(tech_map[base])
        for tac in tacs:
            scores.append(tac_map[tac])
        if not scores:
            # MITRE-tagged but nothing in the map → conservative default floor.
            scores.append(MITRE_SEVERITY["default"])
        score = int(max(0, min(100, max(scores))))
        return score, techs, [t.title() for t in tacs]


    def compute_behavior(command_line, mitre_ids=None, tactics=None):
        """Decode + analyze a process command line AND fold in the MITRE ATT&CK
        severity Wazuh attached. behavior_score = max(yara, mitre, encoded-present).
        Returns {behavior_score, encoded, yara_matches, techniques, tactics,
        mitre_score, yara_score, decoded_preview}. Only ever RAISES the final risk
        via behavior_floor() — never a weighted dimension."""
        cl = command_line if isinstance(command_line, str) else ""
        decoded = _decode_powershell(cl)
        encoded = bool(decoded) or bool(_ENC_RE.search(cl))
        buf = (cl + "\n" + decoded) if decoded else cl
        matches = _run_yara(buf)
        yara_score = max([m["score"] for m in matches], default=0)
        mitre_score, mitre_tech, mitre_tac = _mitre_score(mitre_ids, tactics)
        score = max(yara_score, mitre_score)
        if encoded:
            score = max(score, ENCODED_PRESENT_SCORE)
        yara_tech = {m["technique"] for m in matches if m["technique"]}
        techniques = sorted(yara_tech | set(mitre_tech))
        return {
            "behavior_score":  int(max(0, min(100, score))),
            "encoded":         encoded,
            "yara_matches":    [m["rule"] for m in matches],
            "techniques":      techniques,
            "tactics":         mitre_tac,
            "mitre_score":     mitre_score,
            "yara_score":      int(yara_score),
            "decoded_preview": decoded[:160],
        }


    def compute_behavior_bytes(raw):
        """Behavioral analysis of raw FILE bytes (Phase 9.2 /analyze-file).
        YARA scans the bytes DIRECTLY so binary PE rules match — a utf-8 decode
        (the previous behaviour) corrupts non-text bytes and loses PE patterns.
        The PowerShell -enc decode + text command rules are still folded in for
        script droppers via a best-effort utf-8 view.
        behavior_score = max(yara-on-bytes, yara-on-decoded, encoded-present)."""
        raw = raw if isinstance(raw, (bytes, bytearray)) else str(raw).encode("utf-8", "replace")
        matches = _run_yara(raw)
        text = raw.decode("utf-8", "ignore")
        decoded = _decode_powershell(text)
        if decoded:
            matches = matches + _run_yara(decoded)
        yara_score = max([m["score"] for m in matches], default=0)
        encoded = bool(decoded) or bool(_ENC_RE.search(text))
        score = yara_score
        if encoded:
            score = max(score, ENCODED_PRESENT_SCORE)
        techniques = sorted({m["technique"] for m in matches if m["technique"]})
        return {
            "behavior_score":  int(max(0, min(100, score))),
            "encoded":         encoded,
            "yara_matches":    sorted({m["rule"] for m in matches}),
            "techniques":      techniques,
            "tactics":         [],
            "mitre_score":     0,
            "yara_score":      int(yara_score),
            "decoded_preview": decoded[:160],
        }


    def behavior_floor(behavior_score):
        for thresh, floor in BEHAVIOR_FLOORS:
            if behavior_score >= thresh:
                return floor
        return 0


    def _evidence_floor(content_score, mitre_score):
        """Evidence-weighted floor (POLICY 3.0). CONTENT evidence (YARA match on the
        command/file, decoded payload) uses the FULL floor range — it can reach
        contained/escalated because it saw the actual malicious bytes. A MITRE TAG
        ALONE (rule classification, low confidence) is CAPPED at auto_promote: it may
        surface a case for review but NEVER triggers destructive containment/escalation
        on its own ("on ne contient pas juste parce que ça ressemble à une technique").
        Real containment requires corroboration — YARA content here, OR a malicious
        Cortex/MISP verdict via the weighted 5-dim score (which is unaffected by this cap)."""
        content_floor = behavior_floor(content_score)
        mitre_floor = min(behavior_floor(mitre_score), THRESHOLDS["auto_promote"])
        return max(content_floor, mitre_floor)


    # ── Scoring formula ───────────────────────────────────────────────────────────
    def _compute(wazuh_severity: int, cortex_max_level: int, misp_hit: bool,
                 asset_type: str, frequency: int) -> dict:
        """
        5-dim weighted score (0-100):
          wazuh     : (severity[1-4] - 1) / 3 * 100
          cortex    : (max_level[0-3] / 3) * 100
          misp      : 100 if hit else 0  (binary)
          asset     : (weight[1-5] - 1) / 4 * 100
          frequency : min(100, (count[1+] - 1) / 9 * 100)
        score = sum(dim * weight) / sum(weights)
        """
        dim_wazuh     = (max(1, min(4, wazuh_severity)) - 1) / 3 * 100.0
        dim_cortex    = (max(0, min(3, cortex_max_level)) / 3) * 100.0
        dim_misp      = 100.0 if misp_hit else 0.0
        aw            = ASSET_WEIGHTS.get(asset_type, ASSET_WEIGHTS.get("default", 1))
        dim_asset     = (max(1, min(5, int(aw))) - 1) / 4 * 100.0
        dim_frequency = min(100.0, max(0.0, (max(1, frequency) - 1) / 9 * 100.0))

        dims = {
            "wazuh":     round(dim_wazuh,     2),
            "cortex":    round(dim_cortex,    2),
            "misp":      round(dim_misp,      2),
            "asset":     round(dim_asset,     2),
            "frequency": round(dim_frequency, 2),
        }
        total_w = sum(WEIGHTS.values())
        score   = sum(dims[d] * WEIGHTS[d] for d in dims) / total_w
        return {"score": round(score, 2), "dimensions": dims}


    def _decide(score: float) -> str:
        """Top-down threshold evaluation — first match wins."""
        if score >= THRESHOLDS["escalate"]:
            return "escalated"
        if score >= THRESHOLDS["auto_contain"]:
            return "contained"
        if score >= THRESHOLDS["auto_promote"]:
            return "auto_promoted"
        if score < THRESHOLDS["auto_close"]:
            return "auto_closed"
        return "reviewed"


    def _apply_scenario_multiplier(score: float, scenario: str | None) -> tuple[float, float]:
        """
        Apply scenario-specific multiplier and clamp to [0, 100].
        Returns (adjusted_score, multiplier_used).
        Unknown/empty scenario -> multiplier 1.0 (no-op).
        """
        if not scenario or not isinstance(scenario, str):
            return round(score, 2), 1.0
        key = scenario.strip().lower()
        if not key or key.startswith("$"):
            return round(score, 2), 1.0
        mult = SCENARIO_MULTIPLIERS.get(key, 1.0)
        try:
            mult = float(mult)
        except (TypeError, ValueError):
            mult = 1.0
        adjusted = max(0.0, min(100.0, score * mult))
        return round(adjusted, 2), mult


    # ── Deep-triage enrichment orchestration (Phase 10 / C) ─────────────────────────
    # The engine enriches IOCs ITSELF (Cortex + MISP), with a per-IOC TTL cache, so the
    # SOAR does a single /triage call (no conditional fan-out → no Shuffle deadlock) and
    # EVERY event's IOCs get a reputation verdict. Fully graceful: if creds/network are
    # absent (env unset or requests missing) enrichment is skipped (cortex=0/misp=False)
    # and /triage degrades to the same score /score would give without enrichment.
    import time

    try:
        import requests as _requests
    except Exception:
        _requests = None

    CORTEX_URL    = os.environ.get("CORTEX_URL", "").rstrip("/")
    CORTEX_APIKEY = os.environ.get("CORTEX_APIKEY", "")
    MISP_URL      = os.environ.get("MISP_URL", "").rstrip("/")
    MISP_APIKEY   = os.environ.get("MISP_APIKEY", "")
    CORTEX_HASH_ANALYZERS = [a for a in os.environ.get("CORTEX_HASH_ANALYZERS", "").split(",") if a.strip()]
    CORTEX_IP_ANALYZERS   = [a for a in os.environ.get("CORTEX_IP_ANALYZERS", "").split(",") if a.strip()]
    ENRICH_HTTP_TIMEOUT = int(os.environ.get("ENRICH_HTTP_TIMEOUT", "75"))
    ENRICH_CACHE_TTL    = int(os.environ.get("ENRICH_CACHE_TTL", "3600"))
    ENRICH_VERIFY_TLS   = os.environ.get("ENRICH_VERIFY_TLS", "false").lower() in ("1", "true", "yes")
    ENRICH_ENABLED      = bool(_requests and (CORTEX_URL or MISP_URL))

    _enrich_cache = {}  # ioc -> (expiry_epoch, {"cortex_level": int, "misp_hit": bool})


    def _cache_get(key):
        v = _enrich_cache.get(key)
        if v and v[0] > time.time():
            return v[1]
        return None


    def _cache_put(key, val):
        _enrich_cache[key] = (time.time() + ENRICH_CACHE_TTL, val)
        return val


    _CORTEX_CATALOG = None  # {dataType: [analyzer_id, ...]} discovered once from Cortex


    def _get_cortex_analyzers(dtype):
        """Analyzer ids that accept this dataType. Prefer the env override
        (CORTEX_HASH_ANALYZERS / CORTEX_IP_ANALYZERS); else auto-discover from the Cortex
        catalog (GET /api/analyzer), so no analyzer UUID has to be injected. Cached."""
        if dtype == "hash" and CORTEX_HASH_ANALYZERS:
            return CORTEX_HASH_ANALYZERS
        if dtype in ("ip", "domain", "url") and CORTEX_IP_ANALYZERS:
            return CORTEX_IP_ANALYZERS
        global _CORTEX_CATALOG
        if _CORTEX_CATALOG is None:
            _CORTEX_CATALOG = {}
            if _requests and CORTEX_URL and CORTEX_APIKEY:
                try:
                    r = _requests.get(CORTEX_URL + "/api/analyzer",
                                      headers={"Authorization": "Bearer " + CORTEX_APIKEY},
                                      timeout=ENRICH_HTTP_TIMEOUT, verify=ENRICH_VERIFY_TLS)
                    for a in (r.json() or []):
                        if not isinstance(a, dict):
                            continue
                        aid = a.get("id") or a.get("_id") or a.get("analyzerDefinitionId")
                        for dt in (a.get("dataTypeList") or a.get("dataType") or []):
                            _CORTEX_CATALOG.setdefault(str(dt), [])
                            if aid and aid not in _CORTEX_CATALOG[str(dt)]:
                                _CORTEX_CATALOG[str(dt)].append(aid)
                    logger.info("Cortex analyzer catalog discovered: %s",
                                {k: len(v) for k, v in _CORTEX_CATALOG.items()})
                except Exception as exc:
                    logger.warning("Cortex analyzer discovery failed: %s", exc)
        return _CORTEX_CATALOG.get(dtype, [])


    def _cortex_max_level_for(ioc, dtype):
        """Run the Cortex analyzers for this dataType on one IOC, return max taxonomy
        level 0-3. Error-tolerant: any failure → 0 (never breaks triage)."""
        analyzers = _get_cortex_analyzers(dtype)
        if not (_requests and CORTEX_URL and CORTEX_APIKEY and analyzers and ioc):
            return 0
        hdr = {"Authorization": "Bearer " + CORTEX_APIKEY, "Content-Type": "application/json"}
        best = 0
        for az in analyzers:
            try:
                run = _requests.post(CORTEX_URL + "/api/analyzer/" + az + "/run",
                                     json={"data": ioc, "dataType": dtype, "tlp": 2, "message": "auto-triage"},
                                     headers=hdr, timeout=ENRICH_HTTP_TIMEOUT, verify=ENRICH_VERIFY_TLS)
                jid = (run.json() or {}).get("_id") or (run.json() or {}).get("id")
                if not jid:
                    continue
                rep = _requests.get(CORTEX_URL + "/api/job/" + jid + "/waitreport?atMost=60seconds",
                                    headers=hdr, timeout=ENRICH_HTTP_TIMEOUT, verify=ENRICH_VERIFY_TLS)
                taxos = (((rep.json() or {}).get("report") or {}).get("summary") or {}).get("taxonomies") or []
                for t in taxos:
                    if isinstance(t, dict):
                        best = max(best, _taxonomy_level(t.get("level")))
            except Exception as exc:
                logger.warning("cortex %s lookup failed: %s", dtype, exc)
        return best


    def _misp_hit_for(ioc):
        if not (_requests and MISP_URL and MISP_APIKEY and ioc):
            return False
        try:
            r = _requests.post(MISP_URL + "/attributes/restSearch",
                               json={"value": ioc, "returnFormat": "json", "limit": 5},
                               headers={"Authorization": MISP_APIKEY, "Content-Type": "application/json",
                                        "Accept": "application/json"},
                               timeout=ENRICH_HTTP_TIMEOUT, verify=ENRICH_VERIFY_TLS)
            attrs = (((r.json() or {}).get("response") or {}).get("Attribute")) or []
            return len(attrs) > 0
        except Exception as exc:
            logger.warning("misp search failed: %s", exc)
            return False


    def _enrich_one(ioc, dtype):
        """Cached per-IOC enrichment → {"cortex_level": 0-3, "misp_hit": bool}."""
        if not ioc:
            return {"cortex_level": 0, "misp_hit": False}
        cached = _cache_get(ioc)
        if cached is not None:
            return cached
        return _cache_put(ioc, {"cortex_level": _cortex_max_level_for(ioc, dtype),
                                "misp_hit": _misp_hit_for(ioc)})


    def enrich_event(art):
        """Aggregate Cortex max level (0-3) + MISP hit across all IOCs present in the
        extracted-artifacts dict. Returns (cortex_max_level, misp_hit, enriched_iocs)."""
        cortex, misp, seen = 0, False, []
        plan = []
        if art.get("sha256"):
            plan.append((art["sha256"], "hash"))
        for ipk in ("srcip", "dstip"):
            if art.get(ipk):
                plan.append((art[ipk], "ip"))
        if art.get("domain"):
            plan.append((art["domain"], "domain"))
        if art.get("url"):
            plan.append((art["url"], "url"))
        for ioc, dt in plan:
            v = _enrich_one(ioc, dt)
            cortex = max(cortex, v["cortex_level"])
            misp = misp or v["misp_hit"]
            seen.append("%s:%s" % (dt, "hit" if (v["cortex_level"] or v["misp_hit"]) else "clean"))
        return cortex, misp, seen


    def _s(v):
        return v if isinstance(v, str) else ""


    def _extract_artifacts(fields):
        """Universal artifact extraction from a Wazuh event (Phase 10). Returns every
        analyzable artifact. Shared by /triage; /normalize keeps its own (Shuffle-safe)
        extraction for backward compatibility."""
        cl = _deep_get(fields, "data.win.eventdata.commandLine",
                       "data.win.eventdata.CommandLine", "data.command")
        cl = cl if isinstance(cl, str) else ""
        decoded = _decode_powershell(cl)
        urls = _extract_urls((cl + " " + decoded) if decoded else cl)
        return {
            "sha256":  _extract_sha256(fields),
            "srcip":   _clean_ip(_deep_get(fields, "data.srcip", "data.win.eventdata.SourceIp", "data.win.eventdata.IpAddress")),
            "dstip":   _clean_ip(_deep_get(fields, "data.dstip", "data.win.eventdata.DestinationIp", "data.dest_ip")),
            "domain":  _clean_domain(_deep_get(fields, "data.win.eventdata.queryName", "data.dns.question.name",
                                               "data.win.eventdata.DestinationHostname", "data.url")),
            "url":     urls[0] if urls else "",
            "dstuser": _s(_deep_get(fields, "data.dstuser", "data.win.eventdata.targetUserName",
                                    "data.win.eventdata.User", "data.win.eventdata.user")),
            "file_path": _s(_deep_get(fields, "data.win.eventdata.targetFilename", "data.win.eventdata.TargetFilename",
                                      "syscheck.path", "data.audit.file.name", "data.file")),
            "command_line": cl,
            "decoded": decoded,
        }


    # ── Endpoints ─────────────────────────────────────────────────────────────────

    @app.route("/health", methods=["GET"])
    def health():
        return jsonify({
            "status":               "ok",
            "policy_version":       POLICY_VERSION,
            "weights":              WEIGHTS,
            "thresholds":           THRESHOLDS,
            "asset_weights":        ASSET_WEIGHTS,
            "scenario_multipliers": SCENARIO_MULTIPLIERS,
            "behavior": {
                "enabled":               BEHAVIOR_ENABLED,
                "encoded_present_score": ENCODED_PRESENT_SCORE,
                "floors":                BEHAVIOR_FLOORS,
                "yara_loaded":           bool(_load_yara()),
            },
            "mitre": {
                "version":    MITRE_SEVERITY["version"],
                "techniques": len(MITRE_SEVERITY["techniques"]),
                "tactics":    len(MITRE_SEVERITY["tactics"]),
                "default":    MITRE_SEVERITY["default"],
            },
        }), 200


    @app.route("/score", methods=["POST"])
    def score():
        """
        Request body (JSON) — all fields tolerate Shuffle non-substitution ($var as string):
          case_id              : str   — TheHive case ID
          wazuh_severity       : int   — Wazuh rule.level (clamped to 1-4 internally)
          cortex_max_level     : int   — legacy, 0-3
          cortex_taxonomy_level: str   — single Cortex analyzer level string
          cortex_taxonomies    : list  — full taxonomies array (multi-analyzer)
          misp_hit             : bool  — legacy explicit hit flag
          misp_attributes      : list  — MISP restSearch response.Attribute array
          misp_response        : dict  — raw body.response passthrough
          asset_type           : str   — explicit asset class (e.g. "server-prod")
          agent_name           : str   — used for asset_type heuristic fallback
          frequency            : int   — similar alert count in window (>=1)
        """
        body = request.get_json(silent=True)
        if not body:
            return jsonify({"error": "JSON body required"}), 400

        # wazuh_severity is the only mandatory field — fail loudly if Shuffle did
        # not substitute it (literal "$exec.all_fields.rule.level" string). All
        # other dimensions silently default to 0 / safe fallbacks.
        ws_raw = body.get("wazuh_severity")
        if ws_raw is None or (isinstance(ws_raw, str) and (not ws_raw.strip() or ws_raw.strip().startswith("$"))):
            return jsonify({
                "error": "wazuh_severity missing or unsubstituted",
                "received": ws_raw,
            }), 400
        wazuh_severity   = _safe_int(ws_raw, default=1)
        cortex_max_level = _resolve_cortex_max_level(body)
        misp_hit         = _resolve_misp_hit(body)
        asset_type       = _resolve_asset_type(body)
        frequency        = max(1, _safe_int(body.get("frequency"), default=1))
        scenario         = body.get("scenario") or ""
        command_line     = body.get("command_line", "")
        mitre_ids        = body.get("mitre_ids")
        mitre_tactics    = body.get("mitre_tactics")
        # Evidence-grade rule (curated high-fidelity allowlist) → CONTENT-grade floor.
        eg_score         = _evidence_grade_score(body.get("rule_id"))

        result   = _compute(wazuh_severity, cortex_max_level, misp_hit, asset_type, frequency)
        base_score = result["score"]
        adj_score, multiplier = _apply_scenario_multiplier(base_score, scenario)

        # Behavioral floor (Phase 9): decode/analyze the command line and raise the
        # final score to a minimum if a high-confidence TTP is detected. Pure floor —
        # never lowers the weighted score, so existing scenario tuning is preserved.
        # Prefer a pre-computed behavior_score (clean integer from /normalize — avoids
        # passing the quote/backslash-laden command_line through a Shuffle JSON body).
        # Fall back to decoding command_line for direct /score callers (tests, scenarios).
        # MITRE is forwarded as bare-value arrays (proven [$expr] pattern — a quoted
        # "$expr" holding a list corrupts the Shuffle body → SyntaxError, seen live
        # 2026-06-02). Always folded in: behavioral = max(yara behavior_score, mitre).
        m_score, m_tech, m_tac = _mitre_score(mitre_ids, mitre_tactics)
        _bs_in = body.get("behavior_score")
        _bs_valid = _bs_in is not None and not (
            isinstance(_bs_in, str) and (not _bs_in.strip() or _bs_in.strip().startswith("$")))
        if _bs_valid:
            # _yara_bs = CONTENT evidence (YARA/encoded from /normalize, no MITRE folded in).
            # m_score = MITRE TAG. Evidence-weighted floor (POLICY 3.0): content can contain/
            # escalate, the tag alone is capped at auto_promote (never destructive on a tag).
            _yara_bs = max(0, min(100, _safe_int(_bs_in, 0)))
            _bscore = max(_yara_bs, m_score, eg_score)
            behavior = {"behavior_score": _bscore, "yara_score": _yara_bs, "mitre_score": m_score,
                        "evidence_grade": eg_score,
                        "techniques": m_tech, "tactics": m_tac, "source": "normalize+mitre",
                        "yara_matches": body.get("yara_matches") if isinstance(body.get("yara_matches"), list) else []}
            # eg_score (curated rule) joins the CONTENT side — full range, like a YARA hit.
            floor = _evidence_floor(max(_yara_bs, eg_score), m_score)
        elif BEHAVIOR_ENABLED:
            behavior = compute_behavior(command_line, mitre_ids, mitre_tactics)
            behavior["evidence_grade"] = eg_score
            _content = behavior["yara_score"]
            if behavior.get("encoded"):
                _content = max(_content, ENCODED_PRESENT_SCORE)
            floor = _evidence_floor(max(_content, eg_score), behavior.get("mitre_score", 0))
        else:
            behavior = {"behavior_score": eg_score, "encoded": False, "yara_matches": [],
                        "techniques": [], "tactics": [], "mitre_score": 0,
                        "evidence_grade": eg_score, "decoded_preview": ""}
            # Even with YARA disabled, an evidence-grade rule (+ capped MITRE tag) still floors.
            floor = _evidence_floor(eg_score, m_score)
        final_score = round(max(adj_score, float(floor)), 2)
        decision = _decide(final_score)

        resp = {
            "case_id":             body.get("case_id", ""),
            "risk_score":          final_score,
            "risk_score_prefloor": adj_score,
            "risk_score_base":     base_score,
            "behavior_floor":      floor,
            "behavior":            behavior,
            "techniques_csv":      ",".join(behavior.get("techniques", [])),
            "tactics_csv":         ",".join(behavior.get("tactics", [])),
            "scenario":            scenario if isinstance(scenario, str) else "",
            "scenario_mult":       multiplier,
            "risk_decision":       decision,
            "dimensions":          result["dimensions"],
            "policy_version":      POLICY_VERSION,
            "inputs": {
                "wazuh_severity":   max(1, min(4, wazuh_severity)),
                "cortex_max_level": cortex_max_level,
                "misp_hit":         misp_hit,
                "asset_type":       asset_type,
                "frequency":        frequency,
                "scenario":         scenario if isinstance(scenario, str) else "",
            },
        }
        logger.info(
            "case=%s score=%.1f (base=%.1f mult=%.2f floor=%d behavior=%d%s scenario=%s) decision=%s "
            "wazuh_sev=%d cortex=%d misp_hit=%s asset=%s freq=%d",
            resp["case_id"], final_score, base_score, multiplier, floor,
            behavior["behavior_score"], (" yara=%s" % ",".join(behavior["yara_matches"]) if behavior["yara_matches"] else ""),
            scenario, decision, max(1, min(4, wazuh_severity)), cortex_max_level, misp_hit, asset_type, frequency,
        )
        return jsonify(resp), 200


    @app.route("/normalize", methods=["POST"])
    def normalize():
        """
        Extract clean, single-value IOCs from a raw Wazuh alert so the SOAR can
        dispatch analyzers conditionally (and skip empty inputs — the root cause of
        the alert-triage deadlock). Accepts {"all_fields": {...}} or the raw alert.
        Returns: sha256, srcip, dstuser, command_line, decoded (PS), urls[].
        Works for both Windows Sysmon eventchannel and Linux/syslog events.
        """
        body = request.get_json(silent=True) or {}
        fields = body.get("all_fields") if isinstance(body.get("all_fields"), dict) else body

        sha256  = _extract_sha256(fields)
        cl      = _deep_get(fields, "data.win.eventdata.commandLine",
                            "data.win.eventdata.CommandLine", "data.command")
        srcip   = _clean_ip(_deep_get(fields, "data.srcip", "data.win.eventdata.SourceIp",
                                      "data.win.eventdata.IpAddress"))
        dstuser = _deep_get(fields, "data.dstuser", "data.win.eventdata.targetUserName",
                            "data.win.eventdata.User", "data.win.eventdata.user")
        cl = cl if isinstance(cl, str) else ""
        decoded = _decode_powershell(cl)
        urls = _extract_urls((cl + " " + decoded) if decoded else cl)

        # ── Universal artifact extraction (Phase 10 / normalize v2) ──────────────────
        # Every enrichable IOC the event carries, so the SOAR can dispatch the RIGHT
        # analyzer per type (deep-triage) instead of scoring on a rule/tag heuristic.
        dstip   = _clean_ip(_deep_get(fields, "data.dstip", "data.win.eventdata.DestinationIp",
                                      "data.dest_ip", "data.dstip2"))
        domain  = _clean_domain(_deep_get(fields, "data.win.eventdata.queryName",
                                          "data.dns.question.name", "data.win.eventdata.DestinationHostname",
                                          "data.url"))
        url     = urls[0] if urls else ""
        srcuser = _deep_get(fields, "data.srcuser", "data.win.eventdata.subjectUserName",
                            "data.win.eventdata.sourceUser")
        file_path = _deep_get(fields, "data.win.eventdata.targetFilename",
                              "data.win.eventdata.TargetFilename", "syscheck.path",
                              "data.audit.file.name", "data.file")
        process = _deep_get(fields, "data.win.eventdata.image", "data.win.eventdata.Image",
                            "data.process.name")
        parent  = _deep_get(fields, "data.win.eventdata.parentImage",
                            "data.win.eventdata.ParentImage")
        srcuser   = srcuser if isinstance(srcuser, str) else ""
        file_path = file_path if isinstance(file_path, str) else ""
        process   = process if isinstance(process, str) else ""
        parent    = parent if isinstance(parent, str) else ""

        # Compute the YARA/decode behavioral score HERE (we already hold the raw command
        # line). The SOAR forwards only the integer behavior_score to /score — never the
        # raw command_line, whose quotes/backslashes corrupt the Shuffle body (hang
        # 2026-05-31). MITRE is NOT handled here: rule.mitre.id is an array that, sent
        # via a Shuffle template body, corrupts the JSON (SyntaxError, seen 2026-06-02).
        # It is forwarded to /score as a bare-value [$expr] instead, and folded there.
        beh = compute_behavior(cl) if BEHAVIOR_ENABLED else {"behavior_score": 0, "yara_matches": [], "techniques": []}

        # IMPORTANT: do NOT return the raw command_line / decoded in the response.
        # Their quotes/backslashes/`$` (PowerShell vars) corrupt Shuffle's handling of
        # the NEXT action and ABORT the workflow (observed live 2026-05-31: events WITH
        # a commandLine aborted before risk_engine; events without it succeeded). We
        # return only Shuffle-safe scalars, plus the command base64-encoded (quote/$-free)
        # so the SOAR can attach it as an observable without corrupting any JSON body.
        command_b64 = base64.b64encode(cl.encode("utf-8", "replace")).decode() if cl else ""
        decoded_b64 = base64.b64encode(decoded.encode("utf-8", "replace")).decode() if decoded else ""

        # Enrichable externally (Cortex/MISP reputation) vs locally (YARA on command).
        enrichable = bool(sha256 or srcip or dstip or domain or url or file_path)
        has_analyzable = bool(enrichable or cl)
        analysis_inputs = sum(bool(x) for x in
                              (sha256, srcip, dstip, domain, url, file_path, cl))

        return jsonify({
            "sha256":         sha256,
            "srcip":          srcip,
            "dstip":          dstip,
            "domain":         domain,
            "url":            url,            # premier URL (scalaire Shuffle-safe)
            "dstuser":        dstuser if isinstance(dstuser, str) else "",
            "srcuser":        srcuser,
            "file_path":      file_path,
            "process":        process,
            "parent":         parent,
            "behavior_score": beh["behavior_score"],
            "yara_matches":   beh.get("yara_matches", []),
            "techniques":     beh.get("techniques", []),
            "command_b64":    command_b64,   # base64(raw command line) — decode to read
            "decoded_b64":    decoded_b64,   # base64(decoded PowerShell payload)
            # Flags de présence par type (le SOAR dispatch l'analyseur conditionnellement)
            "has_command":    bool(cl),
            "url_count":      len(urls),
            "has_sha256":     bool(sha256),
            "has_srcip":      bool(srcip),
            "has_dstip":      bool(dstip),
            "has_domain":     bool(domain),
            "has_url":        bool(url),
            "has_file":       bool(file_path),
            "has_dstuser":    bool(dstuser),
            # has_ioc : compat (hash|srcip). enrichable : tout IOC enrichissable externe.
            "has_ioc":        bool(sha256 or srcip),
            "enrichable":     enrichable,
            "has_analyzable": has_analyzable,
            "analysis_inputs": analysis_inputs,
        }), 200


    @app.route("/analyze-file", methods=["POST"])
    def analyze_file():
        """
        Analyze the CONTENT of a dropped file (Phase 9.2) — not just its rule/MITRE
        classification. A collector (endpoint Active Response) base64-encodes the file
        and POSTs it here; we YARA-scan the decoded content and return a verdict.

        Request body (JSON):
          content_b64 : str  — base64 of the raw file bytes (REQUIRED)
          file_path   : str  — original path on the endpoint (for context/logging)
          agent       : str  — agent name (context)
        Response: behavior_score (0-100), yara_matches, techniques, techniques_csv,
                  behavior_floor, verdict (decision tier from the floor), size_bytes.
        The verdict mirrors /score decision tiers so the SOAR can branch identically
        (auto_closed / reviewed / auto_promoted / contained / escalated).
        """
        body = request.get_json(silent=True) or {}
        b64 = body.get("content_b64", "")
        file_path = body.get("file_path", "") if isinstance(body.get("file_path"), str) else ""
        # Graceful no-op (HTTP 200, behavior 0) when no content is present — e.g. a
        # Wazuh FIM 'file added' event routes here through the same join but carries
        # only a hash, no content_b64. Returning 200 (not 400) keeps the Shuffle join
        # intact (a 4xx can flip the action to failed → broken join → deadlock).
        if not isinstance(b64, str) or not b64.strip() or b64.strip().startswith("$"):
            return jsonify({"note": "no content_b64 — hash-only source (e.g. FIM)",
                            "behavior_score": 0, "verdict": "auto_closed",
                            "yara_matches": [], "techniques": [], "techniques_csv": "",
                            "behavior_floor": 0, "size_bytes": 0,
                            "policy_version": POLICY_VERSION}), 200
        try:
            raw = base64.b64decode(b64, validate=False)[:MAX_ANALYZE_FILE_BYTES]
        except Exception as exc:
            return jsonify({"error": "invalid base64: %s" % exc,
                            "behavior_score": 0, "verdict": "auto_closed",
                            "yara_matches": [], "techniques": [], "techniques_csv": "",
                            "behavior_floor": 0, "size_bytes": 0,
                            "policy_version": POLICY_VERSION}), 200

        # YARA scans the raw BYTES (binary PE rules + text rules both match);
        # never utf-8-decode first — that corrupts a PE and drops its patterns.
        beh = compute_behavior_bytes(raw) if BEHAVIOR_ENABLED else {
            "behavior_score": 0, "yara_matches": [], "techniques": []}
        floor = behavior_floor(beh["behavior_score"])
        verdict = _decide(float(floor))   # tier from the behavioral floor alone
        techniques = beh.get("techniques", [])
        logger.info("analyze-file path=%s size=%d behavior=%d verdict=%s yara=%s",
                    file_path, len(raw), beh["behavior_score"], verdict,
                    ",".join(beh.get("yara_matches", [])) or "-")
        return jsonify({
            "file_path":      file_path,
            "behavior_score": beh["behavior_score"],
            "yara_matches":   beh.get("yara_matches", []),
            "techniques":     techniques,
            "techniques_csv": ",".join(techniques),
            "behavior_floor": floor,
            "verdict":        verdict,
            "size_bytes":     len(raw),
            "truncated":      len(raw) >= MAX_ANALYZE_FILE_BYTES,
            "policy_version": POLICY_VERSION,
        }), 200


    @app.route("/triage", methods=["POST"])
    def triage():
        """Deep-triage (Phase 10 / C): ONE call that analyzes an event end-to-end so the
        SOAR never fans out (no Shuffle deadlock). Steps: extract every artifact →
        enrich IOCs via Cortex+MISP (cached, server-side) → behavioral (YARA/decode) +
        MITRE(capped) + evidence-grade rule → evidence-weighted score → decision.
        Accepts {"all_fields": {...}} or the raw alert. Fully graceful: no creds/network
        → enrichment skipped, falls back to the local (behavior+rule) score.
        """
        body = request.get_json(silent=True) or {}
        fields = body.get("all_fields") if isinstance(body.get("all_fields"), dict) else body

        art = _extract_artifacts(fields)
        rule = fields.get("rule") if isinstance(fields.get("rule"), dict) else {}
        agent = fields.get("agent") if isinstance(fields.get("agent"), dict) else {}
        mitre = rule.get("mitre") if isinstance(rule.get("mitre"), dict) else {}

        # DUAL-MODE: prefer clean SCALARS in the body (Shuffle-safe, from /normalize) over
        # raw-field extraction. Raw all_fields sent through a Shuffle body can corrupt it
        # (quotes/backslashes in command_line) — the recommended workflow is
        # normalize → /triage(scalars). Direct all_fields (tests) still works via fallback.
        def _scalar(key):
            v = body.get(key)
            return v.strip() if isinstance(v, str) and v.strip() and not v.strip().startswith("$") else ""
        for _k in ("sha256", "srcip", "dstip", "domain", "url", "file_path"):
            _sv = _scalar(_k)
            if _sv:
                art[_k] = _sv

        rule_id = _scalar("rule_id") or rule.get("id")
        _ws = body.get("wazuh_severity")
        _ws_ok = _ws is not None and not (isinstance(_ws, str) and (not _ws.strip() or _ws.strip().startswith("$")))
        wazuh_severity = max(1, _safe_int(_ws if _ws_ok else rule.get("level"), 1))
        eg_score = _evidence_grade_score(rule_id)
        mitre_ids = body.get("mitre_ids") if body.get("mitre_ids") is not None else mitre.get("id")
        mitre_tactics = body.get("mitre_tactics") if body.get("mitre_tactics") is not None else mitre.get("tactic")
        m_score, m_tech, m_tac = _mitre_score(mitre_ids, mitre_tactics)

        # CONTENT evidence: prefer a precomputed behavior_score (clean int from /normalize),
        # else compute locally from the command line.
        _bs = body.get("behavior_score")
        _bs_ok = _bs is not None and not (isinstance(_bs, str) and (not _bs.strip() or _bs.strip().startswith("$")))
        if _bs_ok:
            content = max(0, min(100, _safe_int(_bs, 0)))
            beh = {"behavior_score": content, "yara_matches": [], "techniques": []}
        elif BEHAVIOR_ENABLED:
            beh = compute_behavior(art["command_line"])
            content = beh["yara_score"]
            if beh.get("encoded"):
                content = max(content, ENCODED_PRESENT_SCORE)
        else:
            beh = {"behavior_score": 0, "yara_matches": [], "techniques": []}
            content = 0

        # IOC reputation (Cortex/MISP, cached, graceful).
        cortex_level, misp_hit, enriched = enrich_event(art)

        asset_type = _resolve_asset_type({"asset_type": _scalar("asset_type") or _deep_get(agent, "labels.type"),
                                          "agent_name": _scalar("agent_name") or agent.get("name")})
        frequency = 1
        result = _compute(wazuh_severity, cortex_level, misp_hit, asset_type, frequency)
        base_score = result["score"]
        floor = _evidence_floor(max(content, eg_score), m_score)
        final_score = round(max(base_score, float(floor)), 2)
        decision = _decide(final_score)

        techniques = sorted(set(beh.get("techniques", [])) | set(m_tech))
        logger.info("triage agent=%s rule=%s decision=%s score=%.1f (cortex=%d misp=%s eg=%d "
                    "content=%d mitre=%d) iocs=%s",
                    agent.get("name", "?"), rule.get("id", "?"), decision, final_score,
                    cortex_level, misp_hit, eg_score, content, m_score, ",".join(enriched) or "-")
        return jsonify({
            "risk_score":      final_score,
            "risk_decision":   decision,
            "risk_score_base": base_score,
            "behavior_floor":  floor,
            "dimensions":      result["dimensions"],
            "techniques_csv":  ",".join(techniques),
            "tactics_csv":     ",".join(m_tac),
            "enrichment": {
                "enabled":          ENRICH_ENABLED,
                "cortex_max_level": cortex_level,
                "misp_hit":         misp_hit,
                "iocs":             enriched,
            },
            "evidence": {
                "content_score":  content,
                "mitre_score":    m_score,
                "evidence_grade": eg_score,
            },
            "artifacts": {k: art[k] for k in ("sha256", "srcip", "dstip", "domain", "url",
                                              "file_path", "dstuser")},
            "policy_version": POLICY_VERSION,
        }), 200


    if __name__ == "__main__":
        logger.info("Starting risk-engine service on port %d", LISTEN_PORT)
        app.run(host="0.0.0.0", port=LISTEN_PORT, debug=False)
