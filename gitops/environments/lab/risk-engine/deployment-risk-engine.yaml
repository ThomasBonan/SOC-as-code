# deployment-risk-engine.yaml — Déploiement Flask HTTP du Risk Engine SOC
# Phase 4 GitOps — Risk Engine
# Source : ansible/roles/soc_risk_engine/templates/deployment-risk-engine.yml.j2
# Namespace : soc-thehive
#
# Architecture :
#   Init container : installe Flask dans emptyDir /app/libs
#   Main container : python:3.11-slim, PYTHONPATH=/app/libs, exécute risk-engine-app.py
#   Config source  : script depuis ConfigMap soc-risk-engine-app-script (/app/)
#                    poids assets depuis soc-asset-criticality (/config/)
#   Sécurité       : readOnlyRootFilesystem=true, runAsUser=1000, non-root
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: soc-thehive
  labels:
    app: risk-engine
    app.kubernetes.io/managed-by: soc-risk-engine
    app.kubernetes.io/component: soc-risk-engine
    soc.lab/playbook: "190-soc-risk-engine"
    soc.lab/environment: dev
  annotations:
    soc.lab/managed-by: "190-soc-risk-engine"
    soc.lab/description: "SOC Risk Engine HTTP service — POST /score, GET /health"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
        app.kubernetes.io/managed-by: soc-risk-engine
        app.kubernetes.io/component: soc-risk-engine
        soc.lab/playbook: "190-soc-risk-engine"
        soc.lab/environment: dev
      # SHA256(data.risk-engine-app.py) — recalculé par _bump-checksums.py.
      # Tout changement du script ci-contre invalide l'annotation, ce qui force
      # K8s à effectuer un rolling restart du Deployment (sinon le ConfigMap est
      # mis à jour mais le pod conserve la version montée — bug observé 2026-05-17).
      annotations:
        checksum/script: "8feb9bb955185d97ed41a4e4736b812f7a612a42e249ab2d0eea2404f9dd33fc"
        # SHA256 des règles YARA montées — recalculé par _bump-checksums.py. Un
        # changement de ruleset roll le pod (sinon le CM est mis à jour mais yara
        # reste compilé en mémoire — yara est compilé une seule fois au boot).
        checksum/yara: "b4bd3408241cadf37b85262e3685012380a3c71211dc69ce7d219ee132e7a87f"
        # SHA256 de la table MITRE montée — recalculé par _bump-checksums.py. La
        # map est chargée une fois au boot (module load) → un changement doit
        # rouler le pod, sinon le CM est sync mais la sévérité reste l'ancienne.
        checksum/mitre: "f962a18ef143ca927f73fc2286cb13c57130119a547b98df1a4070d2bf05b859"
        # SHA256 du registre evidence-grade monté — recalculé par _bump-checksums.py.
        # Chargé une fois au boot → un changement doit rouler le pod.
        checksum/evidence: "79869f9fd147ce8638b14e91750ab81019b3fe823d79bebf2da9acf69ae5c365"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # ── Init container : installe Flask dans un emptyDir partagé ──────────────
      initContainers:
        - name: install-flask
          image: python:3.11-slim
          command:
            - pip
            - install
            - "flask==3.1.0"
            - "yara-python==4.5.4"
            - "requests==2.32.3"
            - "--target=/app/libs"
            - "--no-cache-dir"
            - "--quiet"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: libs
              mountPath: /app/libs

      # ── Container principal : service Flask risk engine ───────────────────────
      containers:
        - name: risk-engine
          image: python:3.11-slim
          command: ["python", "/app/risk-engine-app.py"]
          env:
            - name: PYTHONPATH
              value: /app/libs
            # Deep-triage (Phase 10 / C) : le moteur enrichit lui-même via Cortex/MISP.
            # URLs = services .svc INTERNES (le pod ne résout PAS apps.soc.lab — domaine
            # Ingress/MetalLB hors CoreDNS ; vérifié 2026-06-06). Mêmes URLs que Shuffle.
            # CORTEX_URL = base SANS /api (le moteur ajoute /api/...). Clés API depuis le
            # secret soc-automation-worker-creds (même ns). Absents -> enrichment off (graceful).
            - name: CORTEX_URL
              value: "http://cortex.soc-cortex.svc:9001"
            - name: CORTEX_APIKEY
              valueFrom: { secretKeyRef: { name: soc-automation-worker-creds, key: CORTEX_API_KEY, optional: true } }
            - name: MISP_URL
              value: "https://misp.soc-core.svc:443"
            - name: MISP_APIKEY
              valueFrom: { secretKeyRef: { name: soc-automation-worker-creds, key: MISP_API_KEY, optional: true } }
            - name: ENRICH_VERIFY_TLS
              value: "false"          # CA interne soc-lab-ca (lab)
            - name: ENRICH_CACHE_TTL
              value: "3600"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu:    50m
              memory: 128Mi
            limits:
              cpu:    200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds:       30
            failureThreshold:    3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds:       10
            failureThreshold:    3
          volumeMounts:
            # Script applicatif (lecture seule depuis ConfigMap)
            - name: app-script
              mountPath: /app/risk-engine-app.py
              subPath:   risk-engine-app.py
              readOnly:  true
            # Poids des assets (lecture seule depuis ConfigMap)
            - name: asset-config
              mountPath: /config/asset-criticality.json
              subPath:   asset-criticality.json
              readOnly:  true
            # Règles YARA comportementales (lecture seule depuis ConfigMap)
            - name: yara-rules
              mountPath: /config/yara
              readOnly:  true
            # Table MITRE ATT&CK technique->severite (lecture seule depuis ConfigMap)
            - name: mitre-severity
              mountPath: /config/mitre-severity.json
              subPath:   mitre-severity.json
              readOnly:  true
            # Registre evidence-grade rule_id->severite (lecture seule depuis ConfigMap)
            - name: evidence-rules
              mountPath: /config/evidence-rules.json
              subPath:   evidence-rules.json
              readOnly:  true
            # Volumes emptyDir accessibles en écriture
            - name: libs
              mountPath: /app/libs
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: app-script
          configMap:
            name: soc-risk-engine-app-script
        - name: asset-config
          configMap:
            name: soc-asset-criticality
        - name: yara-rules
          configMap:
            name: soc-risk-engine-yara-rules
        - name: mitre-severity
          configMap:
            name: soc-mitre-severity
        - name: evidence-rules
          configMap:
            name: soc-evidence-rules
        - name: libs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
