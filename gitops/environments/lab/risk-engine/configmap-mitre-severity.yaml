# configmap-mitre-severity.yaml — Table MITRE ATT&CK technique -> severite (Phase 9.1)
# Source : ansible/roles/soc_risk_engine/files/mitre-severity.json
# Montee en lecture seule sur /config/mitre-severity.json, chargee par le risk-engine
# au demarrage. Signal comportemental primaire derive de rule.mitre.id (Wazuh).
# Applique comme PLANCHER (max avec le score pondere 5-dim) — ne fait que MONTER le score.
#
# DRIFT GUARD : si ce fichier change, ArgoCD sync le CM mais le pod ne redemarre pas
# tout seul (volume CM). Le risk-engine charge la map au boot -> relancer un rollout :
#   kubectl -n soc-thehive rollout restart deployment/risk-engine
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-mitre-severity
  namespace: soc-thehive
  labels:
    app.kubernetes.io/managed-by: soc-risk-engine
    app.kubernetes.io/component: soc-risk-engine
    soc.lab/playbook: "190-soc-risk-engine"
    soc.lab/environment: dev
  annotations:
    soc.lab/managed-by: "190-soc-risk-engine"
    soc.lab/description: "MITRE ATT&CK technique->severity map for the risk-engine behavioral floor."
data:
  mitre-severity.json: |
    {
      "version": "1.0-2026-06-02",
