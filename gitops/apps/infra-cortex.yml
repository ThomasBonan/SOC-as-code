---
# infra-cortex.yml — Cortex (StrangeBee Helm chart)
# Phase C GitOps — migré depuis le rôle Ansible cortex (110-cortex.yml)
# La configuration API post-install (analyzers, RBAC) reste dans Ansible 130-soc-config.yml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-cortex
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: soc-gitops
    soc.lab/component: argocd
    soc.lab/layer: application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://strangebeecorp.github.io/helm-charts
    chart: cortex
    targetRevision: "1.1.1"
    helm:
      releaseName: cortex
      values: |
        cortex:
          replicaCount: 1
          updateStrategy:
            type: Recreate
          # Lit le httpSecret depuis le Secret K8s provisionné par ESO (Vault → soc-cortex)
          k8sSecretName: "cortex-secret"
          k8sSecretKey: "httpSecret"
          configFile: |
            # Cortex configuration file
            auth.providers: [local, key]
            analyzer {
              urls: [
                "file:///opt/cortex/catalog/analyzers.json",
                "https://catalogs.download.strangebee.com/latest/json/analyzers.json",
              ]
              fork-join-executor {
                parallelism-min: 8,
                parallelism-factor: 1.0,
                parallelism-max: 8,
              }
            }
            responder {
              urls: [
                "https://catalogs.download.strangebee.com/latest/json/responders.json",
              ]
              fork-join-executor {
                parallelism-min: 8,
                parallelism-factor: 1.0,
                parallelism-max: 8,
              }
            }
            search {
              password = ""
              user = ${?CORTEX_ELASTICSEARCH_USERNAME}
              password = ${?CORTEX_ELASTICSEARCH_PASSWORD}
            }
            play.http.parser.maxDiskBuffer = 100MB
            play.http.parser.maxMemoryBuffer = 100MB
          volumes:
            - name: analyzers-catalog
              configMap:
                name: cortex-analyzers-catalog
                optional: true
          volumeMounts:
            - name: analyzers-catalog
              mountPath: /opt/cortex/catalog
              readOnly: true
          persistentVolumeClaim:
            create: true
            storageClass: "longhorn"
            accessModes:
              - ReadWriteMany
            size: "5Gi"
          serviceAccount:
            create: true
            name: cortex
        elasticsearch:
          enabled: true
          master:
            replicaCount: 1
          data:
            replicaCount: 1
          coordinating:
            replicaCount: 0
          ingest:
            replicaCount: 0
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: soc-cortex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        - /spec/template/spec/volumes
        - /spec/template/spec/containers/0/volumeMounts
    - kind: ConfigMap
      name: cortex-config
      jsonPointers:
        - /data/application.conf
