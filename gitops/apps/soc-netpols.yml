# soc-netpols.yml — Application NetworkPolicies applicatives SOC
# Phase 3 GitOps — Wazuh, TheHive, Cortex, MISP, Vault, ArgoCD
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: soc-netpols
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: soc-gitops
    soc.lab/component: argocd
    soc.lab/layer: network
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ThomasBonan/SOC-as-code.git
    targetRevision: main
    path: gitops/environments/lab/netpols
  destination:
    server: https://kubernetes.default.svc
    # Pas de namespace ici : chaque NetworkPolicy déclare le sien (soc-wazuh, soc-thehive, etc.)
  syncPolicy:
    automated:
      prune: true       # Phase 8 — purge les policies retirées de Git
      selfHeal: true    # Réconciliation automatique si drift détecté
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false   # Les namespaces SOC doivent déjà exister
    # Retries généreux : les ns cibles (soc-wazuh, soc-vault, soc-monitoring) sont
    # créés par les playbooks Day-1 (76, 90) qui s'exécutent APRÈS soc-app-of-apps.
    # Sans ces retries, ArgoCD abandonne après 5 tentatives et l'App reste OutOfSync
    # jusqu'à un sync manuel. Avec ces retries, ArgoCD attend que les ns arrivent.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
