apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: soc-eso-externalsecrets
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: soc-gitops
    soc.lab/component: argocd
    soc.lab/layer: security
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ThomasBonan/SOC-as-code.git
    targetRevision: main
    path: gitops/environments/lab/eso
  destination:
    server: https://kubernetes.default.svc
    # Pas de namespace ici : chaque ExternalSecret déclare le sien dans metadata.namespace
  # Ignorer les champs injectés par ESO qui ne sont pas dans nos manifests git
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - ".spec.data[].remoteRef.conversionStrategy"
        - ".spec.data[].remoteRef.decodingStrategy"
        - ".spec.data[].remoteRef.metadataPolicy"
        - ".spec.target.deletionPolicy"
  syncPolicy:
    automated:
      prune: true       # Phase 8 — purge les secrets retirés de Git
      selfHeal: true    # Réconciliation automatique si drift détecté
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true    # ArgoCD crée les ns si absents ; idempotent avec Ansible day-1
    # Race bootstrap : soc-app-of-apps crée cette App avant que les CRDs ESO
    # ne soient installés par 75-vault.yml (--tags eso,deploy). Sans retry étendu,
    # ArgoCD abandonne après 5 tentatives (~3 min) et l'App reste OutOfSync à vie.
    # limit=30 + backoff factor 2 (max 5m) couvre ~2h, large pour vault-deploy + ESO.
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
